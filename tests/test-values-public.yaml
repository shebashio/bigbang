addons:  
  keycloak:
    ingress:
      key: "" # Clear this out to make sure the existing logic works as expected
      cert: "" # Clear this out to make sure the existing logic works as expected
    values:
      upstream:
        extraVolumes: |-
          - name: keycloak-conf
            emptyDir: {}
          - name: import-data
            emptyDir: {}
          - name: plugin
            emptyDir: {}
        extraVolumeMounts: |-
          - name: keycloak-conf
            mountPath: /opt/keycloak/conf/custom-registration-config.yaml
            subPath: custom-registration-config.yaml
          - name: keycloak-conf
            mountPath: /opt/keycloak/conf/quarkus.properties
            subPath: quarkus.properties
          - name: import-data
            mountPath: /opt/keycloak/data/import/realm.json
            subPath: realm.json
          - name: plugin
            mountPath: /opt/keycloak/providers/p1-keycloak-plugin.jar
            subPath: p1-keycloak-plugin.jar