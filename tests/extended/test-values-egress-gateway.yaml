istio:
  ambient:
    enabled: true
  egressGateway:
    enabled: true

# Shared egress allowlist rendered by the istio-egress-gateway package, which
# delegates ServiceEntry + AuthorizationPolicy generation to bb-common: one
# ServiceEntry per host bound to the waypoint, plus an ALLOW per consumer
# namespace. This replaces per-package egress ServiceEntries for shared hosts,
# so consumer packages keep bbtests off (no per-package repo1 ServiceEntry to
# collide with the central one).
# NOTE: the git.branch override is temporary. The branch vendors bb-common 1.7.0
# (adds the outbound-route `from` field, bb-common#110). Drop the override once
# the package tag ships the feature against a released bb-common 1.7.0.
istioEgressGateway:
  git:
    branch: add-egress-service-entries
    tag: null
  values:
    serviceEntries:
      # repo1.dso.mil is the cypress network-wait-online target for every
      # package helm test. With the egress gateway on, the per-package bb-tests
      # routes are gated off, so every namespace that runs a cypress test must
      # be admitted here or its network-wait-online init container fails.
      repo1.dso.mil:
        consumers:
          - alloy
          - kiali
          - kyverno-reporter
          - logging
          - monitoring
          - neuvector
          - tempo

grafana:
  enabled: true
monitoring:
  enabled: true
  values:
    bbtests:
      enabled: false
certManager:
  enabled: true
  values:
    bbtests:
      enabled: false
kyverno:
  values:
    bbtests:
      enabled: false
kyvernoPolicies:
  values:
    bbtests:
      enabled: false