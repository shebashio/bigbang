# Overlay for tests/test-values.yaml. This file is not a standalone values file.
istio:
  ambient:
    enabled: true

# In ambient CI the dependency namespace is enrolled through its Namespace
# label, so ztunnel can enforce the generated HBONE AuthorizationPolicies.
packages:
  gitlab-garage:
    # Lists replace rather than merge across Helm values files. Repeat the
    # sidecar dependency and add the ambient data-plane components explicitly.
    dependsOn:
      - name: istiod
        namespace: bigbang
      - name: istio-cni
        namespace: bigbang
      - name: ztunnel
        namespace: bigbang
    values:
      bb-common:
        istio:
          enabled: true
          mtls:
            mode: STRICT
          sidecar:
            enabled: false
          authorizationPolicies:
            enabled: true
            generateFromNetpol: true
