packageConfiguration:
  version: v1

minioOperator:
  repoName: "minio-operator"
  hrName: "minio-operator"
  filePath: "minio-operator"
minio:
  dependencies:
    - "minioOperator"
gitlabRunner:
  repoName: "gitlab-runner"
  hrName: "gitlab-runner"
  filePath: "gitlab-runner"
  dependencies:
    - "gitlab"
anchoreEnterprise:
  repoName: "anchore-enterprise"
  hrName: "anchore-enterprise"
mattermostOperator:
  repoName: "mattermost-operator"
  hrName: "mattermost-operator"
  filePath: "mattermost-operator"
mattermost:
  dependencies:
    - "mattermostOperator"
    - "minioOperator"
    - "elasticsearchKibana"
velero:
  dependencies:
    - "minio"
    - "minioOperator"
vault:
  dependencies:
    - "minioOperator"
metricsServer:
  repoName: "metrics-server"
  hrName: "metrics-server"
  filePath: "metrics-server"
externalSecrets:
  repoName: "external-secrets"
  hrName: "external-secrets"
  filePath: "external-secrets"
headlamp:
  repoName: "headlamp"
  hrName: "headlamp"
  filePath: "headlamp"
certManager:
  repoName: "cert-manager"
  hrName: "cert-manager"
  filePath: "cert-manager"
packages:
  istiod:
    repoName: "istiod"
    hrName: "istiod"
    filePath: "istiod"
  istioCNI:
    repoName: "istio-cni"
    hrName: "istio-cni"
    filePath: "istio-cni"
  istioCRDs:
    repoName: "istio-crds"
    hrName: "istio-crds"
    filePath: "istio-crds"
  istioGateway:
    repoName: "istio-gateway"
    hrName: "public-ingressgateway"
    filePath: "istio-gateway"
  istioEgressGateway:
    repoName: "istio-egress-gateway"
    hrName: "istio-egress-gateway"
    filePath: "istio-egress-gateway"
  gatekeeper:
    repoName: "policy"
  kyvernoPolicies:
    repoName: "kyverno-policies"
    hrName: "kyverno-policies"
    filePath: "kyverno-policies"
  kyvernoReporter:
    repoName: "kyverno-reporter"
    hrName: "kyverno-reporter"
    filePath: "kyverno-reporter"
    dependencies:
      - "kyvernoPolicies"
  elasticsearchKibana:
    repoName: "elasticsearch-kibana"
    hrName: "ek"
    filePath: "elasticsearch-kibana"
    dependencies:
      - "fluentbit"
  eckOperator:
    repoName: "eck-operator"
    hrName: "eck-operator"
    filePath: "eck-operator"
    dependencies:
      - "elasticsearchKibana"
      - "fluentbit"
  fluentbit:
    hrName: "fluentbit"
    filePath: "fluentbit"
  loki:
    dependencies:
      - "minioOperator"
      - "alloy"
  prometheusOperatorCRDs:
    repoName: "prometheus-operator-crds"
    hrName: "prometheus-operator-crds"
    filePath: "prometheus-operator-crds"
