# This chart is only an internal Big Bang CI operand for testing GitLab. It is
# not a supported development or production PostgreSQL deployment.
fullnameOverride: postgresql

imagePullSecrets:
  - name: private-registry

cluster:
  instances: 1
  imageName: registry1.dso.mil/ironbank/opensource/postgres/postgresql:17.10
  postgresUID: 1001
  postgresGID: 1001
  storage:
    size: 8Gi
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 1
      memory: 1Gi
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
    sharedPreloadLibraries:
      - pg_stat_statements

database:
  name: gitlabhq_production
  owner: gitlab
  credentials:
    existingSecret: ""
    secretName: postgresql-app
    username: gitlab
    password: gitlab-ci-postgresql-password
  postInitApplicationSQL:
    - CREATE EXTENSION IF NOT EXISTS pg_trgm;
    - CREATE EXTENSION IF NOT EXISTS btree_gist;
    - CREATE EXTENSION IF NOT EXISTS plpgsql;
    - CREATE EXTENSION IF NOT EXISTS amcheck;
    - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

readiness:
  enabled: true
  image: registry1.dso.mil/ironbank/opensource/postgres/postgresql:17.10
  intervalSeconds: 5
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
