apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cluster.instances }}
  imageName: {{ .Values.cluster.imageName | quote }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  postgresUID: {{ .Values.cluster.postgresUID }}
  postgresGID: {{ .Values.cluster.postgresGID }}
  storage:
    size: {{ .Values.cluster.storage.size | quote }}
  resources:
    {{- toYaml .Values.cluster.resources | nindent 4 }}
  postgresql:
    parameters:
      {{- toYaml .Values.cluster.postgresql.parameters | nindent 6 }}
    shared_preload_libraries:
      {{- toYaml .Values.cluster.postgresql.sharedPreloadLibraries | nindent 6 }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name | quote }}
      owner: {{ .Values.database.owner | quote }}
      {{- with .Values.database.postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- toYaml . | nindent 8 }}
      {{- end }}
