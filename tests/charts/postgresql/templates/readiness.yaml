{{- if .Values.readiness.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postgresql.fullname" . }}-readiness
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: readiness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "postgresql.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: readiness
  template:
    metadata:
      labels:
        {{- include "postgresql.labels" . | nindent 8 }}
        app.kubernetes.io/component: readiness
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: readiness
          image: {{ .Values.readiness.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
          args:
            - -ec
            - |
              while true; do
                if PGPASSWORD="${PGPASSWORD}" psql \
                  --host={{ include "postgresql.fullname" . }}-rw.{{ .Release.Namespace }}.svc.cluster.local \
                  --port=5432 \
                  --username="${PGUSER}" \
                  --dbname="${PGDATABASE}" \
                  --command='SELECT 1' >/dev/null; then
                  touch /ready/connected
                else
                  rm -f /ready/connected
                fi
                sleep {{ .Values.readiness.intervalSeconds }}
              done
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.applicationSecret" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.applicationSecret" . }}
                  key: password
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -f /ready/connected
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.readiness.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: readiness
              mountPath: /ready
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: readiness
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
