{{- if .Values.istio.ambient.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "postgresql.fullname" . }}-ambient-clients
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "postgresql.fullname" . }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace | quote }}
              - {{ .Values.istio.ambient.gitlabNamespace | quote }}
      to:
        - operation:
            ports:
              - "5432"
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" .Values.istio.ambient.operator.namespace .Values.istio.ambient.operator.serviceAccount | quote }}
      to:
        - operation:
            ports:
              - "8000"
{{- end }}
