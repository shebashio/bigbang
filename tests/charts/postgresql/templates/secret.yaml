{{- if not .Values.database.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.credentialsSecret" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.credentials.username | quote }}
  password: {{ .Values.database.credentials.password | quote }}
{{- end }}
