suite: PostgreSQL CI helper
templates:
  - templates/secret.yaml
  - templates/cluster.yaml
  - templates/readiness.yaml
tests:
  - it: creates PostgreSQL 17 with GitLab initialization
    template: templates/cluster.yaml
    asserts:
      - isKind:
          of: Cluster
      - equal:
          path: metadata.name
          value: postgresql
      - equal:
          path: spec.imageName
          value: registry1.dso.mil/ironbank/opensource/postgres/postgresql:17.10
      - equal:
          path: spec.bootstrap.initdb.database
          value: gitlabhq_production
      - equal:
          path: spec.bootstrap.initdb.owner
          value: gitlab
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: postgresql-app
      - contains:
          path: spec.bootstrap.initdb.postInitApplicationSQL
          content: CREATE EXTENSION IF NOT EXISTS pg_trgm;

  - it: creates the initdb credentials Secret by default
    template: templates/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: postgresql-app
      - equal:
          path: type
          value: kubernetes.io/basic-auth
      - notExists:
          path: stringData.dbname

  - it: can reference an existing initdb Secret
    template: templates/cluster.yaml
    set:
      database.credentials.existingSecret: supplied-postgresql-app
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: supplied-postgresql-app

  - it: suppresses the generated Secret when an existing Secret is supplied
    template: templates/secret.yaml
    set:
      database.credentials.existingSecret: supplied-postgresql-app
    asserts:
      - hasDocuments:
          count: 0

  - it: gates Flux readiness on live PostgreSQL connectivity
    template: templates/readiness.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: postgresql-readiness
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - exists:
          path: spec.template.metadata.annotations["checksum/database-credentials"]
      - matchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: (?s)postgresql-rw.*SELECT 1
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: gitlabhq_production
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          value: test -f /ready/connected
