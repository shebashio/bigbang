istio:
  ambient:
    enabled: true

# TEMP: sidecar -> ambient migration only. Revert (remove this whole block) once
# every neuvector pod is ambient.
#
# NeuVector controllers cluster over Consul by raw pod IP, so during the mixed
# sidecar/ambient window a sidecar peer reaches an ambient peer WITHOUT an mTLS
# identity and STRICT denies it. Two ztunnel layers block it, so both are relaxed
# here via bb-common:
#   1. PeerAuthentication -> PERMISSIVE  (accept non-mTLS)
#   2. AuthorizationPolicy -> allow-all  (the default allow-in-namespace matches on
#      source identity, which no-identity passthrough traffic cannot satisfy)
neuvector:
  values:
    istio:
      mtls:
        mode: PERMISSIVE
      authorizationPolicies:
        custom:
          - name: neuvector-migration-allow-all
            spec:
              action: ALLOW
              rules:
                - {}
