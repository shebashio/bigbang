{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.renovate.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.renovate
  "name" "renovate"
  "bbCommonSubchart" true
  "supportsRouteDefaults" true
  "defaults" (include "bigbang.defaults.renovate" .)
) }}
{{- end }}

{{- define "bigbang.defaults.renovate" -}}
{{- $domainName := default .Values.domain .Values.hostname }}
global:
  domain: {{ $domainName }}

openshift: {{ .Values.openshift }}

{{- include "secretsImagePullSecretsWithName" . }}

image:
  pullPolicy: {{ .Values.imagePullPolicy }}

bb-common:
  networkPolicies:
    egress:
      from:
        renovate:
          to:
            definition:
              storage-subnets: true

monitoring:
  enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}

{{- end -}}
