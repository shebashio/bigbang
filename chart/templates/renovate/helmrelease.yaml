{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsRenovate := mergeOverwrite (deepCopy .Values.flux) .Values.packages.renovate.flux -}}
{{- if .Values.packages.renovate.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/renovate/values.yaml") . | sha256sum }}
spec:
  targetNamespace: renovate
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "renovate" "package" .Values.packages.renovate "root" . "emitReleaseName" true) | nindent 2 }}
  {{- toYaml $fluxSettingsRenovate | nindent 2 }}
  {{- if .Values.packages.renovate.postRenderers }}
  postRenderers:
  {{- with .Values.packages.renovate.postRenderers }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "renovate" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.renovate.dependsOnOverride) }}
  {{- with .Values.packages.renovate.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.gitlab.enabled .Values.packages.renovate.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.gitlab.enabled }}
    - name: gitlab
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.renovate) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
