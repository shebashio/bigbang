{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsNeuvector := mergeOverwrite (deepCopy .Values.flux) .Values.packages.neuvector.flux -}}
{{- if .Values.packages.neuvector.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: neuvector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: "sandbox"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/neuvector/values.yaml") . | sha256sum }}
spec:
  targetNamespace: neuvector
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "neuvector" "package" .Values.packages.neuvector "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsNeuvector | nindent 2 }}

  {{- if .Values.packages.neuvector.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.neuvector.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "neuvector" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.neuvector.dependsOnOverride) }}
  {{- with .Values.packages.neuvector.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled (and .Values.packages.keycloak.enabled .Values.packages.neuvector.sso.enabled) .Values.packages.neuvector.dependsOn }}
  dependsOn:
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if and .Values.packages.keycloak.enabled .Values.packages.neuvector.sso.enabled }}
    - name: keycloak
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.neuvector) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
