{{- include "bigbang.normalizePackageAliases" . -}}
{{- define "bigbang.defaults.neuvector" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}

# Check for existing NeuVector exporter secret, otherwise generate new random password
{{- $existingSecret := lookup "v1" "Secret" "neuvector" "neuvector-prometheus-exporter-pod-secret" }}
{{- $neuvectorMetricsPass := "" }}
{{- if $existingSecret }}
  {{- $neuvectorMetricsPass = (get $existingSecret.data "CTRL_PASSWORD" | b64dec) }}
{{- else }}
  # Includes suffix of "A1a" to ensure password always meets default minimum password requirements
  {{- $neuvectorMetricsPass = join "" (list (randAlphaNum 12) (randAlpha 2 | upper) (randAlpha 2 | lower) (randNumeric 2)) }}
{{- end }}

# hostname is deprecated and replaced with domain. But if hostname exists then use it.
global:
  domain: {{ default .Values.domain .Values.hostname }}

bb-common:
  routes:
    inbound:
      neuvector:
        gateways:
          - {{ include "getGatewayName" (dict "gateway" .Values.packages.neuvector.ingress.gateway "root" .)}}
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.neuvector.values }}
        hosts:
        - repo1.dso.mil

  networkPolicies:
    egress:
      from:
        controller:
          podSelector:
            matchLabels:
              app: neuvector-controller-pod
          to:
            definition:
              sso: {{ .Values.packages.neuvector.sso.enabled }}

bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://neuvector.%s" .Values.domain | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.neuvector "values" .Values) | nindent 6 }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

upstream:
  
  {{- include "secretsImagePullSecretsSingle" . | nindent 2 }}

  openshift: {{ .Values.openshift }}
  {{- if or .Values.packages.monitoring.enabled $istioEnabled .Values.packages.neuvector.sso.enabled }}
  controller:
    {{- if $istioEnabled }}
    podAnnotations:
      {{ include "istioAnnotation" . }}
    {{- end }}
    {{- if or .Values.packages.monitoring.enabled .Values.packages.neuvector.sso.enabled }}
    secret:
      enabled: true
      data: 
        {{- if .Values.packages.monitoring.enabled }}
        userinitcfg.yaml:
          always_reload: true
          users:
          - username: metrics
            password: {{ $neuvectorMetricsPass }}
            role: reader
            fullname: metrics
        {{- end }}
        {{- if .Values.packages.neuvector.sso.enabled }}
        oidcinitcfg.yaml:
          always_reload: true
          enable: {{ .Values.packages.neuvector.sso.enabled }}
          issuer: {{ default (include "sso.url" .) (tpl (default "" .Values.packages.neuvector.sso.issuer) .) }}
          client_id: {{ .Values.packages.neuvector.sso.client_id }}
          client_secret: {{ .Values.packages.neuvector.sso.client_secret | default "no-secret" }}
          default_role: {{ .Values.packages.neuvector.sso.default_role }}
          group_claim: {{ .Values.packages.neuvector.sso.group_claim }}
          {{- if .Values.packages.neuvector.sso.group_mapped_roles }}
          group_mapped_roles: 
            {{- toYaml .Values.packages.neuvector.sso.group_mapped_roles | nindent 10 }}
          {{- else }}
          group_mapped_roles: []
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if and .Values.packages.neuvector.sso.enabled (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
    sso:
      certificateAuthority:
        secretName: {{ default (dig "certificateAuthority" "secretName" "" .Values.sso) .Values.sso.secretName }}
    {{- end }}
  {{- end }}

  {{- if $istioEnabled }}
  enforcer:
    podAnnotations:
      {{ include "istioAnnotation" . }}
  cve:
    updater:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    scanner:
      podAnnotations:
        {{ include "istioAnnotation" . }}
  manager:
    podAnnotations:
      {{ include "istioAnnotation" . }}
  {{- end }}

monitor:
  install: {{ eq (include "metricScrapingEnabled" .) "true" }}

  {{- include "secretsImagePullSecretsSingle" . | nindent 2 }}

  exporter:
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    {{- if or (eq (include "metricScrapingEnabled" .) "true") $istioEnabled }}
    podAnnotations:
      {{- if eq (include "metricScrapingEnabled" .) "true" }}
      checksum/metrics-pass: {{ sha256sum $neuvectorMetricsPass }}
      {{- end }}
      {{- if $istioEnabled }}
      {{ include "istioAnnotation" . }}
      {{- end }}
    {{- end }}
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.packages.neuvector .)) "true" }}
      scheme: https
      tlsConfig:
        caFile: /etc/prom-certs/root-cert.pem
        certFile: /etc/prom-certs/cert-chain.pem
        keyFile: /etc/prom-certs/key.pem
        insecureSkipVerify: true
      {{- end }}

    svc:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
      type: ClusterIP
    CTRL_USERNAME: metrics
    CTRL_PASSWORD: {{ $neuvectorMetricsPass }}

{{- end }}

{{- /* Create secret */ -}}
{{- if .Values.packages.neuvector.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.neuvector
  "name" "neuvector"
  "bbCommonSubchart" true
  "supportsRouteDefaults" true
  "defaults" (include "bigbang.defaults.neuvector" .)
) }}
{{- end }}
