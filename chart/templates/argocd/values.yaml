{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.argocd.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.argocd
  "name" "argocd"
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.argocd" .)
)}}
{{- end }}

{{- define "bigbang.defaults.argocd" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $externalRedisEnabled := not (empty .Values.packages.argocd.redis.host) }}
{{- $externalRedisPort := default 6379 .Values.packages.argocd.redis.port }}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
redis-bb:
  networkPolicy:
    enabled: {{ .Values.networkPolicies.enabled }}
  {{- if $externalRedisEnabled }}
  enabled: false
  {{- else }}
  enabled: true
  {{- end }}

  upstream:
    image:
      pullPolicy: {{ .Values.imagePullPolicy }}
      # This clears out our forces value in the package.  We should use the global values set below
      # This can be removed when we remove the overrides at the package level 
      pullSecrets: []
    auth:
      enabled: false
    metrics:
    {{- if eq (include "metricScrapingEnabled" .) "true" }}
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argocd
        selector:
          app.kubernetes.io/name: redis-bb
          app.kubernetes.io/instance: argocd-argocd
        {{- if eq (include "metricsSidecarMtls" (list .Values.packages.argocd .)) "true" }}
        scheme: https
        tlsConfig:
          caFile: /etc/prom-certs/root-cert.pem
          certFile: /etc/prom-certs/cert-chain.pem
          keyFile: /etc/prom-certs/key.pem
          insecureSkipVerify: true
        {{- end }}
  
      prometheusRule:
        enabled: true
        namespace: monitoring
    {{- else }}
      enabled: false
    {{- end }}
  {{- if $istioEnabled }}
    master:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    replica:
      podAnnotations:
        {{ include "istioAnnotation" . }}
  {{- end }}

createNamespace: false

global:
  {{- $argocdHosts := (dig "bb-common" "routes" "inbound" "argocd" "hosts" list .Values.packages.argocd.values) }}
  {{- if $argocdHosts }}
  domain: {{ tpl ($argocdHosts | first) $ }}
  {{- else }}
  domain: argocd.{{ $domainName }}
  {{- end }}
  image:
    imagePullPolicy: {{ .Values.imagePullPolicy }}
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
{{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
{{- end }}
{{- if .Values.packages.kiali.enabled }}
  podLabels:
    service.istio.io/canonical-name: argocd-argocd
{{- end }}

monitoring:
  enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}

routes:
  inbound:
    argocd:
      enabled: true
      gateways:
      - {{ include "getGatewayName" (dict "gateway" .Values.packages.argocd.ingress.gateway "root" .)}}
      hosts:
      - argocd.{{ $domainName }}
      service: argocd-argocd-server
      containerPort: 8080
      port: 80
      selector:
        app.kubernetes.io/name: argocd-server
  outbound:
    bb-tests:
      enabled: {{ dig "bbtests" "enabled" false .Values.packages.argocd.values }}
      hosts:
      - 'repo1.dso.mil'
    {{- if $externalRedisEnabled }}
    external-redis:
      enabled: true
      hosts:
      - {{ .Values.packages.argocd.redis.host | quote }}
      ports:
      - number: {{ $externalRedisPort }}
        name: redis
        protocol: TCP
    {{- end }}

networkPolicies:
  ingress:
    to:
      # -- Ingress to argocd-server for metrics from prometheus
      argocd-server:8083:
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      # -- Ingress to argocd-repo-server for metrics from prometheus
      argocd-repo-server:8084:
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      # -- Ingress to argocd-application-controller for metrics from prometheus
      argocd-application-controller:8082:
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      # -- Ingress to redis from grafana for dashboards
      redis-bb:6379:
        from:
          k8s:
            monitoring/grafana: {{ and (not $externalRedisEnabled) (dig "redis-bb" "enabled" true .Values.packages.argocd.values) .Values.packages.grafana.enabled }}
      # -- Ingress to redis-exporter for metrics from prometheus
      redis-bb:9121:
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and (not $externalRedisEnabled) (dig "redis-bb" "enabled" true .Values.packages.argocd.values) .Values.packages.monitoring.enabled }}
  egress:
  {{- if empty .Values.networkPolicies.egress.definitions.kubeAPI }}
    definitions:
      kubeAPI:
        to:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.controlPlaneCidr }}
            {{- if eq .Values.networkPolicies.controlPlaneCidr "0.0.0.0/0" }}
            except:
            - 169.254.169.254/32
            {{- end }}
        {{- if not (eq .Values.networkPolicies.controlPlaneCidr .Values.networkPolicies.vpcCidr) }}
        {{- if not (eq .Values.networkPolicies.vpcCidr "0.0.0.0/0") }}
        - ipBlock:
            cidr: {{ .Values.networkPolicies.vpcCidr }}
        {{- end }}
        {{- end }}
  {{- end }}
    from:
      # -- Egress to tempo for tracing from all pods
      "*":
        to:
          definition:
            redis-subnets: {{ $externalRedisEnabled }}
          k8s:
            tempo/tempo:9411: {{ and .Values.packages.tempo.enabled (ne (include "ambientEnabled" .) "true") }}

bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://argocd.%s" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.argocd "values" .Values) | nindent 6 }}
  scripts:
    envs:
      ARGOCD_SERVER: {{ printf "https://argocd.%s" $domainName | quote }}

upstream:
  {{- if .Values.packages.argocd.redis.host }}
  externalRedis: 
    host: {{ default "argocd-argocd-redis-bb-headless.argocd.svc.cluster.local" .Values.packages.argocd.redis.host }}
    port: {{ default 6379 .Values.packages.argocd.redis.port }}
  {{- end }}
  {{- if .Values.packages.argocd.sso.enabled }}
  configs:
    cm:
      oidc.config: |
        name: {{ default .Values.sso.name .Values.packages.argocd.sso.provider_name }}
        issuer: {{ include "sso.url" . }}
        clientID: {{ .Values.packages.argocd.sso.client_id }}
        clientSecret: {{ .Values.packages.argocd.sso.client_secret }}
        requestedScopes: ["openid","ArgoCD"]
        {{- if (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
        rootCA: |
          {{- default (dig "certificateAuthority" "cert" "" .Values.sso) .Values.sso.certificate_authority | nindent 10 }}
        {{- end }}
    {{- if .Values.packages.argocd.sso.groups }}
    rbac:
      policy.csv: |
        {{- .Values.packages.argocd.sso.groups | nindent 8 }}
    {{- end }}
    {{- if .Values.packages.argocd.sso.client_secret }}
    secret:
      extra:
        keycloakClientSecret: {{ .Values.packages.argocd.sso.client_secret }}
    {{- end }} 
  {{- end }}
  openshift:
    enabled: {{ .Values.openshift }}

  controller:
    image:
      imagePullPolicy: {{ .Values.imagePullPolicy }}
    {{- if eq (include "metricsSidecarMtls" (list .Values.packages.argocd .)) "true" }}
    metrics:
      serviceMonitor:
        scheme: https
        tlsConfig:
          caFile: /etc/prom-certs/root-cert.pem
          certFile: /etc/prom-certs/cert-chain.pem
          keyFile: /etc/prom-certs/key.pem
          insecureSkipVerify: true
    {{- end }}
  
  dex:
    image:
      imagePullPolicy: {{ .Values.imagePullPolicy }}
  
  server:
    image:
      imagePullPolicy: {{ .Values.imagePullPolicy }}
    autoscaling:
      enabled: true
    config:
      # Must be enabled for plugins included in PlatformOne image.
      kustomize.buildOptions: "--enable-alpha-plugins"
    {{- if eq (include "metricsSidecarMtls" (list .Values.packages.argocd .)) "true" }}
    metrics:
      serviceMonitor:
        scheme: https
        tlsConfig:
          caFile: /etc/prom-certs/root-cert.pem
          certFile: /etc/prom-certs/cert-chain.pem
          keyFile: /etc/prom-certs/key.pem
          insecureSkipVerify: true
    {{- end }}
  
  repoServer:
    image:
      imagePullPolicy: {{ .Values.imagePullPolicy }}
    autoscaling:
      enabled: true
    # conditional that will attach the argocd-iam-secret environment variables containing AWS credentials from argocd values for SOPS on the repo-server deployment.
    {{- $awskeyid := dig "addons" "argocd" "values" "awsCredentials" "awsAccessKeyId" false (.Values | merge (dict)) }}
    {{- $awssecret := dig "addons" "argocd" "values" "awsCredentials" "awsSecretAccessKey" false (.Values | merge (dict)) }}
    {{- if and $awskeyid $awssecret }}
    envFrom:
    - secretRef:
        name: argocd-iam-secret
    {{- end }}     
    {{- if eq (include "metricsSidecarMtls" (list .Values.packages.argocd .)) "true" }}
    metrics:
      serviceMonitor:
        scheme: https
        tlsConfig:
          caFile: /etc/prom-certs/root-cert.pem
          certFile: /etc/prom-certs/cert-chain.pem
          keyFile: /etc/prom-certs/key.pem
          insecureSkipVerify: true
    {{- end }}

{{- end -}}
