{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsArgo := mergeOverwrite (deepCopy .Values.flux) .Values.packages.argocd.flux -}}
{{- if .Values.packages.argocd.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/argocd/values.yaml") . | sha256sum }}
spec:
  targetNamespace: argocd
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "argocd" "package" .Values.packages.argocd "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsArgo | nindent 2 }}

  {{- if .Values.packages.argocd.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.argocd.postRenderers | nindent 4 }}
  {{- end }}

  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "argocd" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.argocd.dependsOnOverride) }}
  {{- with .Values.packages.argocd.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.monitoring.enabled $istioEnabled .Values.packages.argocd.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
  {{- include "istioHelmReleases" . | nindent 2 }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
  - name: monitoring
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.argocd) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}
