{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsLoki := mergeOverwrite (deepCopy .Values.flux) .Values.packages.loki.flux -}}
{{- if .Values.packages.loki.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/loki/values.yaml") . | sha256sum }}
spec:
  releaseName: {{ default "logging-loki" .Values.packages.loki.releaseName }}
  targetNamespace: logging
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "loki" "package" .Values.packages.loki "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsLoki | nindent 2 }}

  {{- if or .Values.packages.loki.postRenderers (and $istioEnabled (eq .Values.packages.loki.strategy "distributed")) }}
  postRenderers:
  {{- if and $istioEnabled (eq .Values.packages.loki.strategy "distributed") }}
  {{- include "loki.istioPostRenderers" . | nindent 2 }}
  {{- end }}
  {{- if .Values.packages.loki.postRenderers }}
  {{ toYaml .Values.packages.loki.postRenderers | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "loki" "root" .) | nindent 2 }}
  {{- if not (kindIs "invalid" .Values.packages.loki.dependsOnOverride) }}
  {{- with .Values.packages.loki.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.monitoring.enabled .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.loki.dependsOn }}
  dependsOn:
    {{- if  .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if  .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.minioOperator.enabled }}
    - name: minio-operator
      namespace: {{ $.Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.loki) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
