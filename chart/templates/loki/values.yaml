{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.loki.enabled }}
{{- include "values-secret" (dict 
  "root" $ 
  "package" .Values.packages.loki
  "name" "loki" 
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.loki" .)
)}}
{{- end }}

{{- define "bigbang.defaults.loki" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- /* The shared metrics helper expects mesh settings at values.istio. */ -}}
{{- $lokiMeshConfig := deepCopy .Values.packages.loki -}}
{{- $_ := set $lokiMeshConfig "values" (index .Values.packages.loki.values "bb-common" | default dict) -}}
{{- $minioEnabled := dig "minio" "enabled" false .Values.packages.loki.values }}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
global:
  domain: {{ $domainName }}

clusterName: ""

openshift: {{ .Values.openshift }}

bb-common:
  routes:
    inbound:
      loki:
        gateways:
          - {{ include "getGatewayName" (dict "gateway" "public" "root" .)}}
        hosts:
          - loki.{{ .Values.domain }}
        {{- if ne .Values.packages.loki.strategy "monolith" }}
        service: logging-loki-gateway.logging.svc.cluster.local
        port: {{ dig "gateway" "service" "port" 80 .Values.packages.loki.values }}
        containerPort: {{ dig "gateway" "containerPort" 8080 .Values.packages.loki.values }}
        {{- else }}
        service: logging-loki.logging.svc.cluster.local
        port: {{ dig "loki" "server" "http_listen_port" 3100 .Values.packages.loki.values }}
        containerPort: {{ dig "loki" "server" "http_listen_port" 3100 .Values.packages.loki.values }}
        {{- end }}
        selector:
          app.kubernetes.io/name: logging-loki
          # Be more specific when using a distributed so simple scalable deployment mode
          {{- if ne .Values.packages.loki.strategy "monolith" }}
          app.kubernetes.io/component: gateway
          {{- end }}
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.loki.values }}
        hosts:
        - repo1.dso.mil
        - grafana.{{ $domainName }}

  networkPolicies:
    ingress:
      to:
        logging-loki:3100:
          from:
            k8s:
              alloy-alloy-operator@alloy/alloy: {{ .Values.packages.alloy.enabled }}
              alloy-alloy-logs@alloy/alloy-logs: {{ .Values.packages.alloy.enabled }}
              alloy-alloy-singleton@alloy/alloy-singleton: {{ and .Values.packages.alloy.enabled (dig "alloyClusterEvents" "enabled" false .Values.packages.alloy) }}
              fluentbit-fluent-bit@fluentbit/fluent-bit: {{ .Values.packages.fluentbit.enabled }}
              monitoring-grafana@monitoring/grafana: {{ and .Values.packages.grafana.enabled (eq .Values.packages.loki.strategy "monolith") }}
              alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
        loki:8080:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: logging-loki
              app.kubernetes.io/component: gateway
          from:
            k8s:
              monitoring-grafana@monitoring/grafana: {{ and .Values.packages.grafana.enabled (ne .Values.packages.loki.strategy "monolith") }}
        minio:9000:
          from:
            k8s:
              minio-operator@minio-operator/minio-operator: {{ $minioEnabled }}
    egress:
      from:
        logging-loki:
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
            definition:
              storage-subnets: {{ not $minioEnabled }}
        minio:
          to:
            k8s:
              minio-operator/minio-operator:4222: {{ $minioEnabled }}
            definition:
              storage-subnets: {{ $minioEnabled }}
              kubeAPI: {{ $minioEnabled }}

{{- include "secretsImagePullSecretsWithName" . }}

image:
  pullPolicy: {{ .Values.imagePullPolicy }}

bbtests:
  cypress:
    envs:
      cypress_check_datasource: {{ .Values.packages.grafana.enabled | quote }}
      cypress_grafana_url: {{ printf "https://grafana.%s" $domainName | quote }}
  scripts:
    envs:
      LOKI_URL: 'http://logging-loki.logging.svc:3100'

monitoring:
  enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
  serviceMonitor:
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    {{- if eq (include "metricsSidecarMtls" (list $lokiMeshConfig .)) "true" }}
    scheme: https
    tlsConfig:
      caFile: /etc/prom-certs/root-cert.pem
      certFile: /etc/prom-certs/cert-chain.pem
      keyFile: /etc/prom-certs/key.pem
      insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
    {{- end }}
  rules:
    enabled: true
    alerting: true

upstream:
  monitoring:
    dashboards:
      enabled: {{ .Values.packages.monitoring.enabled }}
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
      {{- if eq (include "metricsSidecarMtls" (list $lokiMeshConfig .)) "true" }}
      scheme: https
      tlsConfig:
        caFile: /etc/prom-certs/root-cert.pem
        certFile: /etc/prom-certs/cert-chain.pem
        keyFile: /etc/prom-certs/key.pem
        insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}

{{- if (eq .Values.packages.loki.strategy "scalable") }}
  deploymentMode: SimpleScalable
  singleBinary:
    replicas: 0
  read:
    replicas: 3
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: MY_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
  write:
    replicas: 3
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: MY_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
  backend:
    replicas: 3
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: MY_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
  gateway:
    enabled: true
    {{- if $istioEnabled }}
    podAnnotations:
      {{ include "istioAnnotation" . }}
    {{- end }}
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: MY_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
{{- end }}

{{- $disableDefaultFLB := dig "additionalOutputs" "disableDefault" false .Values.packages.fluentbit.values }}
{{- if and .Values.packages.fluentbit.enabled (not $disableDefaultFLB) }}
fluentbit:
  enabled: true
{{- end }}

loki:
  extraMemberlistConfig:
    bind_addr:
      - ${MY_POD_IP}
  storage:
    {{- if (and (eq .Values.packages.loki.strategy "monolith") (not (dig "minio" "enabled" false .Values.packages.loki.values))) }}
    type: "filesystem"
    {{- else }}
    type: "s3"
    bucketNames:
      {{- toYaml .Values.packages.loki.objectStorage.bucketNames | nindent 6 }}
    s3:
      endpoint: {{ .Values.packages.loki.objectStorage.endpoint }}
      region: {{ .Values.packages.loki.objectStorage.region }}
      accessKeyId: {{ .Values.packages.loki.objectStorage.accessKey }}
      secretAccessKey: {{ .Values.packages.loki.objectStorage.accessSecret }}
    {{- end }}
  {{- if (and (eq .Values.packages.loki.strategy "monolith") (not (dig "minio" "enabled" false .Values.packages.loki.values))) }}
  rulerConfig:
    storage:
      type: local
  storage_config:
    boltdb_shipper:
      active_index_directory: /var/loki/boltdb-shipper-active
      cache_location: /var/loki/boltdb-shipper-cache
      cache_ttl: 24h
    filesystem:
      directory: /var/loki/chunks
  {{- end }}
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
  {{- end }}
  {{- if .Values.packages.kiali.enabled }}
  podLabels:
    service.istio.io/canonical-name: logging-loki
  {{- end }}

{{- if (eq .Values.packages.loki.strategy "monolith") }}
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
{{- end }}

# Allows users to deploy distributed mode but calls out that we do not support it
{{- if (eq .Values.packages.loki.strategy "distributed") }}
deploymentMode: Distributed
singleBinary:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: true
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
  {{- end }}
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP

ingester:
  replicas: 3
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
querier:
  replicas: 3
  maxUnavailable: 2
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
queryFrontend:
  replicas: 2
  maxUnavailable: 1
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
queryScheduler:
  replicas: 2
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
distributor:
  replicas: 3
  maxUnavailable: 2
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
compactor:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
indexGateway:
  replicas: 2
  maxUnavailable: 1
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
{{- end -}}

{{- end -}}
