{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.fortify.enabled }}
{{- $fortifyPackage := deepCopy .Values.packages.fortify -}}
{{- if .Values.packages.fortify.values -}}
{{- $cleanedValues := include "mergeLegacyIstioHardenedKeys" (dict "values" .Values.packages.fortify.values) | fromYaml -}}
{{- $fortifyPackage = set $fortifyPackage "values" $cleanedValues -}}
{{- end -}}
{{- include "values-secret" (dict
  "root" $
  "package" $fortifyPackage
  "name" "fortify"
  "defaults" ((mergeOverwrite (include "bigbang.defaults.fortify" . | fromYaml) (include "bigbang.fortify.bb-common-migrations" . | fromYaml)) | toYaml)
)}}
{{- end }}

{{- define "bigbang.defaults.fortify" -}}
{{- $domainName := .Values.domain }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $istioHardened := or (dig "istio" "hardened" "enabled" false .Values.packages.fortify.values) (dig "hardened" "enabled" false .Values.packages.istiod.values) }}
{{- $externalMySQLHost := dig "externalDatabase" "host" "" .Values.packages.fortify }}
{{- $externalMySQLPort := dig "externalDatabase" "port" 3306 .Values.packages.fortify }}
{{- $externalMySQLCIDRs := dig "networkPolicies" "egress" "definitions" "external-mysql" "to" list .Values.packages.fortify.values }}
{{- $externalMySQLEnabled := and (not (dig "mysql" "enabled" true .Values.packages.fortify.values)) (not (empty $externalMySQLCIDRs)) }}
{{- $externalMySQLRouteEnabled := and $istioEnabled (not (dig "mysql" "enabled" true .Values.packages.fortify.values)) (ne $externalMySQLHost "") }}

upstream:
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
  
mysql:
  global:
    {{- include "secretsImagePullSecretsWithName" . | nindent 4 }}

domain: {{ $domainName }}

openshift: {{ .Values.openshift }}

istio:
  hardened:
    enabled: {{ $istioHardened }}

routes:
  inbound:
    fortify:
      enabled: true
      gateways:
        - {{ include "getGatewayName" (dict "gateway" .Values.packages.fortify.ingress.gateway "root" .) }}
      hosts:
        - fortify.{{ $domainName }}
      service: fortify-ssc-service
      port: 80
      selector:
        app.kubernetes.io/name: fortify-ssc
        app.kubernetes.io/component: webapp
  outbound:
    bb-tests:
      enabled: {{ dig "bbtests" "enabled" false .Values.packages.fortify.values }}
      hosts:
        - repo1.dso.mil
    external-mysql:
      enabled: {{ $externalMySQLRouteEnabled }}
      {{- if ne $externalMySQLHost "" }}
      hosts:
        - {{ $externalMySQLHost | quote }}
      {{- end }}
      ports:
        - number: {{ $externalMySQLPort }}
          name: mysql
          protocol: TCP

networkPolicies:
  egress:
    from:
      fortify-webapp:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: fortify-ssc
            app.kubernetes.io/component: webapp
        to:
          definition:
            external-mysql: {{ $externalMySQLEnabled }}

bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://fortify.%s" $domainName | quote }}
      {{- $ssoTestValues := include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.fortify "values" .Values "testOnly" true) | fromYaml }}
      {{- toYaml $ssoTestValues | nindent 6 }}
      # Fortify's SAML test uses these names for the shared Keycloak settings.
      cypress_sso_test_enable: {{ $ssoTestValues.cypress_keycloak_test_enable | quote }}
      cypress_sso_username: {{ $ssoTestValues.cypress_tnr_username | quote }}
      cypress_sso_password: {{ $ssoTestValues.cypress_tnr_password | quote }}

{{- end }}
