{{- include "bigbang.normalizePackageAliases" . -}}
{{- $pkg := "fortify" }}
{{- $fluxSettingsFortify := mergeOverwrite (deepCopy .Values.flux) .Values.packages.fortify.flux -}}
{{- if (get .Values.packages $pkg).enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $pkg }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $pkg }}
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/fortify/values.yaml") . | sha256sum }}
spec:
  releaseName: {{ $pkg }}
  targetNamespace: {{ $pkg }}
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "fortify" "package" (get .Values.packages $pkg) "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsFortify | nindent 2 }}

  {{- if or (get .Values.packages $pkg).postRenderers (dig "mysql" "enabled" true (get .Values.packages $pkg).values) }}
  postRenderers:
  {{- if dig "mysql" "enabled" true (get .Values.packages $pkg).values }}
  {{ include "fortify.postRenderers" . | nindent 2 }}
  {{- end }}
  {{- with (get .Values.packages $pkg).postRenderers }}
  {{ toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "fortify" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.fortify.dependsOnOverride) }}
  {{- with .Values.packages.fortify.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.fortify.dependsOn }}
  dependsOn:
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.fortify) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
