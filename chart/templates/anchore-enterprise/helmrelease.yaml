{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsAnchore := mergeOverwrite (deepCopy .Values.flux) .Values.packages.anchoreEnterprise.flux -}}
{{- if .Values.packages.anchoreEnterprise.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anchore-enterprise
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: anchore-enterprise
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/anchore-enterprise/values.yaml") . | sha256sum }}
spec:
  releaseName: anchore-enterprise
  targetNamespace: anchore
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "anchore-enterprise" "package" .Values.packages.anchoreEnterprise "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsAnchore | nindent 2 }}

  {{- if .Values.packages.anchoreEnterprise.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.anchoreEnterprise.postRenderers | nindent 4 }}
  {{- end }}

  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "anchore-enterprise" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.anchoreEnterprise.dependsOnOverride) }}
  {{- with .Values.packages.anchoreEnterprise.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled (and .Values.packages.keycloak.enabled .Values.packages.anchoreEnterprise.sso.enabled) .Values.packages.anchoreEnterprise.dependsOn }}
  dependsOn:
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if and .Values.packages.keycloak.enabled .Values.packages.anchoreEnterprise.sso.enabled }}
    - name: keycloak
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.anchoreEnterprise) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
