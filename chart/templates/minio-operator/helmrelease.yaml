{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsMinioOperator := mergeOverwrite (deepCopy .Values.flux) .Values.packages.minioOperator.flux -}}
{{- if or .Values.packages.minioOperator.enabled .Values.packages.minio.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio-operator
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/minio-operator/values.yaml") . | sha256sum }}
spec:
  targetNamespace: minio-operator
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "minio-operator" "package" .Values.packages.minioOperator "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsMinioOperator | nindent 2 }}

  {{- if .Values.packages.minioOperator.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.minioOperator.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "minio-operator" "root" .) | nindent 2 }}

  values:
    podAnnotations:
      sidecar.istio.io/inject: "true"
      traffic.sidecar.istio.io/includeInboundPorts: "*"
      traffic.sidecar.istio.io/excludeInboundPorts: "9443"
    imagePullSecrets:
      - name: private-registry

  {{- if not (kindIs "invalid" .Values.packages.minioOperator.dependsOnOverride) }}
  {{- with .Values.packages.minioOperator.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.minioOperator.dependsOn }}
  dependsOn:
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.minioOperator) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
