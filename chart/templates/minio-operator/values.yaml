{{- include "bigbang.normalizePackageAliases" . -}}
{{- if or .Values.packages.minioOperator.enabled .Values.packages.minio.enabled }}
  {{- include "values-secret" (dict 
    "root" $ 
    "package" .Values.package.minioOperator 
    "name" "minio-operator"
    "bbCommonSubchart" true
    "defaults" (include "bigbang.defaults.minio-operator" .)
  )}}
{{- end }}

{{- define "bigbang.defaults.minio-operator" -}}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
hostname: {{ $domainName }}
domain: {{ $domainName }}

podAnnotations:
  sidecar.istio.io/inject: "true"
  traffic.sidecar.istio.io/includeInboundPorts: "*"
  traffic.sidecar.istio.io/excludeInboundPorts: "9443"

upstream:
  operator:
    image:
      pullPolicy: {{ .Values.imagePullPolicy}}
    {{- include "secretsImagePullSecretsWithName" . | nindent 4 }}

    {{- if .Values.packages.monitoring.enabled }}
    env:
      - name: CLUSTER_DOMAIN
        value: "cluster.local"
      - name: WATCHED_NAMESPACE
        value: ""
      - name: PROMETHEUS_NAMESPACE
        value: "monitoring"
    {{- end }}

bb-common:
  networkPolicies:
    egress:
      from:
        minio-operator:
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}

  routes:
    inbound:
      console:
        gateways:
          - {{ include "getGatewayName" (dict "gateway" .Values.packages.minio.ingress.gateway "root" .)}}
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.minioOperator.values }}
        hosts:
        - repo1.dso.mil

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}
{{- end -}}
