{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.velero.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.velero
  "name" "velero"
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.velero" .)
)}}
{{- end }}

{{- define "bigbang.defaults.velero" -}}
{{- $domainName := .Values.domain }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}

global:
  domain: {{ $domainName }}

monitoring:
  enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}

networkPolicies:
  ingress:
    to:
      velero:8085:
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
  egress:
    {{- if empty .Values.networkPolicies.egress.definitions.kubeAPI }}
    definitions:
      kubeAPI:
        to:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.controlPlaneCidr }}
            {{- if eq .Values.networkPolicies.controlPlaneCidr "0.0.0.0/0" }}
            except:
            - 169.254.169.254/32
            {{- end }}
        {{- if not (eq .Values.networkPolicies.controlPlaneCidr .Values.networkPolicies.vpcCidr) }}
        {{- if not (eq .Values.networkPolicies.vpcCidr "0.0.0.0/0") }}
        - ipBlock:
            cidr: {{ .Values.networkPolicies.vpcCidr }}
        {{- end }}
        {{- end }}
    {{- end }}
    from:
      "*":
        to:
          k8s:
            tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
          definition:
            kubeAPI: true
      velero:
        to:
          definition:
            storage-subnets: true
      velero-upgrade-crds:
        podSelector:
          matchLabels:
            batch.kubernetes.io/job-name: velero-upgrade-crds
        to:
          definition:
            kubeAPI:
              enabled: true
              metadata:
                annotations:
                  helm.sh/hook: pre-upgrade
                  helm.sh/hook-weight: "-10"
                  helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation

bbtests:
  scripts:
    envs:
      MINIO_HOST: {{ printf "https://minio-api.%s" $domainName | quote }}

openshift: {{ .Values.openshift }}

upstream:
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
  {{- end }}
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsImagePullSecrets" . | nindent 4 }}

  {{- if eq (include "metricScrapingEnabled" .) "true" }}
  metrics:
    enabled: true
    scrapeInterval: 30s
    scrapeTimeout: 10s
    service:
      annotations: {}
      labels: {}
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8085"
      prometheus.io/path: "/metrics"
    serviceMonitor:
      enabled: true
      additionalLabels: {}
      {{- if eq (include "metricsSidecarMtls" (list .Values.packages.velero .)) "true" }}
      scheme: https
      tlsConfig:
        caFile: /etc/prom-certs/root-cert.pem
        certFile: /etc/prom-certs/cert-chain.pem
        keyFile: /etc/prom-certs/key.pem
        insecureSkipVerify: true
      {{- end }}
    prometheusRule:
      enabled: true
  {{- end }}

{{- end -}}
