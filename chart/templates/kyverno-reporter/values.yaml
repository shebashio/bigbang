{{- include "bigbang.normalizePackageAliases" . -}}
{{- $pkg := "kyvernoReporter" }}
{{- if (get .Values.packages $pkg).enabled }}
{{- include "values-secret" (dict
"root" $
"package" (get .Values.packages $pkg)
"name" ($pkg | kebabcase)
"bbCommonSubchart" true
"defaults" (include "bigbang.defaults.kyverno-reporter" .)
)}}
{{- end }}

{{- define "bigbang.defaults.kyverno-reporter" -}}
{{- $domainName := default .Values.domain .Values.hostname }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}

global:
  fullnameOverride: kyverno-reporter

bb-common:
  routes:
    inbound:
      policy-reporter-ui:
        enabled: {{ dig "upstream" "ui" "enabled" true .Values.packages.kyvernoReporter.values }}
        gateways:
          - istio-gateway/public-ingressgateway
        hosts:
          - policyreporter.{{ $domainName }}
        service: policy-reporter-ui.kyverno-reporter.svc.cluster.local
        port: 8080
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.kyvernoReporter.values }}
        hosts:
        - repo1.dso.mil
        - prometheus.{{ $domainName }}
        - grafana.{{ $domainName }}
  
  networkPolicies:
    egress:
      from:
        kyverno-reporter:
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: kyverno-reporter-kyverno-reporter
          to:
            definition:
              kubeAPI: true
          to:
            definition:
              sso: {{ .Values.packages.kyvernoReporter.sso.enabled }}
    ingress:
      to:
        policy-reporter:8080:
          from:
            k8s:
              alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
    additionalPolicies: []

bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_grafana_url: {{ printf "https://grafana.%s" $domainName | quote }}
      cypress_prometheus_url: {{ printf "https://prometheus.%s" $domainName | quote }}
      cypress_check_datasource: {{ .Values.packages.grafana.enabled | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.kyvernoReporter "values" .Values) | nindent 6 }}

openshift: {{ .Values.openshift }}

upstream:
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
  {{- end }}
  ui:
    enabled: true
    image:
      pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsImagePullSecretsWithName" . | nindent 4 }}
    {{- if $istioEnabled }}
    podAnnotations:
      {{ include "istioAnnotation" . }}
    {{- end }}
    openIDConnect:
      enabled: {{ .Values.packages.kyvernoReporter.sso.enabled }}
      discoveryUrl: {{ printf "%s/.well-known/openid-configuration" .Values.sso.url | quote }}
      callbackUrl: {{ printf "https://policyreporter.%s/callback" $domainName | quote }}
      clientId: {{ .Values.packages.kyvernoReporter.sso.client_id }}
      clientSecret: {{ .Values.packages.kyvernoReporter.sso.client_secret }}
      {{- if and .Values.packages.kyvernoReporter.sso.enabled (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
      certificate: /etc/oidc/ca.pem
      {{- end }}

    {{- if and .Values.packages.kyvernoReporter.sso.enabled (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
    extraVolumes:
      volumeMounts:
        - name: tls-ca-sso
          mountPath: /etc/oidc/ca.pem
          subPath: ca.pem
          readOnly: true
      volumes:
        - name: tls-ca-sso
          secret:
            secretName: {{ default (dig "certificateAuthority" "secretName" "" .Values.sso) .Values.sso.secretName }}
    {{- end }}

  plugin:
    kyverno:
      enabled: true
      image:
        pullPolicy: {{ .Values.imagePullPolicy }}
      {{- include "secretsImagePullSecretsWithName" . | nindent 6 }}
      {{- if $istioEnabled }}
      podAnnotations:
        {{ include "istioAnnotation" . }}
      {{- end }}


  # monitoring contains configurations related to monitoring
  monitoring:
    # -- Enables the Prometheus Operator integration
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    grafana:
      dashboards:
        enabled: {{ or (eq (include "metricScrapingEnabled" .) "true") .Values.packages.grafana.enabled }}
        namespace: monitoring
{{- end -}}
