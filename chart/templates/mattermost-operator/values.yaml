{{- include "bigbang.normalizePackageAliases" . -}}
{{- if or .Values.packages.mattermostOperator.enabled .Values.packages.mattermost.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.mattermostOperator
  "name" "mattermost-operator"
  "bbCommonSubchart" true
  "supportsRouteDefaults" true
  "defaults" (include "bigbang.defaults.mattermostOperator" .)
) }}
{{- end }}

{{- define "bigbang.defaults.mattermostOperator" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- include "secretsImagePullSecretsWithName" . }}

image:
  imagePullPolicy: {{ .Values.imagePullPolicy }}

{{- if $istioEnabled }}
podAnnotations:
  {{ include "istioAnnotation" . }}
{{- end }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

openshift: {{ .Values.openshift }}
{{- end -}}
