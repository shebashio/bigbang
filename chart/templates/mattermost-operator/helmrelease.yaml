{{- include "bigbang.normalizePackageAliases" . -}}
{{- $mmOpValues := deepCopy .Values.packages.mattermostOperator -}}
{{- $fluxSettingsMattermostOperator := mergeOverwrite (deepCopy .Values.flux) $mmOpValues.flux -}}
{{- if or $mmOpValues.enabled .Values.packages.mattermost.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mattermost-operator
    app.kubernetes.io/component: "collaboration-tools"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/mattermost-operator/values.yaml") . | sha256sum }}
spec:
  targetNamespace: mattermost-operator
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "mattermost-operator" "package" $mmOpValues "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsMattermostOperator | nindent 2 }}
  
  {{- if $mmOpValues.postRenderers }}
  postRenderers:
  {{- toYaml $mmOpValues.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "mattermost-operator" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.mattermostOperator.dependsOnOverride) }}
  {{- with .Values.packages.mattermostOperator.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.mattermostOperator.dependsOn }}
  dependsOn:
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.mattermostOperator) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
