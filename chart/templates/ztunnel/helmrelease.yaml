{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsZtunnel := mergeOverwrite (deepCopy .Values.flux) .Values.packages.ztunnel.flux -}}
{{- if eq (include "ambientEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ztunnel
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/ztunnel/values.yaml") . | sha256sum }}
spec:
  releaseName: ztunnel
  targetNamespace: istio-system
  chart:
    spec:
      {{- if eq .Values.packages.ztunnel.sourceType "git" }}
      chart: {{ .Values.packages.ztunnel.git.path }}
      sourceRef:
        kind: GitRepository
        name: ztunnel
        namespace: {{ .Release.Namespace }}
      {{- else }}
      chart: {{ .Values.packages.ztunnel.helmRepo.chartName }}
      version: {{ .Values.packages.ztunnel.helmRepo.tag }}
      sourceRef:
        kind: HelmRepository
        name: {{ .Values.packages.ztunnel.helmRepo.repoName }}
        namespace: {{ .Release.Namespace }}
      {{- $repoType := include "getRepoType" (dict "repoName" .Values.packages.ztunnel.helmRepo.repoName "allRepos" $.Values.helmRepositories) -}}
      {{- if (and .Values.packages.ztunnel.helmRepo.cosignVerify (eq $repoType "oci")) }} # Needs to be an OCI repo
      verify:
        provider: cosign
        secretRef:
          name: {{ printf "%s-cosign-pub" .Values.packages.ztunnel.helmRepo.repoName }}
      {{- end }}
      {{- end }}
      interval: 5m

  {{- toYaml $fluxSettingsZtunnel | nindent 2 }}

  {{- if .Values.packages.ztunnel.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.ztunnel.postRenderers | nindent 4 }}
  {{- end }}
  valuesFrom:
    - name: {{ .Release.Name }}-ztunnel-values
      kind: Secret
      valuesKey: "common"
    - name: {{ .Release.Name }}-ztunnel-values
      kind: Secret
      valuesKey: "defaults"
    - name: {{ .Release.Name }}-ztunnel-values
      kind: Secret
      valuesKey: "overlays"

  {{- if not (kindIs "invalid" .Values.packages.ztunnel.dependsOnOverride) }}
  {{- with .Values.packages.ztunnel.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  dependsOn:
    - name: istiod
      namespace: {{ .Release.Namespace }}
    - name: istio-cni
      namespace: {{ .Release.Namespace }}
  {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.ztunnel) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
