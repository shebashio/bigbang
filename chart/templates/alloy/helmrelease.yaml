{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsAlloy := mergeOverwrite (deepCopy .Values.flux) .Values.packages.alloy.flux -}}
{{- if .Values.packages.alloy.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $isStrictIstio := and $istioEnabled (eq (dig "istio" "mtls" "mode" "STRICT" .Values.packages.alloy.values) "STRICT") -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/alloy/values.yaml") . | sha256sum }}
spec:
  targetNamespace: alloy
  releaseName: alloy
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "alloy" "package" .Values.packages.alloy "root" .) | nindent 2 }}
  {{- toYaml $fluxSettingsAlloy | nindent 2 }}
  {{- if .Values.packages.alloy.postRenderers }}
  postRenderers:
  {{- with .Values.packages.alloy.postRenderers }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "alloy" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.alloy.dependsOnOverride) }}
  {{- with .Values.packages.alloy.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.loki.enabled .Values.packages.alloy.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.loki.enabled }}
    - name: loki
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.alloy) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}

