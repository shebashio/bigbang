{{- include "bigbang.normalizePackageAliases" . -}}
{{- if or .Values.packages.kyverno.enabled .Values.packages.kyvernoPolicies.enabled .Values.packages.kyvernoReporter.enabled }}
{{- include "values-secret" (dict
"root" $
"package" .Values.packages.kyverno
"name" "kyverno"
"bbCommonSubchart" true
"defaults" (include "bigbang.defaults.kyverno" .)
)}}
{{- end }}

{{- define "bigbang.defaults.kyverno" -}}
bb-common:
  istio:
    # Kyverno installs before Istio and is intentionally not part of the mesh.
    enabled: false
    ambient:
      enabled: false
    sidecar:
      enabled: false
    authorizationPolicies:
      enabled: false

  networkPolicies:
    # Setting to false as Kyverno is not in the mesh
    hbonePortInjection:
      enabled: false
    ingress:
      to:
        kyverno:8000:
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: kyverno-kyverno
          from:
            k8s:
              monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
    egress:
      definitions:
        # registry1 redirects image and signature blobs to S3, so require-image-signature
        # needs both. S3 ranges from:
        #   curl -s https://ip-ranges.amazonaws.com/ip-ranges.json | jq -r '.prefixes[] | select(.service=="S3" and .region=="us-gov-west-1") | .ip_prefix'
        private-registry:
          to:
            # registry1
            - ipBlock:
                cidr: "15.205.173.153/32"
            # S3 us-gov-west-1
            - ipBlock:
                cidr: "108.175.56.0/22"
            - ipBlock:
                cidr: "108.175.48.0/22"
            - ipBlock:
                cidr: "136.18.0.0/23"
            - ipBlock:
                cidr: "3.2.99.0/24"
            - ipBlock:
                cidr: "1.178.30.0/24"
            - ipBlock:
                cidr: "15.200.176.128/28"
            - ipBlock:
                cidr: "15.200.28.240/28"
          ports:
            - port: 443
              protocol: TCP
      from:
        kyverno-admission-controller:
          podSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
          to:
            definition:
              private-registry: {{ dig "policies" "require-image-signature" "enabled" false .Values.packages.kyvernoPolicies.values }}
              kubeAPI: true
        ## Kyverno background and cleanup controllers may be needed depending on the flavor of kubernetes in use
        kyverno-background-controller:
          podSelector:
            matchLabels:
              app.kubernetes.io/component: background-controller
          to:
            definition:
              kubeAPI: true
        kyverno-cleanup-controller:
          podSelector:
            matchLabels:
              app.kubernetes.io/component: cleanup-controller
          to:
            definition:
              kubeAPI: true
        kyverno-reports-controller:
          podSelector:
            matchLabels:
              app.kubernetes.io/component: reports-controller
          to:
            definition:
              kubeAPI: true

openshift: {{ .Values.openshift }}

global:
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}

upstream:

  fullnameOverride: kyverno-kyverno

  replicaCount: 3

  # clear out the explicit set in the package, so it falls back to our global value
  existingImagePullSecrets: []

  grafana:
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    namespace: monitoring

  admissionController:
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    # clear out the explicit set in the package, so it falls back to our global value
    imagePullSecrets: []

  backgroundController:
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    # clear out the explicit set in the package, so it falls back to our global value
    imagePullSecrets: []

  cleanupController:
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    # clear out the explicit set in the package, so it falls back to our global value
    imagePullSecrets: []

  reportsController:
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    # clear out the explicit set in the package, so it falls back to our global value
    imagePullSecrets: []

  crds:
    groups:
      # clear out the explicit set in the package, so it falls back to our global value
      imagePullSecrets: []
    migration:
      # clear out the explicit set in the package, so it falls back to our global value
      imagePullSecrets: []


{{- end -}}
