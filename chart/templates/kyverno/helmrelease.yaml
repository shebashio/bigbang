{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingskyverno := mergeOverwrite (deepCopy .Values.flux) .Values.packages.kyverno.flux -}}
{{- if or .Values.packages.kyverno.enabled .Values.packages.kyvernoPolicies.enabled .Values.packages.kyvernoReporter.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/kyverno/values.yaml") . | sha256sum }}
spec:
  targetNamespace: kyverno
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "kyverno" "package" .Values.packages.kyverno "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingskyverno | nindent 2 }}

  {{- if .Values.packages.kyverno.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.kyverno.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "kyverno" "root" .) | nindent 2 }}
  {{- if not (kindIs "invalid" .Values.packages.kyverno.dependsOnOverride) }}
  {{- with .Values.packages.kyverno.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled .Values.packages.prometheusOperatorCRDs.enabled .Values.packages.kyverno.dependsOn }}
  dependsOn:
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.prometheusOperatorCRDs.enabled }}
    - name: prometheus-operator-crds
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.kyverno) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
