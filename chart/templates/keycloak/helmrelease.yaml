{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsKeycloak := mergeOverwrite (deepCopy .Values.flux) .Values.packages.keycloak.flux -}}
{{- if .Values.packages.keycloak.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $tlsEnabled := and .Values.packages.keycloak.ingress.cert .Values.packages.keycloak.ingress.key -}}
{{ $name := "keycloak" }}
{{ $component := "security-tools" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: {{ $component }}
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/keycloak/values.yaml") . | sha256sum }}
spec:
  releaseName: {{ $name }}
  targetNamespace: {{ $name }}
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "keycloak" "package" .Values.packages.keycloak "root" .) | nindent 2 }}

  {{- if .Values.packages.keycloak.postRenderers }}
    {{ toYaml .Values.packages.keycloak.postRenderers | nindent 2 }}
  {{- end }}

  {{- toYaml $fluxSettingsKeycloak | nindent 2 }}

  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "keycloak" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.keycloak.dependsOnOverride) }}
  {{- with .Values.packages.keycloak.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.keycloak.dependsOn }}
  dependsOn:
  {{- if .Values.packages.gatekeeper.enabled }}
  - name: gatekeeper
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if $istioEnabled }}
  {{- include "istioHelmReleases" . | nindent 2 }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
  - name: kyverno-policies
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
  - name: monitoring
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.keycloak) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}
