{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsMimir := mergeOverwrite (deepCopy .Values.flux) .Values.packages.mimir.flux -}}
{{- if .Values.packages.mimir.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mimir
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/mimir/values.yaml") . | sha256sum }}
spec:
  targetNamespace: mimir
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "mimir" "package" .Values.packages.mimir "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsMimir | nindent 2 }}
  {{- if or .Values.packages.mimir.postRenderers $istioEnabled }}
  postRenderers:
  {{- if $istioEnabled }}
  {{ include "mimir.istioPostRenderers" . | nindent 2 }}
  {{- end }}
  {{- with .Values.packages.mimir.postRenderers }}
  {{ toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "mimir" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.mimir.dependsOnOverride) }}
  {{- with .Values.packages.mimir.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.mimir.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.mimir) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
