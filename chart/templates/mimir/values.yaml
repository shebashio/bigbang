{{- include "bigbang.normalizePackageAliases" . -}}
{{- /* Create secret */ -}}
{{- if .Values.packages.mimir.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.mimir
  "name" "mimir"
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.mimir" .)
)}}
{{- end }}

{{- define "bigbang.defaults.mimir" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $s3Enabled := (.Values.packages.mimir.s3ObjectStorage.enabled) }}
{{- $mimirEnterpriseEnabled := (.Values.packages.mimir.enterprise.enabled) }}
{{- $prometheusEnabled := and .Values.packages.monitoring.enabled (dig "values" "upstream" "prometheus" "enabled" true .Values.packages.monitoring) }}
{{- $kafkaEnabled := (.Values.packages.mimir.kafkaIngestStorage.enabled) }}
{{- $kafkaBrokerHost := (.Values.packages.mimir.kafkaIngestStorage.brokerHost) }}
{{- $kafkaBrokerPort := (.Values.packages.mimir.kafkaIngestStorage.brokerPort) }}
{{- $kafkaBrokerNetworkCIDR := (.Values.packages.mimir.kafkaIngestStorage.brokerNetworkCIDR) }}
{{- $kafkaBrokerClusterDomain := (.Values.packages.mimir.kafkaIngestStorage.brokerClusterDomain) }}
{{- $kafkaBrokerRouteEnabled := and $kafkaEnabled $istioEnabled (ne $kafkaBrokerHost "") }}
{{- $kafkaBrokerWildcardRouteEnabled := and $kafkaEnabled $istioEnabled (ne $kafkaBrokerClusterDomain "") }}

upgradeJob:
  image:
    {{- include "secretsPullSecretsSingle" . | nindent 4 }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

bb-common:
  routes:
    inbound:
      mimir-gateway:
        enabled: false
        gateways:
          - {{ include "getGatewayName" (dict "gateway" "public" "root" .)}}
        hosts:
          - mimir.{{ .Values.domain }}
        service: mimir-mimir-gateway.mimir.svc.cluster.local
        port: 8080
        selector:
          app.kubernetes.io/component: gateway
          app.kubernetes.io/name: mimir
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.mimir.values }}
        hosts:
        - repo1.dso.mil
      kafka-broker:
        {{- /* Disable single-host entry when wildcard covers it to avoid redundant ServiceEntries */}}
        enabled: {{ and $kafkaBrokerRouteEnabled (not $kafkaBrokerWildcardRouteEnabled) }}
        {{- if ne $kafkaBrokerHost "" }}
        hosts:
          - {{ $kafkaBrokerHost | quote }}
        {{- end }}
        ports:
          - number: {{ $kafkaBrokerPort }}
            name: kafka
            protocol: TCP
      kafka-broker-wildcard:
        enabled: {{ $kafkaBrokerWildcardRouteEnabled }}
        {{- /* resolution: NONE required — Istio rejects wildcard hosts with DNS resolution */}}
        resolution: NONE
        {{- if ne $kafkaBrokerClusterDomain "" }}
        hosts:
          - {{ printf "*.%s" $kafkaBrokerClusterDomain | quote }}
        {{- end }}
        ports:
          - number: {{ $kafkaBrokerPort }}
            name: kafka
            protocol: TCP

  networkPolicies:
    controlPlaneCidr: {{ .Values.networkPolicies.controlPlaneCidr }}
    egress:
      {{- if and $kafkaEnabled $kafkaBrokerNetworkCIDR }}
      definitions:
        {{- /* Override kafka-subnets with the specific broker CIDR and only the configured port */}}
        kafka-subnets:
          to:
            - ipBlock:
                cidr: {{ $kafkaBrokerNetworkCIDR }}
          ports:
            - port: {{ $kafkaBrokerPort }}
              protocol: TCP
      {{- end }}
      from:
        mimir:
          to:
            k8s:
              monitoring/grafana:3000: {{ .Values.packages.grafana.enabled }}
            definition:
              storage-subnets: {{ $s3Enabled }}
        {{- if and $kafkaEnabled $kafkaBrokerNetworkCIDR }}
        # Kafka egress is only rendered when brokerNetworkCIDR is explicitly set.
        # Leaving brokerNetworkCIDR empty intentionally suppresses the egress rule —
        # operators must provide their broker subnet CIDR to enable network access.
        # Scoped to distributor (producer) and ingester (consumer) only.
        mimir-distributor:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mimir
              app.kubernetes.io/component: distributor
          to:
            definition:
              kafka-subnets: true
        mimir-ingester:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mimir
              app.kubernetes.io/component: ingester
          to:
            definition:
              kafka-subnets: true
        {{- end }}
        rollout-operator:
          to:
            k8s:
              monitoring/grafana:3000: {{ .Values.packages.grafana.enabled }}
    ingress:
      to:
        mimir:[15020]:
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ $prometheusEnabled }}
              alloy-alloy-metrics@alloy/alloy-metrics: {{ .Values.packages.alloy.alloyMetrics.enabled }}
        mimir:[8080,9095]:
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ $prometheusEnabled }}
              monitoring-grafana@monitoring/grafana: {{ .Values.packages.grafana.enabled }}
              alloy-alloy-metrics@alloy/alloy-metrics: {{ .Values.packages.alloy.alloyMetrics.enabled }}
        rollout-operator:[8080,9095]:
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ $prometheusEnabled }}
              monitoring-grafana@monitoring/grafana: {{ .Values.packages.grafana.enabled }}
              alloy-alloy-metrics@alloy/alloy-metrics: {{ .Values.packages.alloy.alloyMetrics.enabled }}
        rollout-operator:[15020]:
          from:
            k8s:
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ $prometheusEnabled }}
              alloy-alloy-metrics@alloy/alloy-metrics: {{ .Values.packages.alloy.alloyMetrics.enabled }}
bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_grafana_url: {{ printf "https://grafana.%s" .Values.domain | quote }}
  scripts:
    envs:
      MIMIR_URL: 'http://mimir-mimir-distributor.mimir.svc:8080'

upstream:
  image:
    {{- include "secretsPullSecrets" . | nindent 4 }}

  rollout_operator:
    {{- include "secretsImagePullSecretsWithName" . | nindent 4 }}

{{- if or $istioEnabled (and $s3Enabled .Values.packages.mimir.s3ObjectStorage.accessSecret .Values.packages.mimir.s3ObjectStorage.accessKey) }}
  global:
    {{- if $istioEnabled }}
    podAnnotations:
      proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    {{- end }}
    {{- if and $s3Enabled .Values.packages.mimir.s3ObjectStorage.accessSecret .Values.packages.mimir.s3ObjectStorage.accessKey }}
    extraEnvFrom:
    - secretRef:
        name: mimir-objstore-secret
    {{- end }}
{{- end }}
  mimir:
    structuredConfig:
      limits:
        name_validation_scheme: utf8
      {{- if $s3Enabled }}
      {{- if $mimirEnterpriseEnabled }}
      admin_client:
      backend: s3
      {{- end }}
      alertmanager_storage:
        backend: s3
      blocks_storage:
        backend: s3
      ruler_storage:
        backend: s3
      common:
        storage:
          backend: s3
          s3:
            {{- if and .Values.packages.mimir.s3ObjectStorage.accessSecret .Values.packages.mimir.s3ObjectStorage.accessKey }}
            access_key_id: "${AWS_ACCESS_KEY_ID}" # This is a secret injected via an environment variable
            secret_access_key: "${AWS_SECRET_ACCESS_KEY}" # This is a secret injected via an environment variable
            {{- end }}
            endpoint: {{ .Values.packages.mimir.s3ObjectStorage.endpoint }}
            insecure: {{ .Values.packages.mimir.s3ObjectStorage.insecure }}
            region: {{ .Values.packages.mimir.s3ObjectStorage.region }}
            bucket_name: {{ .Values.packages.mimir.s3ObjectStorage.bucketName }}
      {{- end }}
      {{- if $kafkaEnabled }}
      ingest_storage:
        enabled: true
        kafka:
          address: "{{ $kafkaBrokerHost }}:{{ $kafkaBrokerPort }}"
          topic: {{ .Values.packages.mimir.kafkaIngestStorage.topic | quote }}
      ingester:
        push_grpc_method_enabled: false
      {{- end }}
  {{- if and (or $s3Enabled $kafkaEnabled) .Values.packages.mimir.serviceAccountAnnotations }}
  serviceAccount:
    annotations:
      {{- range $key, $value :=  .Values.packages.mimir.serviceAccountAnnotations }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  {{- end }}
  metaMonitoring:
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.packages.mimir .)) "true" }}
      scheme: https
      tlsConfig:
        caFile: /etc/prom-certs/root-cert.pem
        certFile: /etc/prom-certs/cert-chain.pem
        keyFile: /etc/prom-certs/key.pem
        insecureSkipVerify: true
      {{- end }}
    dashboards:
      enabled: {{ .Values.packages.grafana.enabled }}
{{- end -}}
