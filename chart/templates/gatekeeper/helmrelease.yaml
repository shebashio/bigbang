{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsGatekeeper := mergeOverwrite (deepCopy .Values.flux) .Values.packages.gatekeeper.flux -}}
{{- if .Values.packages.gatekeeper.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gatekeeper
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/gatekeeper/values.yaml") . | sha256sum }}
spec:
  # Use a non-persistent client to allow for Gatekeeper CRD *magic*
  persistentClient: false
  targetNamespace: gatekeeper-system
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "gatekeeper" "package" .Values.packages.gatekeeper "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsGatekeeper | nindent 2 }}

  {{- if .Values.packages.gatekeeper.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.gatekeeper.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "gatekeeper" "root" .) | nindent 2 }}
  {{- if not (kindIs "invalid" .Values.packages.gatekeeper.dependsOnOverride) }}
  {{- with .Values.packages.gatekeeper.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if .Values.packages.gatekeeper.dependsOn }}
  dependsOn:
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.gatekeeper) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
