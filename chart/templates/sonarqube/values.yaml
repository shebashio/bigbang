{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.sonarqube.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.sonarqube
  "name" "sonarqube"
  "bbCommonSubchart" true
  "supportsRouteDefaults" true
  "defaults" (include "bigbang.defaults.sonarqube" .)
) }}
{{- end }}

{{- define "bigbang.defaults.sonarqube" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $plugins := dig "upstream" "plugins" "install" (list) .Values.packages.sonarqube.values }}
{{- $pluginsExist := not (empty $plugins) }}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
domain: {{ $domainName }}

# Define variables to help with conditionals later
{{- $localSSOEnabled := and .Values.packages.keycloak.enabled .Values.packages.sonarqube.sso.enabled }}

OpenShift:
  enabled: {{ .Values.openshift }}

bb-common:
  routes:
    inbound:
      sonarqube:
        enabled: true
        gateways:
          - {{ include "getGatewayName" (dict "gateway" .Values.packages.sonarqube.ingress.gateway "root" .)}}
        hosts:
          - sonarqube.{{ .Values.domain }}
        service: sonarqube-sonarqube.sonarqube.svc.cluster.local
        port: 9000
        selector:
          app: sonarqube
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.sonarqube.values }}
        hosts:
        - repo1.dso.mil
      sonarqube-marketplace:
        enabled: {{ $pluginsExist }}
        hosts:
        - github.com
        - release-assets.githubusercontent.com
        - downloads.sonarsource.com
      sonarqube-configure-sso:
        enabled: {{ $localSSOEnabled }}
        hosts:
        - {{ include "sso.host" . }}
  networkPolicies:
    ingress:
      to:
        sonarqube:[8000,8001,9000]:
          podSelector:
            matchLabels:
              app: sonarqube
          from:
            k8s:
              alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
    egress:
      definitions:
        {{- if not (hasKey .Values.networkPolicies.egress.definitions "kubeAPI") }}
        kubeAPI:
          to:
          - ipBlock:
              cidr: {{ .Values.networkPolicies.controlPlaneCidr }}
              {{- if eq .Values.networkPolicies.controlPlaneCidr "0.0.0.0/0" }}
              except:
              - 169.254.169.254/32
              {{- end }}
          {{- if and (ne .Values.networkPolicies.controlPlaneCidr .Values.networkPolicies.vpcCidr) (ne .Values.networkPolicies.vpcCidr "0.0.0.0/0") }}
          - ipBlock:
              cidr: {{ .Values.networkPolicies.vpcCidr }}
          {{- end }}
        {{- end }}
      from:
        sonarqube:
          podSelector:
            matchLabels:
              app: sonarqube
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
            definition:
              sonarsource-marketplace: {{ $pluginsExist }}
              code-repository: true
              database-subnets: {{ not (or (empty .Values.packages.sonarqube.database.host) (dig "upstream" "jdbcOverwrite" "enabled" false .Values.packages.sonarqube.values )) }}
        sonarqube-configure-sso:
          podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: configure-sso-certificate-secret
          to:
            definition:
              kubeAPI:
                enabled: {{ $localSSOEnabled }}
                metadata:
                  annotations:
                    helm.sh/hook: pre-install,pre-upgrade
                    helm.sh/hook-weight: "-10"
                    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
              sso:
                enabled: {{ $localSSOEnabled }}
                metadata:
                  annotations:
                    helm.sh/hook: pre-install,pre-upgrade
                    helm.sh/hook-weight: "-10"
                    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://sonarqube.%s" $domainName | quote }}
      cypress_url_setup: {{ printf "https://sonarqube.%s/setup" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.sonarqube "values" .Values) | nindent 6 }}

{{- if $localSSOEnabled }}
sso:
  idpmetadataurl: {{ include "sso.saml.service" . }}/descriptor
{{- end }}


# big bang package references this in configure-sso.yaml
image:
  {{- include "secretsPullSecret" . | nindent 2 }}

upstream:
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsPullSecretsWithName" . | nindent 4 }}
  {{- if $istioEnabled }}
  annotations:
    {{ include "istioAnnotation" . }}
  {{- end }}

{{- if .Values.packages.sonarqube.sso.enabled }}
  sonarProperties:
    # enabling saml authentication 
    sonar.auth.saml.enabled: {{ .Values.packages.sonarqube.sso.enabled }}   #false
     # The base URL of the sonarqube server
    sonar.core.serverBaseURL: https://sonarqube.{{ $domainName }}
    # The client ID of the Sonarqube client in Keycloak
    sonar.auth.saml.applicationId: {{ .Values.packages.sonarqube.sso.client_id }}    # "sonarqube"
    # SSO login button label 
    sonar.auth.saml.providerName: {{ coalesce .Values.packages.sonarqube.sso.provider_name .Values.packages.sonarqube.sso.label .Values.sso.name }} # "Keycloak SSO"
    # You will find this in Keycloak in Realm Settings > General > Endpoints. Click on SAML 2.0 Identify Provider Metadata to obtain the XML configuration file. Search for the value 'EntityDescriptor > entityID'
    sonar.auth.saml.providerId: {{ include "sso.url" . }}    #"https://your.keycloak.url/auth/realms/baby-yoda"
    sonar.auth.saml.loginUrl: {{ include "sso.saml.service" . }}    #"https://your.keycloak.url/auth/realms/baby-yoda/protocol/saml"
    # This is the RS256 key copied from Keycloak The value you get from ***Realm Settings > Keys > RS256.*** Click on Certificate
    {{- if not $localSSOEnabled }}
    sonar.auth.saml.certificate.secured: {{ default (include "sso.saml.cert" .) .Values.packages.sonarqube.sso.certificate }}   #"-----BEGIN CERTIFICATE-----"
    {{- end }}
    sonar.auth.saml.user.login: {{ .Values.packages.sonarqube.sso.login | default "login" }}   #"login" (user attribute)
    sonar.auth.saml.user.name: {{ .Values.packages.sonarqube.sso.name | default "name" }}      #"username" (user attribute)
    sonar.auth.saml.user.email: {{ .Values.packages.sonarqube.sso.email | default "email" }}   #"email" (user attribute)
    {{- if .Values.packages.sonarqube.sso.group }}
    sonar.auth.saml.group.name: {{ .Values.packages.sonarqube.sso.group }}  #"groups" (user attribute)
    {{- end }}
{{- end }}

  {{- if $localSSOEnabled }}
  sonarSecretProperties: sonarqube-sonarqube-secret
  {{- end }}

  prometheusExporter:
    enabled: {{ .Values.packages.monitoring.enabled }}

  {{- with .Values.packages.sonarqube.database }}
  {{- if and .host .username .password .database .port }}
# External Postgres config
  jdbcOverwrite:
    enabled: true
    jdbcUrl: "jdbc:postgresql://{{ .host }}:{{ .port }}/{{ .database }}?socketTimeout=1500"
    jdbcUsername: {{ .username }}
    jdbcSecretName: sonarqube-db-secret
    jdbcSecretPasswordKey: postgresql-password
  {{- end }}
  {{- end }}
{{ end -}}
