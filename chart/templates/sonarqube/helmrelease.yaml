{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsSonarqube := mergeOverwrite (deepCopy .Values.flux) .Values.packages.sonarqube.flux -}}
{{- if .Values.packages.sonarqube.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/sonarqube/values.yaml") . | sha256sum }}
spec:
  releaseName: sonarqube
  targetNamespace: sonarqube
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "sonarqube" "package" .Values.packages.sonarqube "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsSonarqube | nindent 2 }}
  
  {{- if or .Values.packages.sonarqube.postRenderers (and $istioEnabled .Values.packages.monitoring.enabled) }}
  postRenderers:
  {{- if and $istioEnabled .Values.packages.monitoring.enabled }}
  {{ include "sonarqube.istioPrometheusPostRenderers" . | nindent 2 }}
  {{- end }}
  {{- with .Values.packages.sonarqube.postRenderers }}
  {{ toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "sonarqube" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.sonarqube.dependsOnOverride) }}
  {{- with .Values.packages.sonarqube.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.keycloak.enabled $istioEnabled .Values.packages.sonarqube.dependsOn }}
  dependsOn:
  {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if and .Values.packages.keycloak.enabled .Values.packages.sonarqube.sso.enabled}}
    - name: keycloak
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.sonarqube) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
