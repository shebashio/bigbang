{{- include "bigbang.normalizePackageAliases" . -}}
{{- if eq (include "authserviceEnabled" .) "true" }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.authservice
  "name" "authservice"
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.authservice" .)
)}}
{{- end }}

{{- define "bigbang.defaults.authservice" -}}
{{- $ambientEnabled := eq (include "ambientEnabled" .) "true" }}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
{{- $authserviceValues := .Values.packages.authservice.values | default dict }}
{{- $internalRedisEnabled := dig "redis" "enabled" false $authserviceValues }}
{{- $externalRedisUri := dig "global" "redis_server_uri" "" $authserviceValues }}
{{- /* Generate one automatic route; additional chain-specific Redis hosts require explicit outbound routes. */ -}}
{{- range $_, $chain := (.Values.packages.authservice.chains | default dict) }}
{{- if and (empty $externalRedisUri) (kindIs "map" $chain) }}
{{- $externalRedisUri = get $chain "redis_server_uri" | default "" }}
{{- end }}
{{- end }}
{{- range $_, $chain := (dig "chains" dict $authserviceValues) }}
{{- if and (empty $externalRedisUri) (kindIs "map" $chain) }}
{{- $externalRedisUri = get $chain "redis_server_uri" | default "" }}
{{- end }}
{{- end }}
{{- $externalRedisEnabled := not (empty $externalRedisUri) }}
{{- $externalRedisAddress := regexReplaceAll "^[a-zA-Z][a-zA-Z0-9+.-]*://" $externalRedisUri "" }}
{{- $externalRedisAddress = regexReplaceAll "^.*@" $externalRedisAddress "" }}
{{- $externalRedisHost := trimSuffix ":6379" $externalRedisAddress }}

image: 
  pullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
  
{{- include "secretsImagePullSecretsWithName" . }}

podAnnotations:
  {{ include "istioAnnotation" . }}

{{- if .Values.packages.kiali.enabled }}
podLabels:
  service.istio.io/canonical-name: authservice
{{- end }}

openshift: {{ .Values.openshift | default false }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled | default false }}

bb-common:
  routes:
    outbound:
      {{- if $externalRedisEnabled }}
      external-redis:
        enabled: {{ $externalRedisEnabled }}
        hosts:
        - {{ $externalRedisHost | quote }}
        ports:
        - number: 6379
          name: redis
          protocol: TCP
      {{- end }}
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.authservice.values }}
        hosts:
        - repo1.dso.mil
  networkPolicies:
    ingress:
      definitions:
        keycloak-protected:
          from:
            - namespaceSelector: {}
              podSelector:
                matchLabels:
                  {{- $key := (dig "selector" "key" "protect" .Values.packages.authservice.values) }}
                  {{- $value := (dig "selector" "value" "keycloak" .Values.packages.authservice.values) }}
                  {{ $key }}: {{ $value }}
      to:
        authservice:10003:
          from:
            definition:
              keycloak-protected: true
            {{- if or (eq (include "monitoring.authservice.waypointEnabled" .) "true") (eq (include "thanos.authservice.waypointEnabled" .) "true") }}
            k8s:
              {{- if eq (include "monitoring.authservice.waypointEnabled" .) "true" }}
              # ext_authz calls originate from the monitoring package's own waypoint pod,
              # which fronts prometheus/alertmanager for authservice in ambient mode.
              monitoring/waypoint:
                podSelector:
                  matchLabels:
                    gateway.networking.k8s.io/gateway-name: monitoring-monitoring-waypoint
              {{- end }}
              {{- if eq (include "thanos.authservice.waypointEnabled" .) "true" }}
              thanos/waypoint:
                podSelector:
                  matchLabels:
                    gateway.networking.k8s.io/gateway-name: thanos-waypoint
              {{- end }}
            {{- end }}
        # Grafana redis client connection
        redis-bb:6379:
          from:
            k8s:
              monitoring/grafana: {{ and $internalRedisEnabled .Values.packages.monitoring.enabled }}
        # Redis exporter metrics
        redis-bb:9121:
          from:
            k8s:
              monitoring/prometheus: {{ and $internalRedisEnabled .Values.packages.monitoring.enabled }}
        # HBONE ingress from istio-gateway to the authservice waypoint (ambient)
        authservice-waypoint:15008:
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: authservice-waypoint
          from:
            k8s:
              "istio-gateway/*": {{ and $ambientEnabled .Values.packages.istioGateway.enabled }}
              kiali-service-account@kiali/kiali: {{ and $ambientEnabled .Values.packages.kiali.enabled }}
    egress:
      from:
        authservice:
          to:
            definition:
              sso: true
              redis-subnets: {{ $externalRedisEnabled }}
            k8s:
              # Tempo trace data
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}

{{- if or $internalRedisEnabled $externalRedisEnabled }}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
{{- end }}

{{- if and $internalRedisEnabled (or .Values.packages.monitoring.enabled .Values.packages.kiali.enabled) }}
redis-bb:
  upstream:
    global:
      {{- include "secretsImagePullSecrets" . | nindent 6 }}

    {{- if eq (include "metricScrapingEnabled" .) "true" }}
    metrics:
      enabled: true
      image:
        {{- include "secretsPullSecrets" . | nindent 8 }}
      serviceMonitor:
        enabled: true
        namespace: authservice
        selector: 
          app.kubernetes.io/name: redis-bb
          app.kubernetes.io/instance: authservice-authservice
        {{- if eq (include "metricsSidecarMtls" (list .Values.packages.authservice .)) "true" }}
        scheme: https
        tlsConfig:
          caFile: /etc/prom-certs/root-cert.pem
          certFile: /etc/prom-certs/cert-chain.pem
          keyFile: /etc/prom-certs/key.pem
          insecureSkipVerify: true
        {{- end }}
      prometheusRule:
        enabled: true 
        namespace: monitoring
    {{- end }}
{{- end }}

{{- $legacy := and .Values.sso.oidc.realm .Values.sso.oidc.host -}}
{{- if not $legacy }}
issuer_uri: {{ include "sso.url" . }}
{{- end }}

global:
  oidc:
    host: {{ default (include "sso.host" .) .Values.sso.oidc.host }}
    realm: {{ default (include "sso.realm" .) .Values.sso.oidc.realm }}

  {{- if or .Values.sso.jwks_uri (dig "oidc" "jwksUri" false .Values.sso) }}
  jwks_uri: {{ include "sso.oidc.jwksuri" . | quote }}
  {{- else if or .Values.sso.jwks (dig "oidc" "jwks" false .Values.sso) }}
  jwks: {{ default (dig "oidc" "jwks" "" .Values.sso) .Values.sso.jwks | quote }}
  {{- end }}

  {{- if or .Values.sso.client_id (dig "sso" "client_id" false .Values.packages.authservice) }}
  client_id: {{ default (dig "sso" "client_id" "" .Values.packages.authservice) .Values.sso.client_id }}
  {{- end }}

  {{- if or .Values.sso.client_secret (dig "sso" "client_secret" false .Values.packages.authservice) }}
  client_secret: {{ default (dig "sso" "client_secret" "" .Values.packages.authservice) .Values.sso.client_secret }}
  {{- end }}

  {{- if (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
  certificate_authority: {{ (default (dig "certificateAuthority" "cert" "" .Values.sso) .Values.sso.certificate_authority) | quote }}
  {{- end }}

  {{- if not $legacy }}
  authorization_uri: {{ include "sso.oidc.auth" . }}
  token_uri: {{ include "sso.oidc.token" . }}
  logout_redirect_uri: {{ include "sso.oidc.endsession" . }}
  {{- end }}

  {{- $redisValues := $authserviceValues.redis | default dict }}
  {{- if hasKey $redisValues "enabled" }}
  {{- if $redisValues.enabled }}
  redis_server_uri: "tcp://authservice-authservice-redis-bb-master:6379"
  {{- end }}
  {{- end }}

chains:
  {{- if .Values.packages.authservice.chains }}
  {{ .Values.packages.authservice.chains | toYaml | nindent 2 }}
  {{- end }}

  {{- if and .Values.packages.thanos.enabled .Values.packages.thanos.sso.enabled (not (hasKey (.Values.packages.authservice.chains | default dict) "thanos")) }}
  thanos:
    match:
      header: ":authority"
      prefix: thanos.{{ .Values.domain }}
    callback_uri: https://thanos.{{ .Values.domain }}/login/generic_oauth
    client_id: "{{ .Values.packages.thanos.sso.client_id }}"
    client_secret: "{{ .Values.packages.thanos.sso.client_secret }}"
    {{- if not $legacy }}
    authorization_uri: {{ include "sso.oidc.auth" . }}
    token_uri: {{ include "sso.oidc.token" . }}
    logout_redirect_uri: {{ include "sso.oidc.endsession" . }}
    {{- end }}
  {{- end }}

  {{- if and .Values.packages.monitoring.enabled .Values.packages.monitoring.sso.enabled }}
  {{- if not (hasKey (.Values.packages.authservice.chains | default dict) "prometheus") }}
  prometheus:
    match:
      header: ":authority"
    {{- $prometheusHosts := (dig "istio" "prometheus" "hosts" dict .Values.packages.monitoring.values) }}
    {{- if $prometheusHosts }}
      prefix: {{ tpl ($prometheusHosts | first) $ }}
    callback_uri: https://{{ tpl ($prometheusHosts | first) $ }}/login/generic_oauth
    {{- else }}
      prefix: {{ printf "prometheus.%s" $domainName }}
    callback_uri: https://prometheus.{{ $domainName }}/login/generic_oauth
    {{- end }}
    client_id: {{ .Values.packages.monitoring.sso.prometheus.client_id }}
    client_secret: "{{ .Values.packages.monitoring.sso.prometheus.client_secret }}"
    {{- if not $legacy }}
    authorization_uri: {{ include "sso.oidc.auth" . }}
    token_uri: {{ include "sso.oidc.token" . }}
    logout_redirect_uri: {{ include "sso.oidc.endsession" . }}
    {{- end }}
  {{- end }}

  {{- if not (hasKey (.Values.packages.authservice.chains | default dict) "alertmanager") }}
  alertmanager:
    match:
      header: ":authority"
    {{- $alertmanagerHosts := (dig "istio" "alertmanager" "hosts" dict .Values.packages.monitoring.values) }}
    {{- if $alertmanagerHosts }}
      prefix: {{ tpl ($alertmanagerHosts | first) $ }}
    callback_uri: https://{{ tpl ($alertmanagerHosts | first) $ }}/login/generic_oauth
    {{- else }}
      prefix: {{ printf "alertmanager.%s" $domainName }}
    callback_uri: https://alertmanager.{{ $domainName }}/login/generic_oauth
    {{- end }}
    client_id: {{ .Values.packages.monitoring.sso.alertmanager.client_id }}
    client_secret: "{{ .Values.packages.monitoring.sso.alertmanager.client_secret }}"
    {{- if not $legacy }}
    authorization_uri: {{ include "sso.oidc.auth" . }}
    token_uri: {{ include "sso.oidc.token" . }}
    logout_redirect_uri: {{ include "sso.oidc.endsession" . }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end -}}
