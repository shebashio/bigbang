{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsAuthservice := mergeOverwrite (deepCopy .Values.flux) .Values.packages.authservice.flux -}}
{{- if eq (include "authserviceEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authservice
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authservice
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/authservice/values.yaml") . | sha256sum }}
spec:
  targetNamespace: authservice
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "authservice" "package" .Values.packages.authservice "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsAuthservice | nindent 2 }}

  {{- if .Values.packages.authservice.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.authservice.postRenderers | nindent 4 }}
  {{- end }}

  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "authservice" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.authservice.dependsOnOverride) }}
  {{- with .Values.packages.authservice.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  dependsOn:
  {{- include "istioHelmReleases" . | nindent 2 }}
  {{- if .Values.packages.monitoring.enabled }}
  - name: monitoring
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.authservice) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}
