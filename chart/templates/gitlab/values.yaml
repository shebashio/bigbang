{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.gitlab.enabled }}
{{- $objectStorageValues := .Values.packages.gitlab.objectStorage -}}
{{- range $endpointName := list "endpoint" "regionendpoint" -}}
  {{- $endpointValue := get $objectStorageValues $endpointName -}}
  {{- if and (not (empty $endpointValue)) (not (regexMatch "^https?://" ($endpointValue | toString))) -}}
    {{- fail (printf "addons.gitlab.objectStorage.%s must begin with http:// or https:// when set" $endpointName) -}}
  {{- end -}}
{{- end -}}
{{- include "values-secret" (dict 
  "root" $ 
  "package" .Values.packages.gitlab 
  "name" "gitlab" 
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.gitlab" .)
)}}
{{- end }}
{{- if and (ne .Values.packages.gitlab.objectStorage.iamProfile "") (ne .Values.packages.gitlab.objectStorage.accessKey "") }}{{- fail "Must choose to use an IAM profile OR an AWS accessKey/accessSecret at .Values.packages.gitlab.objectStorage" }}{{- end }}
{{- define "bigbang.defaults.gitlab" -}}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
hostname: {{ $domainName }}

# Define variables to help with conditionals later
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $extObjStorageIsConfigured := (or .Values.packages.gitlab.objectStorage.region .Values.packages.gitlab.objectStorage.endpoint) }}
{{- $consolidatedObjStoreEnabled := dig "global" "appConfig" "object_store" "enabled" false .Values.packages.gitlab.values }}
{{- $iamProfile := (and (ne .Values.packages.gitlab.objectStorage.iamProfile "") $extObjStorageIsConfigured) }}
{{- $kasEnabled := dig "global" "kas" "enabled" false .Values.packages.gitlab.values }}
{{- $externalRedisConfigured := eq (include "bigbang.gitlab.externalRedisConfigured" .) "true" }}
{{- $externalPostgresConfigured := eq (include "bigbang.gitlab.externalPostgresConfigured" .) "true" }}
{{- $gitlabGlobalValues := (get .Values.packages.gitlab.values "global") | default dict }}
{{- $gitlabRedisValues := dict }}
{{- $gitlabPsqlValues := dict }}
{{- if kindIs "map" $gitlabGlobalValues }}
  {{- $configuredRedisValues := (get $gitlabGlobalValues "redis") | default dict }}
  {{- if kindIs "map" $configuredRedisValues }}
    {{- $gitlabRedisValues = $configuredRedisValues }}
  {{- end }}
  {{- $configuredPsqlValues := (get $gitlabGlobalValues "psql") | default dict }}
  {{- if kindIs "map" $configuredPsqlValues }}
    {{- $gitlabPsqlValues = $configuredPsqlValues }}
  {{- end }}
{{- end }}
{{- $externalRedisHost := get $gitlabRedisValues "host" }}
{{- $externalRedisRouteEnabled := and $externalRedisConfigured (not (empty $externalRedisHost)) }}
{{- $gitlabUpstreamValues := (get .Values.packages.gitlab.values "upstream") | default dict }}
{{- $externalObjectStorageConfigured := eq (include "bigbang.gitlab.externalObjectStorageConfigured" .) "true" }}
{{- $minioEnabled := true }}
{{- if hasKey $gitlabGlobalValues "minio" }}
  {{- $gitlabMinioValues := get $gitlabGlobalValues "minio" }}
  {{- if kindIs "map" $gitlabMinioValues }}
    {{- $minioEnabled = dig "enabled" true $gitlabMinioValues }}
  {{- else }}
    {{- $minioEnabled = false }}
  {{- end }}
{{- end }}
{{- $postgresEnabled := true }}
{{- if hasKey $gitlabUpstreamValues "postgresql" }}
  {{- $gitlabPostgresqlValues := get $gitlabUpstreamValues "postgresql" }}
  {{- if kindIs "map" $gitlabPostgresqlValues }}
    {{- $postgresEnabled = dig "install" true $gitlabPostgresqlValues }}
  {{- else }}
    {{- $postgresEnabled = false }}
  {{- end }}
{{- end }}
{{- if $externalObjectStorageConfigured }}
  {{- $minioEnabled = false }}
{{- end }}
{{- if $externalPostgresConfigured }}
  {{- $postgresEnabled = false }}
{{- end }}
{{- $iamProfileUsed := dig "use_iam_profile" false .Values.packages.gitlab.values }}
{{- $iamProfileUsed = not (empty .Values.packages.gitlab.objectStorage.iamProfile) | or $iamProfileUsed }}

openshift: {{ .Values.openshift }}

routes:
  inbound:
    gitlab:
      enabled: true
      gateways:
      - {{ include "getGatewayName" (dict "gateway" (.Values.packages.gitlab.ingress.gateway | default "public") "root" .)}}
      hosts:
      - "{{ .Values.packages.gitlab.hostnames.gitlab }}.{{ .Values.domain }}"
      http:
      - fault:
          abort:
            httpStatus: 403
            percentage:
              value: 100
        match:
        - uri:
            prefix: /-/metrics
        route:
        - destination:
            host: gitlab-webservice-default
            port:
              number: 8181
      - match:
        - uri:
            prefix: /
        route:
        - destination:
            host: gitlab-webservice-default
            port:
              number: 8181
      - match:
        - uri:
            prefix: /admin/sidekiq
        route:
        - destination:
            host: gitlab-webservice-default
            port:
              number: 8080
      selector:
        app: webservice

    registry:
      enabled: true
      gateways:
      - {{ include "getGatewayName" (dict "gateway" (.Values.packages.gitlab.ingress.gateway | default "public") "root" .)}}
      hosts:
      - "{{ .Values.packages.gitlab.hostnames.registry }}.{{ .Values.domain }}"
      service: gitlab-registry
      port: 5000
      selector:
        app: registry
    {{- if $kasEnabled }}
    kas:
      enabled: {{ dig "global" "kas" "enabled" true .Values.packages.gitlab.values }}
      gateways:
      - {{ include "getGatewayName" (dict "gateway" (.Values.packages.gitlab.ingress.gateway | default "public") "root" .)}}
      hosts:
      - kas.{{ .Values.domain }}
      http:
      - match:
        - uri:
            prefix: /-/kubernetes-agent
        route:
        - destination:
            host: gitlab-kas
            port:
              number: 8150
      selector:
        app: kas
    {{- end }}

    pages:
      enabled: false
      gateways:
      - {{ include "getGatewayName" (dict "gateway" (.Values.packages.gitlab.ingress.gateway | default "public") "root" .)}}
      hosts:
      - "pages.{{ .Values.domain }}"
      service: gitlab-pages
      port: 8090
      selector:
        app: gitlab-pages
  outbound:
    sso:
      enabled: {{ or .Values.packages.gitlab.sso.enabled (dig "sso" "enabled" false .Values.packages.gitlab.values) }}
      hosts:
      - {{ coalesce (dig "sso" "host" nil .Values.packages.gitlab.values) (include "sso.host" .) }}
    external-redis:
      enabled: {{ $externalRedisRouteEnabled }}
      {{- if $externalRedisRouteEnabled }}
      hosts:
      - {{ $externalRedisHost | quote }}
      ports:
      - number: {{ default 6379 (get $gitlabRedisValues "port") }}
        name: redis
        protocol: TCP
      {{- end }}
    bb-tests:
      enabled: {{ dig "bbtests" "enabled" false .Values.packages.gitlab.values }}
      hosts:
      - 'repo1.dso.mil'
      - 'registry1.dso.mil'
      - 'ib-prod-harbor-storage.s3.us-gov-west-1.amazonaws.com'
      - 'ib-prod-harbor-storage.s3.us-gov-east-1.amazonaws.com'
      - registry.{{ $domainName }}
      - keycloak.{{ $domainName }}

{{- $istioHardened := dig "hardened" "enabled" false .Values.packages.istiod.values }}
istio:
  sidecar:
    enabled: {{ and $istioHardened (ne (include "ambientEnabled" .) "true") }}

networkPolicies:
  ingress:
    to:
      redis:9121: 
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and (not $externalRedisConfigured) .Values.packages.monitoring.enabled (dig "redis" "install" true .Values.packages.gitlab.values) }}
      gitlab-exporter:9168:
        podSelector:
          matchLabels:
            app: gitlab-exporter
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.packages.monitoring.enabled }}
      gitaly:9236:
        podSelector:
          matchLabels:
            app: gitaly
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.packages.monitoring.enabled }}
      webservice:8181:
        podSelector:
          matchLabels:
            app: webservice
        from:
          k8s:
            # Allow any service account from the gitlab-runner namespace; the runner 
            # coordinator has a different service account to the jobs it runs
            gitlab-runner/gitlab-runner: 
              enabled: {{ .Values.packages.gitlabRunner.enabled }}
              podSelector:
                matchLabels:
                  app: gitlab-runner
      webservice:[8083,8084,9229]:
        podSelector:
          matchLabels:
            app: webservice
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.packages.monitoring.enabled }}

      registry:5001:
        podSelector:
          matchLabels:
            app: registry
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.packages.monitoring.enabled }}
      {{- if $kasEnabled }}
      kas:[8150,8153]:
        podSelector:
          matchLabels:
            app: kas
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.packages.monitoring.enabled }}
      {{- end }}

      gitlab-runner:9252:
        podSelector:
          matchLabels:
            app: gitlab-runner
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.packages.monitoring.enabled }}
  egress:
    {{- if empty .Values.networkPolicies.egress.definitions.kubeAPI }}
    definitions:
      kubeAPI:
        to:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.controlPlaneCidr }}
            {{- if eq .Values.networkPolicies.controlPlaneCidr "0.0.0.0/0" }}
            except:
            - 169.254.169.254/32
            {{- end }}
        {{- if not (eq .Values.networkPolicies.controlPlaneCidr .Values.networkPolicies.vpcCidr) }}
        {{- if not (eq .Values.networkPolicies.vpcCidr "0.0.0.0/0") }}
        - ipBlock:
            cidr: {{ .Values.networkPolicies.vpcCidr }}
        {{- end }}
        {{- end }}
    {{- end }}
    from:
      "*":
        to:
          definition:
            kubeAPI: true
          k8s:
            tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
      sidekiq:
        to:
          cidr:
            169.254.169.254/32: {{ $iamProfileUsed }}
          definition:
            storage-subnets: true
            database-subnets: {{ not $postgresEnabled }}
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      webservice:
        to:
          cidr:
            169.254.169.254/32: {{ $iamProfileUsed }}
          definition:
            sso: true
            database-subnets: true
            storage-subnets: {{ not $minioEnabled }}
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      migrations:
        to:
          cidr:
            169.254.169.254/32: {{ $iamProfileUsed }}
          definition:
            database-subnets: true
            storage-subnets: {{ not $minioEnabled }}
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      registry:
        to:
          cidr:
            169.254.169.254/32: {{ $iamProfileUsed }}
          definition:
            storage-subnets: {{ not $minioEnabled }}
            database-subnets: {{ not $postgresEnabled }}
      toolbox:
        to:
          cidr:
            169.254.169.254/32: {{ $iamProfileUsed }}
          definition:
            storage-subnets: {{ not $minioEnabled }}
            database-subnets: {{ not $postgresEnabled }}
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      {{- if eq (include "metricScrapingEnabled" .) "true" }}
      gitlab-exporter:
        podSelector:
          matchLabels:
            app: gitlab-exporter
        to:
          definition:
            database-subnets: {{ not $postgresEnabled }}
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      {{- end }}
      {{- if and $externalRedisConfigured $kasEnabled }}
      kas:
        to:
          definition:
            redis-subnets: true
      {{- end }}
      {{- if and $externalRedisConfigured (dig "upstream" "gitlab" "mailroom" "enabled" false .Values.packages.gitlab.values) }}
      mailroom:
        podSelector:
          matchLabels:
            app: mailroom
        to:
          definition:
            redis-subnets: true
      {{- end }}

bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://gitlab.%s" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.gitlab "values" .Values) | nindent 6 }}
  scripts:
    envs:
      GITLAB_REGISTRY: registry.{{ $domainName }}

upstream:
  {{- if and (or $istioEnabled .Values.packages.monitoring.enabled) (dig "redis" "install" true .Values.packages.gitlab.values) }}
  redis:
    {{- if eq (include "metricScrapingEnabled" .) "true" }}
    metrics:
      serviceMonitor:
        enabled: true
        namespace: gitlab
    {{- end }}
    {{- if $istioEnabled }}
    master:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    replica:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    {{- end }}
  {{- end }}

  {{- if or .Values.packages.gitlab.database.host $istioEnabled }}
  postgresql:
    {{- if .Values.packages.gitlab.database.host }}
    install: false
    {{- end }}
    {{- if $istioEnabled }}
    primary:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    readReplicas:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    {{- end }}
  {{- end }}

  {{- if or $extObjStorageIsConfigured $istioEnabled }}
  registry:
    {{- if $extObjStorageIsConfigured }}
    storage:
      secret: gitlab-object-storage
      key: registry
    {{- end }}
    {{- if or $iamProfile $istioEnabled }}
    annotations: 
      {{- if $iamProfile }}
      iam.amazonaws.com/role: {{ .Values.packages.gitlab.objectStorage.iamProfile }}
      {{- end }}
      {{- if $istioEnabled }}
      {{ include "istioAnnotation" . }}
      {{- end }}
    {{- end }}
    {{- if eq (include "metricsSidecarMtls" (list .Values.packages.gitlab .)) "true" }}
    metrics:
      serviceMonitor:
        endpointConfig:
          scheme: https
          tlsConfig:
            caFile: /etc/prom-certs/root-cert.pem
            certFile: /etc/prom-certs/cert-chain.pem
            keyFile: /etc/prom-certs/key.pem
            insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
    {{- end }}
  {{- end }}

  gitlab:
    {{- if or $extObjStorageIsConfigured $istioEnabled }}
    toolbox:
      {{- if $extObjStorageIsConfigured }}
      backups:
        objectStorage:
          config:
            secret: gitlab-object-storage
            key: backups
      {{- end }}
      {{- if or $iamProfile $istioEnabled }}
      annotations:
        {{- if $iamProfile }}
        iam.amazonaws.com/role: {{ .Values.packages.gitlab.objectStorage.iamProfile }}
        {{- end }}
        {{- if $istioEnabled }}
        {{ include "istioAnnotation" . }}
        {{- end }}
      {{- end }}
    {{- end }}
    gitlab-exporter:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
      {{- if $istioEnabled }}
      metrics:
        annotations:
          {{ include "istioAnnotation" . }}
      {{- end }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.packages.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}

    {{- if or $iamProfile $istioEnabled }}
    webservice:
    {{- if eq (include "metricsSidecarMtls" (list .Values.packages.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      workhorse:
        metrics:
          serviceMonitor:
            endpointConfig:
              scheme: https
              tlsConfig:
                caFile: /etc/prom-certs/root-cert.pem
                certFile: /etc/prom-certs/cert-chain.pem
                keyFile: /etc/prom-certs/key.pem
                insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
    {{- end }}
    {{- if or $iamProfile $istioEnabled }}
      annotations: 
        {{- if $iamProfile }}
        iam.amazonaws.com/role: {{ .Values.packages.gitlab.objectStorage.iamProfile }}
        {{- end }}
        {{- if $istioEnabled }}
        {{ include "istioAnnotation" . }}
        {{- end }}
    sidekiq:
      annotations: 
        {{- if $iamProfile }}
        iam.amazonaws.com/role: {{ .Values.packages.gitlab.objectStorage.iamProfile }}
        {{- end }}
        {{- if $istioEnabled }}
        {{ include "istioAnnotation" . }}
        {{- end }}
    {{- end }}
    {{- end }}
  {{- if $istioEnabled }}
    migrations:
      annotations:
        {{ include "istioAnnotation" . }}
    gitaly:
      annotations:
        {{ include "istioAnnotation" . }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.packages.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}
    gitlab-shell:
      annotations:
        {{ include "istioAnnotation" . }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.packages.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}
    {{- if $kasEnabled }}
    kas:
      annotations:
        {{ include "istioAnnotation" . }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.packages.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}
    {{- end }}
    praefect:
      annotations:
        {{ include "istioAnnotation" . }}
    gitlab-grafana:
      annotations:
        {{ include "istioAnnotation" . }}
  shared-secrets:
    annotations:
      {{ include "istioAnnotation" . }}
  minio:
    podAnnotations:
      {{ include "istioAnnotation" . }}
  {{- end }}

global:
  domain: {{ $domainName }}
  {{- if and .Values.packages.gitlab.sso.enabled (or (dig "certificateAuthority" "secretName" false .Values.sso) .Values.sso.secretName) }}
  certificates:
    customCAs:
      {{- if and .Values.packages.gitlab.sso.enabled (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
      - secret: {{ default (dig "certificateAuthority" "secretName" "" .Values.sso) .Values.sso.secretName }}
      {{- end }}
      - secret: ca-certs-australian-defence-organisation-cross-cert-chain
      - secret: ca-certs-australian-defence-organisation-direct-trust-chain
      - secret: ca-certs-boeing
      - secret: ca-certs-carillon-federal-services-trust-chain-1
      - secret: ca-certs-carillon-federal-services-trust-chain-2
      - secret: ca-certs-department-of-state-trust-chain-1
      - secret: ca-certs-department-of-state-trust-chain-2
      - secret: ca-certs-digicert-federal-ssp-trust-chain-1
      - secret: ca-certs-digicert-federal-ssp-trust-chain-2
      - secret: ca-certs-digicert-nfi-trust-chain-1
      - secret: ca-certs-digicert-nfi-trust-chain-2
      - secret: ca-certs-entrust-federal-ssp-trust-chain-1
      - secret: ca-certs-entrust-federal-ssp-trust-chain-2
      - secret: ca-certs-entrust-managed-service-nfi
      - secret: ca-certs-exostar-llc
      - secret: ca-certs-identrust-nfi
      - secret: ca-certs-lockheed-martin
      - secret: ca-certs-netherlands-ministry-of-defence
      - secret: ca-certs-northrop-grumman
      - secret: ca-certs-raytheon-trust-chain-1
      - secret: ca-certs-raytheon-trust-chain-2
      - secret: ca-certs-us-treasury-ssp-trust-chain-1
      - secret: ca-certs-us-treasury-ssp-trust-chain-2
      - secret: ca-certs-verizon-cybertrust-federal-ssp
      - secret: ca-certs-widepoint-federal-ssp-trust-chain-1
      - secret: ca-certs-widepoint-federal-ssp-trust-chain-2
      - secret: ca-certs-widepoint-nfi
      - secret: ca-certs-dod-intermediate-and-issuing-ca-certs
      - secret: ca-certs-dod-trust-anchors-self-signed
      - secret: ca-certs-eca
  {{end}}

  # added to help with Gitlab sub-chart configuration
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsPullSecretsWithName" . | nindent 4 }}

  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}

  hosts:
    domain: {{ $domainName }}

    gitlab:
      name: {{ .Values.packages.gitlab.hostnames.gitlab }}.{{ $domainName }}

    registry:
      name: {{ .Values.packages.gitlab.hostnames.registry }}.{{ $domainName }}

  {{- if or (ne .Values.packages.gitlab.objectStorage.iamProfile "") $extObjStorageIsConfigured }}
  minio:
    enabled: false
  {{- end }}

  {{- if .Values.packages.gitlab.database.host }}
  psql:
    host: {{ .Values.packages.gitlab.database.host }}
    port: {{ .Values.packages.gitlab.database.port }}
    username: {{ .Values.packages.gitlab.database.username }}
    database: {{ .Values.packages.gitlab.database.database }}
    password:
      secret: gitlab-database
      key: PGPASSWORD
  {{- end }}

  {{- if $extObjStorageIsConfigured }}
  registry:
    {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
    bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-registry
    {{- else }}
    bucket: gitlab-registry
    {{- end }}
  {{- end }}

  {{- if or .Values.packages.gitlab.sso.enabled $extObjStorageIsConfigured $consolidatedObjStoreEnabled }}
  appConfig:
    {{- end }}

    {{- if .Values.packages.gitlab.sso.enabled }}
    omniauth:
      enabled: true
      {{- $global := .Values.packages.gitlab.values.global | default dict }}
      {{- $appConfig := $global.appConfig | default dict }}
      {{- $omniauth := $appConfig.omniauth | default dict }}
      {{- if hasKey $omniauth "allowSingleSignOn" }}
      allowSingleSignOn: {{ .Values.packages.gitlab.values.global.appConfig.omniauth.allowSingleSignOn }}
      {{- else }}
      allowSingleSignOn: ['openid_connect']
      {{- end }}
      {{- if hasKey $omniauth "blockAutoCreatedUsers" }}
      blockAutoCreatedUsers: {{ .Values.packages.gitlab.values.global.appConfig.omniauth.blockAutoCreatedUsers }}
      {{- else }}
      blockAutoCreatedUsers: false
      {{- end }}

      providers:
        - secret: gitlab-sso-provider
          key: gitlab-sso.json
    {{- end }}

    {{- if or $extObjStorageIsConfigured $consolidatedObjStoreEnabled }}
    {{- if and $extObjStorageIsConfigured $consolidatedObjStoreEnabled }}
    object_store:
      enabled: true
      connection:
        secret: gitlab-object-storage
        key: rails
    {{- end }}

    lfs:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-lfs
      {{- else }}
      bucket: gitlab-lfs
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    artifacts:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-artifacts
      {{- else }}
      bucket: gitlab-artifacts
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    uploads:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-uploads
      {{- else }}
      bucket: gitlab-uploads
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    packages:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-packages
      {{- else }}
      bucket: gitlab-packages
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    externalDiffs:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-mr-diffs
      {{- else }}
      bucket: gitlab-mr-diffs
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    terraformState:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-terraform-state
      {{- else }}
      bucket: gitlab-terraform-state
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    dependencyProxy:
      enabled: true
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-dependency-proxy
      {{- else }}
      bucket: gitlab-dependency-proxy
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    pseudonymizer:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-pseudo
      {{- else }}
      bucket: gitlab-pseudo
      {{- end }}
      connection:
        secret: gitlab-object-storage
        key: rails

    backups:
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-backup
      {{- else }}
      bucket: gitlab-backup
      {{- end }}
      {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
      tmpBucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-backup-tmp
      {{- else }}
      tmpBucket: gitlab-backup-tmp
    {{- end }}
  {{- end }}

  {{- if and (ne .Values.packages.gitlab.redis.password "") (or .Values.packages.gitlab.enabled .Values.packages.gitlabRunner.enabled) }}
  redis:
    auth:
      enabled: true
      secret: "gitlab-redis-secret-bb"
      key: "secret"
  {{- end }}

  {{- if .Values.packages.gitlab.smtp.password }}
  smtp:
    password:
      secret: "gitlab-smtp-password"
  {{- end }}

  {{- if .Values.packages.gitlab.railsSecret }}
  railsSecrets:
    secret: "gitlab-rails-secret-bb"
  {{- end }}


{{- if ne .Values.packages.gitlab.objectStorage.iamProfile "" }}
use_iam_profile: true
{{- end }}
{{- end -}}



{{- /* This function merges defaults in lists from above into overlays */ -}}
{{- /* The end user will not have to replicate exclusions/repos from above when providing an overlay */ -}}
{{- /* There is a hidden flag `skipOverlayMerge` that can be added to any certificates to ignore the defaults */ -}}
{{- define "bigbang.overlays.gitlab" }}

  {{- $defaults := fromYaml (include "bigbang.defaults.gitlab" .) }}

  {{- $overlays := dig "values" dict .Values.packages.gitlab }}
  {{- range $certificates, $default := $defaults.global }}
    {{- $overlay := (dig "global" $certificates dict $overlays) }}
    # Only continue if an overlay matches a default constriant and hidden "skipOverlayMerge" is not set
    {{- if and $overlay (not $overlay.skipOverlayMerge) }}

      # Add any default excludedNamespaces to overlay
      {{- if and (dig "customCAs"  list $default) (dig "customCAs"  list $overlay) }}

         {{ $_ := set $overlay "customCAs" (concat $default.customCAs $overlay.customCAs) }}

      {{- end }}
    {{- end }}
  {{- end }}
{{ toYaml $overlays }}
{{- end }}
