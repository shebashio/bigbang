{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.gitlab.enabled }}
{{- if or .Values.packages.gitlab.objectStorage.region .Values.packages.gitlab.objectStorage.endpoint }}
{{- if and (ne .Values.packages.gitlab.objectStorage.iamProfile "") (ne .Values.packages.gitlab.objectStorage.accessKey "") }}{{- fail "Must choose to use an IAM profile OR an AWS accessKey/accessSecret at .Values.packages.gitlab.objectStorage" }}{{- end }}
{{- $registryEndpoint := .Values.packages.gitlab.objectStorage.regionendpoint | default .Values.packages.gitlab.objectStorage.endpoint }}
apiVersion: v1
kind: Secret
metadata:
    name: gitlab-object-storage
    namespace: gitlab
type: kubernetes.io/opaque
stringData:
    rails: |-
      provider: AWS
      region: {{ .Values.packages.gitlab.objectStorage.region }}
      {{- if ne .Values.packages.gitlab.objectStorage.iamProfile "" }}
      use_iam_profile: true
      {{- else if eq .Values.packages.gitlab.objectStorage.iamProfile "" }}
      aws_access_key_id: {{ .Values.packages.gitlab.objectStorage.accessKey }}
      aws_secret_access_key: {{ .Values.packages.gitlab.objectStorage.accessSecret }}
      {{- end }}
      {{- if .Values.packages.gitlab.objectStorage.endpoint }}
      endpoint: "{{ .Values.packages.gitlab.objectStorage.endpoint }}"
      {{- end }}
      {{- if eq .Values.packages.gitlab.objectStorage.type "minio" }}
      aws_signature_version: 4
      path_style: true
      {{- end }}
    registry: |-
      s3:
        {{- $global := .Values.packages.gitlab.values.global | default dict }}
        {{- $registryConfig := $global.registry | default dict }}
        {{- if .Values.packages.gitlab.objectStorage.bucketPrefix }}
        bucket: {{ .Values.packages.gitlab.objectStorage.bucketPrefix }}-gitlab-registry
        {{- else if hasKey $registryConfig "bucket" }}
        bucket: {{ .Values.packages.gitlab.values.global.registry.bucket }}
        {{- else }}
        bucket: gitlab-registry
        {{- end }}
        {{- if eq .Values.packages.gitlab.objectStorage.iamProfile "" }}
        accesskey: {{ .Values.packages.gitlab.objectStorage.accessKey }}
        secretkey: {{ .Values.packages.gitlab.objectStorage.accessSecret }}
        {{- end }}
        {{- if $registryEndpoint }}
        regionendpoint: "{{ $registryEndpoint }}"
        secure: {{ hasPrefix "https://" $registryEndpoint }}
        {{- end }}
        region: {{ .Values.packages.gitlab.objectStorage.region }}
        v4auth: true
        {{- if eq .Values.packages.gitlab.objectStorage.type "minio" }}
        pathstyle: true
        {{- end }}
    backups: |-
      [default]
      {{- if eq .Values.packages.gitlab.objectStorage.iamProfile "" }}
      access_key = {{ .Values.packages.gitlab.objectStorage.accessKey }}
      secret_key = {{ .Values.packages.gitlab.objectStorage.accessSecret }}
      {{- end }}
      {{- if .Values.packages.gitlab.objectStorage.endpoint }}
      host_base = {{ regexReplaceAll "http(s*)://" .Values.packages.gitlab.objectStorage.endpoint "" }}
      {{- if eq .Values.packages.gitlab.objectStorage.type "minio" }}
      host_bucket = {{ regexReplaceAll "http(s*)://" .Values.packages.gitlab.objectStorage.endpoint "" }}
      {{- else }}
      host_bucket = %(bucket)s.{{ regexReplaceAll "http(s*)://" .Values.packages.gitlab.objectStorage.endpoint "" }}
      {{- end }}
      use_https = {{ ternary "True" "False" (hasPrefix "https://" .Values.packages.gitlab.objectStorage.endpoint) }}
      {{- end }}
      bucket_location = {{ .Values.packages.gitlab.objectStorage.region }}
      multipart_chunk_size_mb = 128
{{- end }}
{{- end }}
