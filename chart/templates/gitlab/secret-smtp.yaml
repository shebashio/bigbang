{{- include "bigbang.normalizePackageAliases" . -}}
{{- if and .Values.packages.gitlab.smtp.password .Values.packages.gitlab.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-smtp-password
  namespace: gitlab
type: Opaque
data:
  password: {{ .Values.packages.gitlab.smtp.password | b64enc }}
{{- end }}
