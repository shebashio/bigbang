{{- include "bigbang.normalizePackageAliases" . -}}
{{- if and (ne .Values.packages.gitlab.redis.password "") .Values.packages.gitlab.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis-secret-bb
  namespace: gitlab
type: Opaque
data:
  secret: {{ .Values.packages.gitlab.redis.password | b64enc }}
{{- end }}
