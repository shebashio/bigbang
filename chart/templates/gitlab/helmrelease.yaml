{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsGitlab := mergeOverwrite (deepCopy .Values.flux) .Values.packages.gitlab.flux -}}
{{- if .Values.packages.gitlab.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: "developer-tools"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/gitlab/values.yaml") . | sha256sum }}
spec:
  releaseName: gitlab
  targetNamespace: gitlab
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "gitlab" "package" .Values.packages.gitlab "root" .) | nindent 2 }}


  {{- toYaml $fluxSettingsGitlab | nindent 2 }}
  {{- if or .Values.packages.gitlab.postRenderers (and .Values.packages.monitoring.enabled (ne (include "ambientEnabled" .) "true")) }}
  postRenderers:
  {{- if and .Values.packages.monitoring.enabled (ne (include "ambientEnabled" .) "true") }}
  {{ include "gitlab.serviceMonitorPostRenderers" . | nindent 4 }}
  {{- end }}
  {{- with .Values.packages.gitlab.postRenderers }}
  {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "gitlab" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.gitlab.dependsOnOverride) }}
  {{- with .Values.packages.gitlab.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.gitlab.dependsOn }}
  dependsOn:
  {{- if .Values.packages.gatekeeper.enabled }}
  - name: gatekeeper
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if $istioEnabled }}
  {{- include "istioHelmReleases" . | nindent 2 }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
  - name: kyverno-policies
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
  - name: monitoring
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.gitlab) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}
