{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.gitlab.enabled }}
{{- if .Values.packages.gitlab.database.host }}
apiVersion: v1
kind: Secret
metadata:
    name: gitlab-database
    namespace: gitlab
type: kubernetes.io/opaque
stringData:
    PGPASSWORD: {{ .Values.packages.gitlab.database.password | quote }}
{{- end }}
{{- end }}
