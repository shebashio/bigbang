{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.tempo.enabled }}
{{- /* Create a cleaned copy of tempo config and merge deprecated paths into current paths */ -}}
{{- $tempoPackage := deepCopy .Values.packages.tempo -}}
{{- if .Values.packages.tempo.values -}}
{{- $cleanedValues := include "mergeLegacyIstioHardenedKeys" (dict "values" .Values.packages.tempo.values) | fromYaml -}}
{{- $tempoPackage = set $tempoPackage "values" $cleanedValues -}}
{{- end -}}
{{- include "values-secret" (dict "root" $ "package" $tempoPackage "name" "tempo" "defaults" (include "bigbang.defaults.tempo" .)) }}
{{- end }}

{{- define "bigbang.defaults.tempo" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $istioHardenedEnabled := or (dig "istio" "hardened" "enabled" false .Values.packages.tempo.values) (dig "hardened" "enabled" false .Values.packages.istiod.values) }}
{{- $storageMode := dig "upstream" "tempo" "storage" "trace" "backend" "local" .Values.packages.tempo.values }}

upstream:
  # --- Add writable runtime volume ---
  extraVolumes:
    - name: tempo-runtime
      emptyDir: {}  # ephemeral, backed by node disk or memor
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
  {{- end }}

  {{- if .Values.packages.kiali.enabled }}
  podLabels:
    service.istio.io/canonical-name: tempo-tempo
  {{- end }}

  tempo:
    extraVolumeMounts:
      - name: tempo-runtime
        mountPath: /var/tempo
    pullPolicy: {{ .Values.imagePullPolicy }}
    global_overrides:
      ingestion_rate_limit_bytes: 30000000
  {{- with .Values.packages.tempo.objectStorage }}
  {{- if and .endpoint .region .bucket }}
    storage: 
      trace:
        backend: s3
        s3:
          endpoint: {{ .endpoint }}
          bucket: {{ .bucket }}
          region: {{ .region }}
          insecure: {{ .insecure }}
          forcepathstyle: true
  {{- end }}
  {{- end }}
  {{- if and .Values.packages.tempo.metricsGenerator.enabled .Values.packages.monitoring.enabled }}
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://monitoring-monitoring-kube-prometheus.monitoring.svc:9090/api/v1/write"
    per_tenant_overrides:
      'single-tenant':
        ingestion:
          rate_strategy: local
          rate_limit_bytes: 10485760         # 10MB/sec
          burst_size_bytes: 20971520         # 20MB burst
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
          processor:
            span_metrics:
              histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024, 2.048, 4.096, 8.192, 16.384]
              # Example spanmetrics filter, filters out non-server traces
              # filter_policies:
              #   - include:
              #       match_type: strict
              #       attributes:
              #         - key: kind
              #           value: SPAN_KIND_SERVER
  {{- end }}
  serviceMonitor:
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}

  tempoQuery:
    pullPolicy: {{ .Values.imagePullPolicy }}

  serviceAccount:
    {{- include "secretsImagePullSecretsWithName" . | nindent 4 }}

# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
hostname: {{ $domainName }}
domain: {{ $domainName }}

routes:
  inbound:
    tempo-query:
      gateways:
        - {{ include "getGatewayName" (dict "gateway" "public" "root" .)}}
      hosts:
        - tempo.{{ .Values.domain }}
      service: tempo-tempo.tempo.svc.cluster.local
      port: 3200
  outbound:
    bb-tests:
      enabled: {{ dig "bbtests" "enabled" false .Values.packages.tempo.values }}
      hosts:
      - repo1.dso.mil
      - grafana.{{ $domainName }}
      - grafana.com

networkPolicies:
  ingress:
    to:
      tempo:3200:
        from:
          k8s:
            monitoring-grafana@monitoring/grafana: {{ .Values.packages.grafana.enabled }}
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
            kiali-service-account@kiali/kiali: {{ .Values.packages.kiali.enabled }}
      tempo:4317:
        from:
          k8s:
            alloy-alloy-operator@alloy/alloy: {{ .Values.packages.alloy.enabled }}
            alloy-alloy-logs@alloy/alloy-logs: {{ .Values.packages.alloy.enabled }}
            alloy-alloy-receiver@alloy/alloy-receiver: {{ .Values.packages.alloy.enabled }}
  egress:
    from:
      tempo:
        to:
          k8s:
            monitoring/prometheus:9090: {{ .Values.packages.monitoring.enabled }}
          definition:
            # TODO: Revisit this logic for bb 4.0
            storage-subnets: {{ or (ne $storageMode "local") (not (empty .Values.packages.tempo.objectStorage.endpoint )) }}

istio:
  hardened:
    enabled: {{ $istioHardenedEnabled }}

bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://tempo.%s" $domainName | quote }}
      cypress_tempo_datasource: 'http://tempo-tempo.tempo.svc:3200'
      cypress_check_datasource: {{ .Values.packages.grafana.enabled | quote }}
      cypress_grafana_url: {{ printf "https://grafana.%s" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.tempo "values" .Values) | nindent 6 }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

sso:
  enabled: {{ .Values.packages.tempo.sso.enabled }}

{{- end -}}
