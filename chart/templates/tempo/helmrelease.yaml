{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsTempo := mergeOverwrite (deepCopy .Values.flux) .Values.packages.tempo.flux -}}
{{- if .Values.packages.tempo.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/tempo/values.yaml") . | sha256sum }}
spec:
  targetNamespace: tempo
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "tempo" "package" .Values.packages.tempo "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsTempo | nindent 2 }}

  postRenderers:
  {{ include "tempo.promPortsPostRenderers" . | nindent 2 }}
  {{- if .Values.packages.tempo.postRenderers }}
  {{- with .Values.packages.tempo.postRenderers }}
  {{ toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- if and .Values.packages.monitoring.enabled (eq (include "metricsSidecarMtls" (list .Values.packages.tempo .)) "true") }}
  {{ include "tempo.serviceMonitorPostRenderers" . | nindent 2 }}
  {{- end }}
  {{- if and .Values.packages.tempo.objectStorage.accessKey .Values.packages.tempo.objectStorage.accessSecret }}
  {{ include "tempo.objectStoragePostRenderers" . | nindent 2 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "tempo" "root" .) | nindent 2 }}
  {{- if not (kindIs "invalid" .Values.packages.tempo.dependsOnOverride) }}
  {{- with .Values.packages.tempo.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.monitoring.enabled .Values.packages.tempo.sso.enabled $istioEnabled .Values.packages.tempo.dependsOn }}
  dependsOn:
    {{- if  .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.tempo.sso.enabled }}
    - name: authservice
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.tempo) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
