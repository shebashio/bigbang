{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsIstioCore := mergeOverwrite (deepCopy .Values.flux) .Values.packages.istioCRDs.flux -}}
{{- if and .Values.packages.istioCRDs.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-crds
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: istio-crds
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/istio-crds/values.yaml") . | sha256sum }}
spec:
  releaseName: istio-crds
  targetNamespace: istio-system
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "istio-crds" "package" .Values.packages.istioCRDs "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsIstioCore | nindent 2 }}

  {{- if .Values.packages.istioCRDs.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.istioCRDs.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "istio-crds" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.istioCRDs.dependsOnOverride) }}
  {{- with .Values.packages.istioCRDs.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled .Values.packages.kyvernoPolicies.enabled .Values.packages.istioCRDs.dependsOn }}
  dependsOn:
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.istioCRDs) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
