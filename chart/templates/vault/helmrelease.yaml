{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsVault := mergeOverwrite (deepCopy .Values.flux) .Values.packages.vault.flux -}}

{{- if .Values.packages.vault.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: "security-tools"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/vault/values.yaml") . | sha256sum }}
spec:
  targetNamespace: vault
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "vault" "package" .Values.packages.vault "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsVault | nindent 2 }}
  
  {{- if .Values.packages.vault.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.vault.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "vault" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.vault.dependsOnOverride) }}
  {{- with .Values.packages.vault.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or $istioEnabled .Values.packages.kyvernoPolicies.enabled (dig "values" "minio" "enabled" false .Values.packages.vault) .Values.packages.vault.dependsOn }}
  dependsOn:
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}

    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ $.Release.Namespace }}
    {{- end }}

    {{- if (dig "values" "minio" "enabled" false .Values.packages.vault) }}
    - name: minio-operator
      namespace: {{ $.Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.vault) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
