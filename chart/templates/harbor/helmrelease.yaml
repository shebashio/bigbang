{{- include "bigbang.normalizePackageAliases" . -}}
{{- $pkg := "harbor" }}
{{- $fluxSettingsHarbor := mergeOverwrite (deepCopy .Values.flux) .Values.packages.harbor.flux -}}
{{- if (get .Values.packages $pkg).enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $pkg }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $pkg }}
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/harbor/values.yaml") . | sha256sum }}
spec:
  releaseName: {{ $pkg }}
  targetNamespace: {{ $pkg }}
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "harbor" "package" (get .Values.packages $pkg) "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsHarbor | nindent 2 }}

  postRenderers:
  {{ include "harbor.fixRegistryPostRender" . | nindent 2 }}
  {{- if and $istioEnabled (ne (include "ambientEnabled" .) "true") }}
  {{ include "harbor.ServiceMonitorPostRenderer" . | nindent 2 }}
  {{- end }}
  {{- if (get .Values.packages $pkg).postRenderers }}
  {{ toYaml (get .Values.packages $pkg).postRenderers | nindent 2 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "harbor" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.harbor.dependsOnOverride) }}
  {{- with .Values.packages.harbor.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.harbor.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.harbor) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
