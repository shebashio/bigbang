{{- include "bigbang.normalizePackageAliases" . -}}
{{- $pkg := "harbor" }}

{{- /* Create secret */ -}}
{{- if (get .Values.packages $pkg).enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.harbor
  "name" $pkg
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.harbor" .)
)}}
{{- end }}

{{- define "bigbang.defaults.harbor" -}}
{{- $postgresEnabled := dig "postgresql" "enabled" true .Values.packages.harbor.values }}
{{- $externalRedisAddr := dig "redis" "external" "addr" "" .Values.packages.harbor.values }}
{{- $externalRedisEnabled := and (eq (dig "redis" "type" "external" .Values.packages.harbor.values) "external") (not (empty $externalRedisAddr)) }}
{{- $externalRedisAddress := regexReplaceAll "^[a-zA-Z][a-zA-Z0-9+.-]*://" $externalRedisAddr "" }}
{{- $externalRedisAddress = regexReplaceAll "^.*@" $externalRedisAddress "" }}
{{- $externalRedisHost := regexReplaceAll ":\\d+(/.*)?$" $externalRedisAddress "" }}
{{- $externalRedisPort := default "6379" (regexFind ":[0-9]+" $externalRedisAddress | trimPrefix ":") }}

externalURL: https://harbor.{{ .Values.domain }}

global:
  domain: {{ .Values.domain }}
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
  imagePullPolicy: {{ .Values.imagePullPolicy }}

bb-common:
  routes:
    inbound:
      harbor:
        gateways:
          - {{ include "getGatewayName" (dict "gateway" .Values.packages.harbor.ingress.gateway "root" .)}}
    outbound:
      {{- if $externalRedisEnabled }}
      external-redis:
        enabled: true
        hosts:
        - {{ $externalRedisHost | quote }}
        ports:
        - number: {{ $externalRedisPort }}
          name: redis
          protocol: TCP
      {{- end }}
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.harbor.values }}
        hosts:
        - repo1.dso.mil
        - 'registry1.dso.mil'
        - 'index.docker.io'
        - 'auth.docker.io'
        - 'production.cloudflare.docker.com'
        - 'ib-prod-harbor-storage.s3.us-gov-west-1.amazonaws.com'
        - 'ib-prod-harbor-storage.s3.us-gov-east-1.amazonaws.com'

  networkPolicies:
    egress:
      from:
        harbor:
          to:
            definition:
              database-subnets: {{ not $postgresEnabled }}
              redis-subnets: {{ $externalRedisEnabled }}
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
    ingress:
      to:
        harbor:8001:
          from:
            k8s:
              alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}

bbtests:
  cypress:
    envs:
      cypress_url: {{ printf "https://harbor.%s" .Values.domain | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.harbor "values" .Values "testOnly" true) | nindent 6 }}
  scripts:
    envs:
      HARBOR_REGISTRY: {{ printf "harbor.%s" .Values.domain | quote }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

openshift: {{ .Values.openshift }}

redis-bb:
  upstream:
    image:
      pullSecrets: [] # redis currently sets this value.  Clear it out here, so global values are used

upstream:
  # upstream doesn't support global, so we set it here.
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
  imagePullPolicy: {{ .Values.imagePullPolicy }}

  metrics:
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    serviceMonitor:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}

{{- end }}
