{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.grafana.enabled }}
{{- /* Create package with merged overlay values */ -}}
{{- $grafanaPackage := deepCopy .Values.packages.grafana -}}
{{- $grafanaPackage = set $grafanaPackage "values" (fromYaml (include "bigbang.overlays.grafana" .)) -}}
{{- include "values-secret" (dict
  "root" $
  "package" $grafanaPackage
  "name" "grafana"
  "bbCommonSubchart" true
  "supportsRouteDefaults" true
  "defaults" (include "bigbang.defaults.grafana" .)
)}}
{{- end }}

{{- define "bigbang.defaults.grafana" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
global:
  domain: {{ $domainName }}

{{- $gitlabRedis := (and (ne .Values.packages.gitlab.redis.password "" ) (or .Values.packages.gitlab.enabled .Values.packages.gitlabRunner.enabled)) }}
{{- $gitlabExternalRedisHost := dig "global" "redis" "host" "" .Values.packages.gitlab.values }}
{{- $gitlabRedisHost := default "gitlab-redis-master.gitlab.svc.cluster.local" $gitlabExternalRedisHost }}
{{- $gitlabRedisPort := dig "global" "redis" "port" 6379 .Values.packages.gitlab.values }}
{{- $gitlabExternalRedisEnabled := and $gitlabRedis (not (empty $gitlabExternalRedisHost)) }}
{{- $argocdExternalRedisEnabled := and .Values.packages.argocd.enabled (not (empty .Values.packages.argocd.redis.host)) }}
{{- $authserviceRedisEnabled := (and (dig "values" "redis" "enabled" false .Values.packages.authservice) .Values.packages.authservice.enabled) }}
{{- $enterpriseEnabled := (dig "enterprise" "enabled" false .Values.packages.grafana) }}

flux:
  enabled: true

openshift: {{ .Values.openshift }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

sso:
  enabled: {{ or .Values.packages.grafana.sso.enabled .Values.packages.grafana.sso.enabled }}

{{- if $enterpriseEnabled }}
enterprise:
  createSecret: {{ .Values.packages.grafana.enterprise.createSecret | default true }}
  license: {{ .Values.packages.grafana.enterprise.license | quote }}
{{- end }}

bb-common:
  networkPolicies:
    prependReleaseName: true
    ingress:
      to:
        grafana:3000:
          from:
            k8s:
              kiali/kiali: {{ .Values.packages.kiali.enabled }}
    egress:
      from:
        "*":
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
              thanos/thanos:9090: {{ .Values.packages.thanos.enabled }}
        grafana:
          to:
            definition:
              redis-subnets: {{ $gitlabExternalRedisEnabled }}
            k8s:
              authservice/authservice:10003: {{ $authserviceRedisEnabled }}

  routes:
    inbound:
      grafana:
        enabled: {{ $istioEnabled }}
        gateways:
        - {{ include "getGatewayName" (dict "gateway" .Values.packages.grafana.ingress.gateway "root" .) }}
    outbound:
      {{- if $gitlabExternalRedisEnabled }}
      external-gitlab-redis:
        enabled: true
        hosts:
        - {{ $gitlabExternalRedisHost | quote }}
        ports:
        - number: {{ $gitlabRedisPort }}
          name: redis
          protocol: TCP
      {{- end }}
      grafana-bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.grafana.values }}
        hosts:
        - repo1.dso.mil

bbtests:
  cypress:
    envs:
      cypress_grafana_url: {{ printf "https://grafana.%s" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.grafana "values" .Values) | nindent 6 }}

upstream:
  {{- if eq (include "metricScrapingEnabled" .) "true" }}
  serviceMonitor:
    enabled: true
  {{- if eq (include "metricsSidecarMtls" (list .Values.packages.grafana .)) "true" }}
    scheme: https
    tlsConfig:
      caFile: /etc/prom-certs/root-cert.pem
      certFile: /etc/prom-certs/cert-chain.pem
      keyFile: /etc/prom-certs/key.pem
      insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
  {{- end }}
  {{- end }}

  {{- if $gitlabRedis }}
  envFromSecret: grafana-env-secret
  {{- end }}

  {{- if .Values.packages.tempo.enabled }}
  env:
    GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor tempoSearch tempoServiceGraph"
  {{- end }}

  image:
    pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsPullSecrets" . | nindent 4 }}
    {{- if $enterpriseEnabled }}
    repository: ironbank/grafana/grafana-enterprise
    {{- end }}

  sidecar:
    imagePullPolicy: {{ .Values.imagePullPolicy }}

  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
    {{- if $gitlabRedis }}
    checksum/gitlabRedisPassword: {{ sha256sum .Values.packages.gitlab.redis.password }}
    {{- end }}
  {{- end }}

  {{- if .Values.packages.kiali.enabled }}
  podLabels:
    service.istio.io/canonical-name: monitoring-grafana
  {{- end }}

  {{- if or .Values.packages.monitoring.enabled .Values.packages.loki.enabled .Values.packages.tempo.enabled $gitlabRedis $authserviceRedisEnabled .Values.packages.argocd.enabled }}
  datasources:
    datasourcesbb.yaml:
      apiVersion: 1
      datasources:
      {{- if .Values.packages.mimir.enabled }}
      - name: Mimir
        type: prometheus
        uid: mimir
        access: proxy
        url: http://mimir-mimir-gateway.mimir.svc.cluster.local/prometheus
        editable: true
        jsonData:
          # Should match mimir metamonitoring scrape_interval (default 60s)
          timeInterval: "60s"
      {{- end }}
      {{- if .Values.packages.monitoring.enabled }}
      {{- if .Values.packages.thanos.enabled }}
      - name: Thanos
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://thanos-query.thanos.svc:9090
        editable: true
      {{- else }}
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://monitoring-monitoring-kube-prometheus.monitoring.svc:9090
        editable: true
      {{- end }}
      {{- end }}
      {{- if and .Values.packages.argocd.enabled (not $argocdExternalRedisEnabled) }}
      - name: Argo Master
        type: redis-datasource
        access: proxy
        url: redis-bb-master.argocd.svc.cluster.local:6379
        jsonData:
          client: standalone
      - name: Argo Headless
        type: redis-datasource
        access: proxy
        url: redis-bb-headless.argocd.svc.cluster.local:6379
        jsonData:
          client: standalone
      - name: Argo Replicas
        type: redis-datasource
        access: proxy
        url: redis-bb-replicas.argocd.svc.cluster.local:6379
        jsonData:
          client: standalone
      {{- end }}
      {{- if $authserviceRedisEnabled }}
      - name: AuthService Master
        type: redis-datasource
        access: proxy
        url: authservice-authservice-redis-bb-master.authservice.svc.cluster.local:6379
        jsonData:
          client: standalone
      - name: AuthService Headless
        type: redis-datasource
        access: proxy
        url: authservice-authservice-redis-bb-headless.authservice.svc.cluster.local:6379
        jsonData:
          client: standalone
      - name: AuthService Replicas
        type: redis-datasource
        access: proxy
        url: authservice-authservice-redis-bb-replicas.authservice.svc.cluster.local:6379
        jsonData:
          client: standalone
      {{- end }}
      {{- if $gitlabRedis }}
      - name: GitLab
        type: redis-datasource
        access: proxy
        url: {{ printf "%s:%v" $gitlabRedisHost $gitlabRedisPort }}
        jsonData:
          client: standalone
        secureJsonData:
          password: $GITLAB_REDIS_PASSWORD
      {{- end }}
      {{- if .Values.packages.loki.enabled }}
      - name: Loki
        type: loki
        {{- if eq .Values.packages.loki.strategy "monolith" }}
        url: http://logging-loki.logging.svc.cluster.local:3100
        {{- else }}
        url: http://logging-loki-gateway.logging.svc.cluster.local
        {{- end }}
        access: proxy
        editable: true
      {{- end }}
      {{- if and .Values.packages.loki.enabled .Values.packages.tempo.enabled }}
        jsonData:
          derivedFields:
            - datasourceName: Tempo
              matcherRegex: "traceID=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
              datasourceUid: tempo
      {{- end }}
      {{- if .Values.packages.tempo.enabled }}
      - name: Tempo
        type: tempo
        access: proxy
        orgId: 1
        uid: tempo
        url: http://tempo-tempo.tempo.svc:3200
        isDefault: false
        editable: true
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: 'prometheus'
      {{- end }}
      {{- if and .Values.packages.loki.enabled .Values.packages.tempo.enabled }}
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: 'Loki'
            tags: ['job', 'instance', 'pod', 'namespace']
            mappedTags: [{ key: 'service.name', value: 'service' }]
            mapTagNamesEnabled: false
            spanStartTimeShift: '1h'
            spanEndTimeShift: '1h'
            filterByTraceID: false
            filterBySpanID: false
          serviceMap:
            datasourceUid: 'prometheus'
          search:
            hide: false
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: 'Loki'
      {{- end }}
  {{- end }}

  grafana.ini:
    {{- if $istioEnabled }}
    server:
      root_url: https://grafana.{{ $domainName }}/
    {{- end }}

    auth.generic_oauth:
      enabled: {{ or .Values.packages.grafana.sso.enabled (and (dig "grafana" "client_id" false .Values.packages.monitoring.sso) .Values.packages.monitoring.sso.enabled) }}
      {{- if .Values.sso.name }}
      name: {{ .Values.sso.name }}
      {{- end }}
      {{- if or (and .Values.packages.grafana.sso.enabled .Values.packages.grafana.sso.grafana.client_id) (and (dig "grafana" "client_id" false .Values.packages.monitoring.sso) .Values.packages.monitoring.sso.enabled) }}
      client_id: $__file{/etc/secrets/auth_generic_oauth/client_id}
      {{- end }}
      {{- if or (and .Values.packages.grafana.sso.enabled .Values.packages.grafana.sso.grafana.client_secret) (and (dig "grafana" "client_secret" false .Values.packages.monitoring.sso) .Values.packages.monitoring.sso.enabled) }}
      client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
      {{- end }}
      {{- if (and (dig "grafana" "client_id" false .Values.packages.monitoring.sso) .Values.packages.monitoring.sso.enabled) }}
      scopes: {{ ( dig "grafana" "scopes" false .Values.packages.monitoring.sso) | default "openid profile email" }}
      auth_url: {{ default (include "sso.oidc.auth" .) (dig "grafana" "auth_url" false .Values.packages.monitoring.sso) }}
      token_url: {{ default (include "sso.oidc.token" .) (dig "grafana" "token_url" false .Values.packages.monitoring.sso) }}
      api_url: {{ default (include "sso.oidc.userinfo" .) (dig "grafana" "api_url" false .Values.packages.monitoring.sso) }}
      allow_sign_up: {{ (dig "grafana" "allow_sign_up" false .Values.packages.monitoring.sso) | default "True" }}
      role_attribute_path: {{ (dig "grafana" "role_attribute_path" false .Values.packages.monitoring.sso) | default "Viewer" }}
      {{- else if .Values.packages.grafana.sso.enabled }}
      scopes: {{ .Values.packages.grafana.sso.grafana.scopes | default "openid profile email" }}
      auth_url: {{ default (include "sso.oidc.auth" .) .Values.packages.grafana.sso.grafana.auth_url }}
      token_url: {{ default (include "sso.oidc.token" .) .Values.packages.grafana.sso.grafana.token_url }}
      api_url: {{ default (include "sso.oidc.userinfo" .) .Values.packages.grafana.sso.grafana.api_url }}
      allow_sign_up: {{ .Values.packages.grafana.sso.grafana.allow_sign_up | default "True" }}
      role_attribute_path: {{ .Values.packages.grafana.sso.grafana.role_attribute_path | default "Viewer" }}
      {{- end }}
      {{- range $key := list "allowed_domains" "tls_client_ca" "tls_skip_verify_insecure" "tls_client_cert" "tls_client_key" }}
        {{- with (index $ $key) }}
      {{ $key }} = {{ . }}
        {{- end }}
      {{- end }}

    {{- if $enterpriseEnabled }}
    enterprise:
      license_path: /etc/grafana/license/license.jwt
    {{- end }}

  {{- if or (or .Values.packages.grafana.sso.grafana.client_id (dig "grafana" "client_id" false .Values.packages.monitoring.sso)) (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) $enterpriseEnabled }}
  extraSecretMounts:
    {{- if or (and .Values.packages.grafana.sso.enabled .Values.packages.grafana.sso.grafana.client_id) (and (dig "grafana" "client_id" false .Values.packages.monitoring.sso) .Values.packages.monitoring.sso.enabled) }}
    - name: auth-generic-oauth-secret
      mountPath: /etc/secrets/auth_generic_oauth
      secretName: grafana-sso
      defaultMode: 0440
      readOnly: true
    {{- end }}
    {{- /* Mount the SSO CA only when grafana/secret-ca.yaml actually creates tls-ca-sso-grafana.
           The secret requires grafana OIDC to be configured (grafana.sso.enabled, or
           monitoring.sso.enabled WITH monitoring.sso.grafana.client_id); mounting on
           monitoring.sso.enabled alone left grafana stuck on a missing secret. */}}
    {{- if and (or (and .Values.packages.grafana.enabled .Values.packages.grafana.sso.enabled) (and .Values.packages.monitoring.sso.enabled (dig "grafana" "client_id" false .Values.packages.monitoring.sso))) (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
    - name: "oidc-ca-certificate"
      mountPath: "/etc/oidc/ca.pem"
      secretName: "tls-ca-sso-grafana"
      readOnly: true
      subPath: "ca.pem"
    {{- end }}
    {{- if $enterpriseEnabled }}
    - name: enterprise-license
      mountPath: /etc/grafana/license
      secretName: grafana-enterprise-license
      readOnly: true
    {{- end }}
  {{- end }}
{{- end }}

{{- /* This function merges defaults in lists from above into overlays */ -}}
{{- /* The end user will not have to replicate `prometheus.prometheusSpec.additionalScrapeConfigs` or `grafana.extraSecretMounts` from above when providing an overlay */ -}}
{{- /* There is a hidden flag `skipOverlayMerge` that can be added to `prometheus.prometheusSpec` or `grafana` overlays to ignore the defaults */ -}}
{{- define "bigbang.overlays.grafana" }}
  {{- $defaults := fromYaml (include "bigbang.defaults.grafana" .) }}

  {{- $overlays := dig "values" dict .Values.packages.grafana }}
  {{- range $grafanaConfig, $default := $defaults }}
    {{- $overlay := (dig $grafanaConfig dict $overlays) }}
    # Only continue if an overlay matches a default constriant and hidden "skipOverlayMerge" is not set
    {{- if and $overlay (kindIs "map" $overlay) (not $overlay.skipOverlayMerge) }}

      # Add any default extraSecretMounts to overlay
      {{- if and (dig "extraSecretMounts" list $default) (dig "extraSecretMounts" list $overlay) }}
         {{ $_ := set $overlay "extraSecretMounts" (concat $default.extraSecretMounts $overlay.extraSecretMounts) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{ toYaml $overlays }}
{{- end }}
