{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsGrafana := mergeOverwrite (deepCopy .Values.flux) .Values.packages.grafana.flux -}}
{{- if .Values.packages.grafana.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/grafana/values.yaml") . | sha256sum }}
spec:
  targetNamespace: monitoring
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "grafana" "package" .Values.packages.grafana "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsGrafana | nindent 2 }}

  {{- if or .Values.packages.grafana.postRenderers (and .Values.packages.monitoring.enabled (ne (include "ambientEnabled" .) "true")) }}
  postRenderers:
  {{- if and .Values.packages.monitoring.enabled (ne (include "ambientEnabled" .) "true") }}
  {{ include "grafana.serviceMonitorPostRenderers" . | nindent 2 }}
  {{- end }}
  {{- with .Values.packages.grafana.postRenderers }}
  {{ toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}

  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "grafana" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.grafana.dependsOnOverride) }}
  {{- with .Values.packages.grafana.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.grafana.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.grafana) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
