{{- include "bigbang.normalizePackageAliases" . -}}
{{- $gitCredsSecretDict := dict
  "name" "gatewayAPI"
  "targetScope" .Values.packages.gatewayAPI
  "releaseName" .Release.Name
  "releaseNamespace" .Release.Namespace
  "enabled" (or .Values.packages.gatewayAPI.enabled (eq (include "ambientEnabled" .) "true"))
}}
{{- include "gitCredsSecret" $gitCredsSecretDict | nindent 0 -}}
