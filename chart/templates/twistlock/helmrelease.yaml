{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsTwistlock := mergeOverwrite (deepCopy .Values.flux) .Values.packages.twistlock.flux -}}
{{- if .Values.packages.twistlock.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: twistlock
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: twistlock
    app.kubernetes.io/component: "security"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/twistlock/values.yaml") . | sha256sum }}
spec:
  targetNamespace: twistlock
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "twistlock" "package" .Values.packages.twistlock "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsTwistlock | nindent 2 }}
  
  {{- if .Values.packages.twistlock.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.twistlock.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "twistlock" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.twistlock.dependsOnOverride) }}
  {{- with .Values.packages.twistlock.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or .Values.packages.gatekeeper.enabled $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.twistlock.dependsOn }}
  dependsOn:
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.twistlock) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
