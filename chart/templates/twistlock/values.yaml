{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.twistlock.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.twistlock
  "name" "twistlock"
  "bbCommonSubchart" true
  "supportsRouteDefaults" true
  "defaults" (include "bigbang.defaults.twistlock" .)
) }}
{{- end }}

{{- define "bigbang.defaults.twistlock" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $defenderOnly := dig "deploymentMode" "defenderOnly" false .Values.packages.twistlock.values }}
{{- $console := dig "console" dict .Values.packages.twistlock.values }}

# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
global:
  domain: {{ $domainName }}

openshift: {{ .Values.openshift }}

monitoring:
  enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
  serviceMonitor:
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    {{- if eq (include "metricsSidecarMtls" (list .Values.packages.twistlock .)) "true" }}
    scheme: https
    tlsConfig:
      caFile: /etc/prom-certs/root-cert.pem
      certFile: /etc/prom-certs/cert-chain.pem
      keyFile: /etc/prom-certs/key.pem
      insecureSkipVerify: true
    {{- end }}

{{- if ( include "imagePullSecret" . ) }}
imagePullSecretName: private-registry
{{- else }}
imagePullSecretName: ""
{{- end }}

bb-common:
  networkPolicies:
    {{- if $defenderOnly }}
    enabled: false
    {{- end }}
    ingress:
      to:
        twistlock-console:8081:
          from:
            k8s:
              alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
              monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}

    egress:
      from:
        twistlock-console:
          to:
            definition:
              sso: {{ .Values.packages.twistlock.sso.enabled }}
        "*":
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}

  routes:
    inbound:
      console:
        enabled: {{ not $defenderOnly }}
        gateways:
          - {{ include "getGatewayName" (dict "gateway" .Values.packages.twistlock.ingress.gateway "root" .)}}
        {{- if dig "backendTLS" false $console }}
        port: {{ dig "ports" "managementHttps" 8083 $console }}
        {{- end }}
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.twistlock.values }}
        hosts:
        - repo1.dso.mil

bbtests:
  scripts:
    envs:
      twistlock_host: {{ printf "https://twistlock.%s" $domainName | quote }}
  cypress:
    envs:
      cypress_twistlock_url: {{ printf "https://twistlock.%s" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.twistlock "values" .Values) | nindent 6 }}

{{- if $istioEnabled }}
annotations:
  {{ include "istioAnnotation" . }}
{{- end }}

console:
  image:
    imagePullPolicy: {{ .Values.imagePullPolicy }}

sso:
  enabled: {{ .Values.packages.twistlock.sso.enabled }}
  client_id: {{ .Values.packages.twistlock.sso.client_id }}
  provider_name: {{ default .Values.sso.name .Values.packages.twistlock.sso.provider_name }}
  provider_type: {{ .Values.packages.twistlock.sso.provider_type }}
  issuer_uri: {{ default (include "sso.url" .) (tpl (default "" .Values.packages.twistlock.sso.issuer_uri) .) }}
  idp_url: {{ default (include "sso.saml.service" .) (tpl (default "" .Values.packages.twistlock.sso.idp_url) .) }}
  {{- $console := first (dig "istio" "console" "hosts" (list (printf "twistlock.%s" $domainName)) .Values.packages.twistlock.values) }}
  console_url: {{ tpl (default (printf "https://%s" $console) .Values.packages.twistlock.sso.console_url) . }}
  groups: {{ .Values.packages.twistlock.sso.groups }}
  cert: {{ default (include "sso.saml.cert.withheaders" .) .Values.packages.twistlock.sso.cert | quote }}
{{- end -}}
