{{- /*
  Create the DoD client CA Secret required when Keycloak uses the built-in
  public gateway with TLS terminated at the gateway.
*/ -}}
{{- $keycloak := .Values.addons.keycloak -}}
{{- $keycloakGateway := include "bigbang.keycloak.gateway" . -}}
{{- $tlsTerminated := and (empty $keycloak.ingress.cert) (empty $keycloak.ingress.key) -}}
{{- if and .Values.istiod.enabled .Values.istioGateway.enabled $keycloak.enabled $tlsTerminated (eq $keycloakGateway "public") -}}
{{- $enabledGateways := include "enabledGateways" . | fromYaml -}}
{{- if hasKey $enabledGateways "public" -}}
{{- $caBundle := .Files.Get "ca-certs/dod-bundle.pem" -}}
{{- if not $caBundle -}}
  {{- fail "istio-gateway: Keycloak uses OPTIONAL_MUTUAL TLS on the public gateway but ca-certs/dod-bundle.pem is missing" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: public-cert-cacert
  namespace: istio-gateway
  labels:
    app.kubernetes.io/name: istio-gateway-public
    app.kubernetes.io/component: core
    {{- include "commonLabels" . | nindent 4 }}
type: Opaque
data:
  cacert: {{ $caBundle | b64enc }}
{{- end }}
{{- end }}
