{{- /*
  Create a <credentialName>-cacert Opaque secret for every gateway server block in a MUTUAL / OPTIONAL_MUTUAL mode, so client-cert (CAC) validation has its CA.
*/ -}}
{{- if and .Values.istiod.enabled .Values.istioGateway.enabled }}
{{- $enabledGateways := include "enabledGateways" . | fromYaml -}}
{{- $mutualCredentials := dict -}}
{{- range $gatewayName, $gateway := $enabledGateways -}}
  {{- $effectiveGateway := mergeOverwrite (deepCopy (dig "defaults" dict $gateway)) (deepCopy (dig "overlays" dict $gateway)) -}}
  {{- range $server := (dig "gateway" "servers" list $effectiveGateway) -}}
    {{- $tlsMode := dig "tls" "mode" "" $server -}}
    {{- if or (eq $tlsMode "MUTUAL") (eq $tlsMode "OPTIONAL_MUTUAL") -}}
      {{- with dig "tls" "credentialName" "" $server -}}
        {{- $_ := set $mutualCredentials . $gatewayName -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $mutualCredentials }}
{{- $caBundle := $.Files.Get "ca-certs/dod-bundle.pem" -}}
{{- if not $caBundle -}}
  {{- fail "istio-gateway: a MUTUAL/OPTIONAL_MUTUAL server block is defined but ca-certs/dod-bundle.pem is missing" -}}
{{- end -}}
{{- range $credentialName, $gatewayName := $mutualCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credentialName }}-cacert
  namespace: istio-gateway
  labels:
    app.kubernetes.io/name: istio-gateway-{{ $gatewayName }}
    app.kubernetes.io/component: core
    {{- include "commonLabels" $ | nindent 4 }}
type: Opaque
data:
  cacert: {{ $caBundle | b64enc }}
{{- end }}
{{- end }}
{{- end }}