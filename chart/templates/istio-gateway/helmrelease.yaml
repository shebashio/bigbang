{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsIstioGateway := mergeOverwrite (deepCopy .Values.flux) .Values.packages.istioGateway.flux -}}
{{- if and .Values.packages.istiod.enabled .Values.packages.istioGateway.enabled }}
{{- range $name, $gw := include "enabledGateways" $ | fromYaml }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $gw.serviceName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: istio-gateway-{{ $name }}
    app.kubernetes.io/component: core
    {{- include "commonLabels" $ | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/istio-gateway/values.yaml") $ | sha256sum }}
spec:
  releaseName: {{ $gw.serviceName }}
  targetNamespace: istio-gateway
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "istio-gateway" "package" $.Values.packages.istioGateway "root" $) | nindent 2 }}

  {{- toYaml $fluxSettingsIstioGateway | nindent 2 }}

  {{- if $.Values.packages.istioGateway.postRenderers }}
  {{- if kindIs "slice" $.Values.packages.istioGateway.postRenderers }}
  postRenderers:
  {{ toYaml $.Values.packages.istioGateway.postRenderers | nindent 4 }}
  {{- end }}
  {{- if kindIs "map" $.Values.packages.istioGateway.postRenderers }}
  {{- $postRenderers := get $.Values.packages.istioGateway.postRenderers $name }}
  {{- if $postRenderers }}
  postRenderers:
  {{ $postRenderers | toYaml | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- end }}
  
  valuesFrom:
    - name: {{ $.Release.Name }}-istio-{{ $name }}-gateway-values
      kind: Secret
      valuesKey: "common"
    - name: {{ $.Release.Name }}-istio-{{ $name }}-gateway-values
      kind: Secret
      valuesKey: "defaults"
    - name: {{ $.Release.Name }}-istio-{{ $name }}-gateway-values
      kind: Secret
      valuesKey: "overlays"

  {{- if not (kindIs "invalid" $.Values.packages.istioGateway.dependsOnOverride) }}
  {{- with $.Values.packages.istioGateway.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  dependsOn:
    {{- include "istioHelmReleases" $ | nindent 4 }}
    {{- if $.Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ $.Release.Namespace }}
    {{- end }}
    {{- if $.Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ $.Release.Namespace }}
    {{- end }}
    {{- with (include "bigbang.helmRelease.dependsOn" $.Values.packages.istioGateway) }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
status: {}
{{- end }}
{{- end }}
