{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsIstioCore := mergeOverwrite (deepCopy .Values.flux) .Values.packages.istiod.flux -}}
{{- if .Values.packages.istiod.enabled }}
{{- if not .Values.packages.istioCRDs.enabled }}
{{- fail "istiod requires istioCRDs to be enabled" }}
{{- end }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: istiod
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/istiod/values.yaml") . | sha256sum }}
spec:
  releaseName: istiod
  targetNamespace: istio-system
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "istiod" "package" .Values.packages.istiod "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsIstioCore | nindent 2 }}

  {{- if .Values.packages.istiod.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.istiod.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "istiod" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.istiod.dependsOnOverride) }}
  {{- with .Values.packages.istiod.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  dependsOn:
    - name: istio-crds
      namespace: {{ .Release.Namespace }}
  {{- if or .Values.packages.gatekeeper.enabled .Values.packages.kyvernoPolicies.enabled }}
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.istiod) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
