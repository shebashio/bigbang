{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsMetrics := mergeOverwrite (deepCopy .Values.flux) .Values.packages.metricsServer.flux -}}
{{- $enableFlag := .Values.packages.metricsServer.enabled | toString }}
{{- $existingMetricsApi := (.Capabilities.APIVersions.Has "metrics.k8s.io/v1beta1") }}
{{- $existingMetricsHelmRelease := (lookup "helm.toolkit.fluxcd.io/v2" "HelmRelease" "bigbang" "metrics-server") }}
{{- $metricsServerNamespace := dig "namespace" "name" "kube-system" .Values.packages.metricsServer }}
{{- if or ( eq $enableFlag "true") (and (eq $enableFlag "auto") (or (not $existingMetricsApi) $existingMetricsHelmRelease)) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metrics-server
    app.kubernetes.io/component: "cluster-utilities"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/metrics-server/values.yaml") . | sha256sum }}
spec:
  releaseName: metrics-server
  targetNamespace: {{ $metricsServerNamespace }}
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "metrics-server" "package" .Values.packages.metricsServer "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsMetrics | nindent 2 }}

  {{- if or .Values.packages.metricsServer.postRenderers .Values.packages.metricsServer.automountServiceAccountToken }}
  postRenderers:
  {{- if .Values.packages.metricsServer.automountServiceAccountToken }}
  {{ include "metricsServer.automountServiceAccountTokenPostRenderers" . | nindent 2 }}
  {{- end }}
  {{ with .Values.packages.metricsServer.postRenderers }}
  {{ toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}

  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "metrics" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.metricsServer.dependsOnOverride) }}
  {{- with .Values.packages.metricsServer.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if .Values.packages.metricsServer.dependsOn }}
  dependsOn:
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.metricsServer) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
