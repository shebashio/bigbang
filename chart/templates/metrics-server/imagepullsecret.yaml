{{- include "bigbang.normalizePackageAliases" . -}}
{{- $enableFlag := .Values.packages.metricsServer.enabled | toString }}
{{- $existingMetricsApi := (.Capabilities.APIVersions.Has "metrics.k8s.io/v1beta1") }}
{{- $existingMetricsHelmRelease := (lookup "helm.toolkit.fluxcd.io/v2" "HelmRelease" "bigbang" "metrics-server") }}
{{- $metricsServerNamespace := dig "namespace" "name" "kube-system" .Values.packages.metricsServer }}
{{- if and (not .Values.packages.istioCNI.enabled) (eq (include "ambientEnabled" .) "false") (or ( eq $enableFlag "true") (and (eq $enableFlag "auto") (or (not $existingMetricsApi) $existingMetricsHelmRelease))) }}
{{- include "bigbang.imagePullSecret" (dict "root" . "namespace" $metricsServerNamespace "appName" "metrics-server" "component" "cluster-utilities") }}
{{- end }}
