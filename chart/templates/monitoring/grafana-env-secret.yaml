{{- include "bigbang.normalizePackageAliases" . -}}
{{- $gitlabRedis := and (ne .Values.packages.gitlab.redis.password "") (or .Values.packages.gitlab.enabled .Values.packages.gitlabRunner.enabled) -}}
{{- $legacyMonitoringGrafana := dig "upstream" "grafana" "enabled" false .Values.packages.monitoring.values -}}
{{- if and .Values.packages.monitoring.enabled (not .Values.packages.grafana.enabled) $legacyMonitoringGrafana $gitlabRedis }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-env-secret
  namespace: monitoring
  labels:
    grafana_datasource: "1"
type: Opaque
stringData:
  GITLAB_REDIS_PASSWORD: {{ .Values.packages.gitlab.redis.password }}
{{- end }}
