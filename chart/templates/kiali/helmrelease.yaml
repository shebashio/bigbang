{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsKiali := mergeOverwrite (deepCopy .Values.flux) .Values.kiali.flux -}}
{{- if .Values.kiali.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kiali
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/kiali/values.yaml") . | sha256sum }}
spec:
  targetNamespace: kiali
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "kiali" "package" .Values.kiali "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsKiali | nindent 2 }}

  {{- if .Values.kiali.postRenderers }}
  postRenderers:
  {{ toYaml .Values.kiali.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "kiali" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.kiali.dependsOnOverride) }}
  {{- with .Values.kiali.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or $istioEnabled .Values.monitoring.enabled .Values.kiali.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.kiali) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
