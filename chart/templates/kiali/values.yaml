{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.kiali.enabled }}
{{- include "values-secret" (dict 
  "root" $ 
  "package" .Values.packages.kiali
  "name" "kiali"
  "bbCommonSubchart" true
  "supportsRouteDefaults" true
  "defaults" (include "bigbang.defaults.kiali" .)
)}}
{{- end }}

{{- define "bigbang.defaults.kiali" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $grafanaUrl := first (dig "routes" "inbound" "grafana" "hosts" list .Values.packages.grafana.values) }}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
global:
  domain: {{ $domainName }}

sso:
  enabled: {{ .Values.packages.kiali.sso.enabled }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

tracing:
  enabled: {{ .Values.packages.tempo.enabled }}

openshift: {{ .Values.openshift}}

bb-common:
  routes:
    inbound:
      kiali:
        gateways:
          - {{ include "getGatewayName" (dict "gateway" .Values.packages.kiali.ingress.gateway "root" .)}}
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.kiali.values }}
        hosts:
        - repo1.dso.mil
      grafana:
        enabled: {{ .Values.packages.grafana.enabled }}
        hosts:
        - {{ $grafanaUrl | default (printf "%s.%s" "grafana" $domainName) }}
      sso:
        enabled: {{ .Values.packages.kiali.sso.enabled }}
        hosts:
        - {{ include "sso.host" . }}
  
  networkPolicies:
    egress:
      from:
        kiali:
          to:
            k8s:
              {{- if eq (include "monitoring.authservice.waypointEnabled" .) "true" }}
              monitoring/waypoint:15008:
                podSelector:
                  matchLabels:
                    gateway.networking.k8s.io/gateway-name: monitoring-monitoring-waypoint
              {{- else }}
              monitoring/prometheus:9090: {{ .Values.packages.monitoring.enabled }}
              {{- end }}
              monitoring/grafana:3000: {{ .Values.packages.grafana.enabled }}
              tempo/tempo:3200: {{ .Values.packages.tempo.enabled }}
              istio-system/istiod:15014: {{ .Values.packages.istiod.enabled }}
            definition:
              sso: {{ .Values.packages.kiali.sso.enabled }}

waitJob:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://kiali.%s" $domainName | quote }}
      cypress_check_data: {{ .Values.packages.grafana.enabled | quote }}
      cypress_ambient_enabled: {{ include "ambientEnabled" . | quote }}
      cypress_pod_monitor_name: "monitoring-monitoring-istio-envoy"
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.kiali "values" .Values) | nindent 6 }}

{{- if and .Values.packages.kiali.enabled .Values.packages.kiali.sso.enabled (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso))  }}
oidcCaCert: {{ default (dig "certificateAuthority" "cert" "" .Values.sso) .Values.sso.certificate_authority | quote }}
{{- end }}

upstream:
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . | nindent 4 }}
  {{- end }}
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsPullSecrets" . | nindent 4 }}

  cr:
    spec:
      {{- if $istioEnabled }}
      istio_namespace: istio-system
      {{- end}}
      deployment:
        image_pull_policy: {{ .Values.imagePullPolicy }}
        {{- if ( include "imagePullSecret" . ) }}
        image_pull_secrets:
        - private-registry
        {{- else }}
        image_pull_secrets: []
        {{- end }}
        {{- if eq (include "istioEnabled" .) "true" }}
        pod_annotations:
          {{ include "istioAnnotation" . }}
        {{- end }}
        pod_labels:
          service.istio.io/canonical-name: kiali
        hpa:
          spec:
            maxReplicas: 2
            minReplicas: 1
            targetCPUUtilizationPercentage: 80
      server:
        web_port: "443"
      auth:
        {{- if .Values.packages.kiali.sso.enabled }}
        strategy: openid
        openid:
          client_id: "{{ .Values.packages.kiali.sso.client_id }}"
          disable_rbac: true
          issuer_uri: "{{ include "sso.url" . }}"
          scopes:
          - openid
          - email
          username_claim: {{ dig "oidc" "claims" "email" "email" .Values.sso }}
        {{- else }}
        strategy: token
        {{- end }}
      external_services:
        grafana:
          enabled: {{ .Values.packages.grafana.enabled }}
          external_url: https://{{ tpl ($grafanaUrl | default (printf "%s.%s" "grafana" $domainName)) . }}
          {{- if .Values.packages.grafana.enabled }}
          auth:
            {{- if (dig "admin" "existingSecret" "" .Values.packages.grafana.values) }}
            {{- $userKey := (dig "admin" "userKey" "admin-user" .Values.packages.grafana.values) }}
            {{- with lookup "v1" "Secret" "monitoring" .Values.packages.grafana.values.admin.existingSecret }}
            username: {{ (get .data $userKey | b64dec) | default "admin" }}
            {{- end }}
            {{- else }}
            username: {{ dig "adminUser" "admin" .Values.packages.grafana.values }}
            {{- end }}
            password: "secret:grafana-auth:password"
          {{- end }}
        {{- if or .Values.packages.istiod.enabled .Values.packages.tempo.enabled }}
        tracing:
          enabled: true
          {{- if .Values.packages.tempo.enabled }}
          external_url: https://{{ tpl ($grafanaUrl | default (printf "%s.%s" "grafana" $domainName)) . }}
          internal_url: http://tempo-tempo.tempo.svc.cluster.local:3200
          provider: tempo
          tempo_config:
            datasource_uid: tempo
          {{- end}}
        {{- end }}
        istio:
          component_status:
            components:
              {{- if .Values.packages.istioGateway.enabled }}
              {{- range $name, $gw := include "enabledGateways" $ | fromYaml }}
              {{- if eq $gw.type "ingressgateway" }}
              - app_label: {{ $gw.serviceName }}
                is_core: true
                is_proxy: true
                namespace: istio-gateway
              {{- end -}}
              {{- end -}}
              {{- end -}}
          {{- if .Values.packages.istiod.enabled }}
          egress_gateway_namespace: istio-gateway
          {{- end }}
{{- end -}}
