{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettings := mergeOverwrite (deepCopy .Values.flux) .Values.packages.headlamp.flux -}}
{{- if .Values.packages.headlamp.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/headlamp/values.yaml") . | sha256sum }}
spec:
  targetNamespace: headlamp
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "headlamp" "package" .Values.packages.headlamp "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettings | nindent 2 }}

  {{- if .Values.packages.headlamp.postRenderers }}
  postRenderers:
  {{- toYaml .Values.packages.headlamp.postRenderers | nindent 2 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "headlamp" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.headlamp.dependsOnOverride) }}
  {{- with .Values.packages.headlamp.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or (eq (include "istioEnabled" . ) "true") .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.headlamp.dependsOn }}
  dependsOn:
  {{- if (eq (include "istioEnabled" .) "true") }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.headlamp) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
