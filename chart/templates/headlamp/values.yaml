{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.headlamp.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.packages.headlamp
  "name" "headlamp"
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.headlamp" .)
)}}
{{- end }}

{{- define "bigbang.defaults.headlamp" -}}
{{- $domainName := default .Values.domain .Values.hostname }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $baseURL := dig "upstream" "config" "baseURL" "" .Values.packages.headlamp.values }}
{{- $port := dig "upstream" "service" "port" 4466 .Values.packages.headlamp.values }}
{{- $serviceName := "headlamp-headlamp" }}
global:
  domain: {{ $domainName }}

bb-common:
  networkPolicies:
    egress:
      from:
        headlamp:
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
            definition:
              kubeAPI: true
              sso: {{ .Values.packages.headlamp.sso.enabled }}
    ingress:
      to:
        headlamp:4466:
          from:
            k8s:
              monitoring-monitoring-prometheus-blackbox-exporter@monitoring/prometheus-blackbox-exporter: {{ eq (include "metricScrapingEnabled" .) "true" }}

  routes:
    inbound:
      headlamp:
        enabled: {{ $istioEnabled }}
        gateways:
          - {{ include "getGatewayName" (dict "gateway" .Values.packages.headlamp.ingress.gateway "root" .) }}
        hosts:
          - headlamp.{{ $domainName }}
        {{- if empty $baseURL }}
        service: {{ $serviceName }}
        port: {{ $port }}
        {{- else }}
        http:
        - match:
          - uri:
              exact: {{ $baseURL }}
          rewrite:
            uri: {{ $baseURL }}/
          route:
          - destination:
              host: {{ $serviceName }}
              port:
                number: {{ $port }}
        - match:
          - uri:
              prefix: {{ $baseURL }}
          route:
          - destination:
              host: {{ $serviceName }}
              port:
                number: {{ $port }}
        {{- end }}
    outbound:
      headlamp-bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.headlamp.values }}
        hosts:
          - repo1.dso.mil
      {{- if .Values.packages.headlamp.sso.enabled }}
      sso:
        enabled: true
        hosts:
          - {{ include "sso.url" . | trimPrefix "https://" | regexFind "^[^/]+" }}
      {{- end }}

bbtests:
  cypress:
    envs:
      cypress_url: {{ printf "https://headlamp.%s" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.headlamp "values" .Values) | nindent 6 }}

openshift: {{ .Values.openshift }}

upstream:
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}

  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
  {{- end }}

  config:
    {{- if .Values.packages.headlamp.sso.enabled }}
    oidc:
      clientID: {{ .Values.packages.headlamp.sso.client_id }}
      issuerURL: {{ .Values.sso.url }}
      scopes: "email,profile"
      usePKCE: true
    {{- else }}
    oidc:
      secret:
       create: false
    {{- end }}
{{- end -}}
