{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsEk := mergeOverwrite (deepCopy .Values.flux) .Values.packages.elasticsearchKibana.flux -}}
{{- if .Values.packages.elasticsearchKibana.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ek
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: elasticsearch-kibana
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/elasticsearch-kibana/values.yaml") . | sha256sum }}
spec:
  targetNamespace: logging
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "elasticsearch-kibana" "package" .Values.packages.elasticsearchKibana "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsEk | nindent 2 }}

  {{- if .Values.packages.elasticsearchKibana.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.elasticsearchKibana.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "ek" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.elasticsearchKibana.dependsOnOverride) }}
  {{- with .Values.packages.elasticsearchKibana.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  {{/* ECK and Logging _always_ depend on .Values.packages.elasticsearchKibana being enabled, so can assume they exist here */}}
  dependsOn:
    - name: eck-operator
      namespace: {{ .Release.Namespace }}
    {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.gatekeeper.enabled }}
    - name: gatekeeper
      namespace: {{ .Release.Namespace }}
    {{- end }}
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.elasticsearchKibana) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
