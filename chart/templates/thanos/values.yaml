{{- include "bigbang.normalizePackageAliases" . -}}
{{- $pkg := "thanos" }}

{{- /* Create secret */ -}}
{{- if (get .Values.packages $pkg).enabled }}
  {{- $package := deepCopy (get .Values.packages $pkg) -}}
  {{- if $package.values -}}
    {{- $cleanedValues := include "mergeLegacyIstioHardenedKeys" (dict "values" $package.values) | fromYaml -}}
    {{- $package = set $package "values" $cleanedValues -}}
  {{- end -}}
  {{- include "values-secret" (dict
    "root" $
    "package" $package
    "name" "thanos"
    "defaults" (include "bigbang.defaults.thanos" . | fromYaml | toYaml)
    "bbCommonSubchart" true
  )}}
{{- end }}

{{- /* Default values for Thanos */ -}}
{{- define "bigbang.defaults.thanos" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $authserviceEnabled := eq (include "authserviceEnabled" .) "true" }}
{{- $thanosUsesAuthservice := or .Values.packages.authservice.enabled (and .Values.packages.thanos.sso.enabled $authserviceEnabled) }}
{{- $thanosAuthserviceWaypoint := eq (include "thanos.authservice.waypointEnabled" .) "true" }}
{{- $istioHardened := or
  (dig "istio" "hardened" "enabled" false .Values.packages.thanos.values)
  (dig "hardened" "enabled" false .Values.packages.istiod.values)
}}

{{- $s3Bucket := .Values.packages.thanos.objectStorage.bucket }}
{{- $s3Region := .Values.packages.thanos.objectStorage.region }}
{{- $s3Endpoint := .Values.packages.thanos.objectStorage.endpoint }}
{{- if and (empty $s3Endpoint) (not (empty $s3Bucket)) (not (empty $s3Region)) }}
  {{- $s3Endpoint = printf "%s.s3.%s.amazonaws.com" $s3Bucket $s3Region }}
{{- end }}

{{- $shouldEnableMinio := or (and (eq .Values.packages.thanos.strategy "scalable") (not (and .Values.packages.thanos.objectStorage.endpoint .Values.packages.thanos.objectStorage.region))) (dig "minio" "enabled" false .Values.packages.thanos.values) -}}
{{- $storeGatewayEnabled := dig "upstream" "storegateway" "enabled" false .Values.packages.thanos.values }}
{{- $storeGatewayEnabled = or $storeGatewayEnabled (not (empty .Values.packages.thanos.objectStorage.endpoint)) }}
{{- $routeGateway := include "getGatewayName" (dict "gateway" (.Values.packages.thanos.ingress.gateway | default "public") "root" .) }}
{{- $thanosHosts := dig "bb-common" "istio" "thanos" "hosts" list .Values.packages.thanos.values }}

image:
  {{- include "secretsPullSecretsWithName" . | nindent 2 }}
  pullPolicy: {{ .Values.imagePullPolicy }}
  
upgradeJob:
  image:
    {{- include "secretsPullSecretsSingle" . | nindent 4 }}

{{- $thanosExternalHost := printf "thanos.%s" .Values.domain -}}
{{- if $thanosHosts -}}
{{- $thanosExternalHost = tpl (first $thanosHosts) . -}}
{{- end }}
externalURL: https://{{ $thanosExternalHost }}

global:
  domain: {{ .Values.domain }}

routes:
  outbound:
    s3:
      enabled: {{ and $istioHardened (not (empty $s3Endpoint)) }}
      hosts:
      - {{ $s3Endpoint }}
  inbound:
    query-frontend:
      enabled: {{ $istioEnabled }}
      gateways:
      - {{ $routeGateway }}
      hosts:
      {{- if $thanosHosts }}
      {{- range $thanosHosts }}
      - {{ tpl . $ | quote }}
      {{- end }}
      {{- else }}
      - thanos.{{ .Values.domain }}
      {{- end }}
      {{- if $thanosAuthserviceWaypoint }}
      authservice:
        enabled: true
        ingressOnly: true
        issuer: {{ include "sso.url" . | quote }}
        clientId: {{ .Values.packages.thanos.sso.client_id | quote }}
      {{- end }}
    minio:
      enabled: {{ and $istioEnabled $shouldEnableMinio }}
      gateways:
      - {{ $routeGateway }}
      hosts:
      - thanos-minio.{{ .Values.domain }}

{{- if $thanosAuthserviceWaypoint }}
istio:
  prependReleaseName: true
{{- end }}

minio:
  enabled: {{ $shouldEnableMinio }}
  {{- if $shouldEnableMinio }}
  upstream:
    tenant:
      {{- include "secretsImagePullSecretWithName" . | nindent 6 }}
      metrics:
        enabled: {{ .Values.packages.monitoring.enabled }}
  {{- end }}

networkPolicies:
  egress:
    {{- if empty (dig "egress" "definitions" "kubeAPI" nil .Values.networkPolicies) }}
    definitions:
      kubeAPI:
        to:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.controlPlaneCidr }}
            {{- if eq .Values.networkPolicies.controlPlaneCidr "0.0.0.0/0" }}
            except:
            - 169.254.169.254/32
            {{- end }}
        {{- if not (eq .Values.networkPolicies.controlPlaneCidr .Values.networkPolicies.vpcCidr) }}
        {{- if not (eq .Values.networkPolicies.vpcCidr "0.0.0.0/0") }}
        - ipBlock:
            cidr: {{ .Values.networkPolicies.vpcCidr }}
        {{- end }}
        {{- end }}
    {{- end }}
    from:
      '*':
        to:
          definition:
            kubeAPI: true
      thanos-query:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query
        to:
          k8s:
            monitoring/prometheus:10901: {{ .Values.packages.monitoring.enabled }}
      thanos-query-frontend:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query-frontend
        to:
          k8s:
            authservice/authservice:10003: {{ $thanosUsesAuthservice }}
      thanos-storegateway:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: storegateway
        to:
          definition:
            storage-subnets: {{ $storeGatewayEnabled }}
  ingress:
    to:
      minio:9000:
        from:
          k8s:
            minio-operator@minio-operator/minio-operator: {{ $shouldEnableMinio }}
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.packages.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      thanos-query-frontend:9090:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query-frontend
        from:
          definition:
            gateway: {{ .Values.packages.istioGateway.enabled }}
          k8s:
            authservice/authservice: {{ and .Values.packages.thanos.sso.enabled (not .Values.packages.authservice.enabled) }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      thanos-query:10902:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query
        from:
          k8s:
            monitoring-grafana@monitoring/grafana: {{ .Values.packages.grafana.enabled }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      thanos-storegateway:10902:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: storegateway
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      thanos-compactor:10902:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: compactor
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      thanos-bucketweb:8080:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: bucketweb
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      thanos-ruler:10902:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: ruler
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
      thanos-receive:10902:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: receive
        from:
          k8s:
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

upstream:
  {{- if .Values.packages.monitoring.enabled }}
  metrics:
    enabled: true
    image:
      {{- include "secretsPullSecrets" . | nindent 4 }}
    serviceMonitor:
      enabled: true
  {{- end }}

  query:
    dnsDiscovery:
      # to allow lookups to work with and without Istio enabled, we disable k8s dns service
      # discovery and manually set stores: below.
      #
      # With Istio, the combination of headless service + TCP port will create an entry
      # for each pod IP:PORT and that makes communication via IP:PORT viable
      enabled: false
    {{- if or .Values.packages.monitoring.enabled $storeGatewayEnabled }}
    stores:
    {{- end }}
      {{- if .Values.packages.monitoring.enabled }}
      - dns+monitoring-monitoring-kube-thanos-discovery.monitoring.svc.cluster.local:10901
      {{- end }}
      {{- if $storeGatewayEnabled }}
      - dns+thanos-storegateway.thanos.svc.cluster.local:10901
      {{- end }}
    networkPolicy:
      enabled: false

  queryFrontend:
    {{- if or .Values.packages.thanos.sso.enabled .Values.packages.kiali.enabled }}
    podLabels:
      {{- if .Values.packages.thanos.sso.enabled }}
      {{- $thanosAuthserviceKey := (dig "selector" "key" "protect" .Values.packages.authservice.values) }}
      {{- $thanosAuthserviceValue := (dig "selector" "value" "keycloak" .Values.packages.authservice.values) }}
      {{ $thanosAuthserviceKey }}: {{ $thanosAuthserviceValue }}
      {{- end }}
    {{- end }}
    {{- if $thanosAuthserviceWaypoint }}
    service:
      labels:
        istio.io/use-waypoint: thanos-waypoint
        istio.io/ingress-use-waypoint: "true"
    {{- end }}

    networkPolicy:
      enabled: false

  bucketweb:
    networkPolicy:
      enabled: false

  ruler:
    networkPolicy:
      enabled: false

  receive:
    networkPolicy:
      enabled: false

  {{- if or (dig "values" "upstream" "compactor" "enabled" false .Values.packages.thanos) .Values.packages.thanos.objectStorage.endpoint }}
  compactor:
    enabled: true
    networkPolicy:
      enabled: false
  {{- end }}

  {{- if .Values.packages.thanos.objectStorage.endpoint }}
  objstoreConfig: |-
    type: s3
    config:
      bucket: {{ .Values.packages.thanos.objectStorage.bucket }}
      endpoint: {{ .Values.packages.thanos.objectStorage.endpoint }}
      access_key: {{ .Values.packages.thanos.objectStorage.accessKey }}
      secret_key: {{ .Values.packages.thanos.objectStorage.accessSecret }}
      insecure: {{ .Values.packages.thanos.objectStorage.insecure }}
  {{- end }}

  storegateway:
    enabled: {{ $storeGatewayEnabled }}
    useEndpointGroup: true
    networkPolicy:
      enabled: false
bbtests:
  cypress:
    envs:
      cypress_thanos_url: https://thanos.{{ .Values.domain }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.thanos "values" .Values) | nindent 6 }}

{{- end }}
