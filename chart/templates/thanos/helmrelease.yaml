{{- include "bigbang.normalizePackageAliases" . -}}
{{- $pkg := "thanos" }}
{{- $fluxSettingsThanos := mergeOverwrite (deepCopy .Values.flux) .Values.packages.thanos.flux -}}
{{- if (get .Values.packages $pkg).enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $havePostRenderers := (get .Values.packages $pkg).postRenderers }}
{{- $installServiceMonitorPostRenderers := and .Values.packages.monitoring.enabled $istioEnabled (ne (include "ambientEnabled" .) "true") (eq (dig "istio" "mtls" "mode" "STRICT" .Values.packages.thanos.values) "STRICT") }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $pkg }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $pkg }}
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/thanos/values.yaml") . | sha256sum }}
spec:
  releaseName: {{ $pkg }}
  targetNamespace: {{ $pkg }}
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "thanos" "package" (get .Values.packages $pkg) "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsThanos | nindent 2 }}

  {{- if or $havePostRenderers $installServiceMonitorPostRenderers }}
  postRenderers:
  {{- if $havePostRenderers }}
  {{ toYaml (get .Values.packages $pkg).postRenderers | nindent 4 }}
  {{- end }}
  {{- if $installServiceMonitorPostRenderers }}
  {{ include "thanos.serviceMonitorPostRenderers" . | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "thanos" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.thanos.dependsOnOverride) }}
  {{- with .Values.packages.thanos.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if or $istioEnabled .Values.packages.kyvernoPolicies.enabled .Values.packages.monitoring.enabled .Values.packages.thanos.dependsOn }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.thanos) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
