{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.minio.enabled }}
  {{- include "values-secret" (dict
    "root" $
    "package" .Values.packages.minio
    "name" "minio"
    "bbCommonSubchart" true
    "defaults" (include "bigbang.defaults.minio" .)
  )}}
{{- end }}

{{- define "bigbang.defaults.minio" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
bb-common:
  networkPolicies:
    egress:
      from:
        minio:
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
  
  routes:
    inbound:
      api:
        enabled: true
        gateways:
        - istio-gateway/public-ingressgateway
        hosts:
        - minio-api.{{ .Values.domain }}
        service: minio
        port: 80
        containerPort: 9000
      console:
        enabled: true
        gateways:
        - istio-gateway/public-ingressgateway
        hosts:
        - minio.{{ .Values.domain }}
        service: minio-minio-minio-instance-console
        port: 9090
    outbound:
      bb-tests:
        enabled: {{ dig "bbtests" "enabled" false .Values.packages.minio.values }}
        hosts:
        - repo1.dso.mil

bbtests:
  cypress:
    envs:
      cypress_url: {{ printf "https://minio.%s/login" $domainName | quote }}
  scripts:
    envs:
      MINIO_PORT: ''
      MINIO_HOST: {{ printf "https://minio-api.%s" $domainName | quote }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

upstream:
  tenant:
    name: minio-minio-minio-instance
    {{- if $istioEnabled }}
    poolsMetadata:
      annotations:
        {{ include "istioAnnotation" . }}
    {{- end }}
    image:
      pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsImagePullSecretWithName" . | nindent 4 }}
    metrics:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    configSecret:
      accessKey: {{ .Values.packages.minio.accesskey | default "minio" }}
      secretKey: {{ .Values.packages.minio.secretkey | default "minio123" }}
    {{- if .Values.packages.monitoring.enabled }}
    env:
      - name: MINIO_PROMETHEUS_AUTH_TYPE
        value: "public"
    {{- end }}

{{- end -}}


