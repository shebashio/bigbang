{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsMinio := mergeOverwrite (deepCopy .Values.flux) .Values.packages.minio.flux -}}
{{- if .Values.packages.minio.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/minio/values.yaml") . | sha256sum }}
spec:
  targetNamespace: minio
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "minio" "package" .Values.packages.minio "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettingsMinio | nindent 2 }}
  
  {{- if .Values.packages.minio.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.minio.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "minio" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.minio.dependsOnOverride) }}
  {{- with .Values.packages.minio.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  dependsOn:
    {{- if .Values.packages.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
    {{- end }}
    - name: minio-operator
      namespace: {{ .Release.Namespace }}
    {{- if .Values.packages.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.minio) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
