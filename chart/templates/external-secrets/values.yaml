{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.packages.externalSecrets.enabled }}
{{- $externalSecretsPackage := deepCopy .Values.packages.externalSecrets -}}
{{- if .Values.packages.externalSecrets.values -}}
{{- $cleanedValues := include "mergeLegacyIstioHardenedKeys" (dict "values" .Values.packages.externalSecrets.values) | fromYaml -}}
{{- $externalSecretsPackage = set $externalSecretsPackage "values" $cleanedValues -}}
{{- end -}}
{{- include "values-secret" (dict "root" $ "package" $externalSecretsPackage "name" "external-secrets" "defaults" (include "bigbang.defaults.external-secrets" .) "bbCommonSubchart" true "supportsRouteDefaults" true) }}
{{- end }}

{{- define "bigbang.defaults.external-secrets" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $externalSecretsValues := .Values.packages.externalSecrets.values | default dict }}
{{- $webhookEnabled := dig "upstream" "webhook" "create" false $externalSecretsValues }}
{{- $certControllerEnabled := dig "upstream" "certController" "create" false $externalSecretsValues }}

upstream:
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}

  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
  {{- if $istioEnabled }}
  podAnnotations:
    {{ include "istioAnnotation" . }}
  webhook:
    podAnnotations:
      {{ include "istioAnnotation" . }}
  certController:
    podAnnotations:
      {{ include "istioAnnotation" . }}
  {{- end }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

bb-common:
  networkPolicies:
    ingress:
      to:
        external-secrets-webhook:10250:
          from:
            definition:
              kubeAPI: {{ $webhookEnabled }}
    egress:
      from:
        external-secrets:
          to:
            k8s:
              vault/vault:8200: {{ .Values.packages.vault.enabled }}
        external-secrets-webhook:
          to:
            definition:
              kubeAPI: {{ $webhookEnabled }}
        external-secrets-cert-controller:
          to:
            definition:
              kubeAPI: {{ $certControllerEnabled }}

openshift: {{ .Values.openshift }}
{{- end -}}
