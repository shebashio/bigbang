{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettingsMattermost := mergeOverwrite (deepCopy .Values.flux) .Values.packages.mattermost.flux -}}
{{- if .Values.packages.mattermost.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: "collaboration-tools"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/mattermost/values.yaml") . | sha256sum }}
spec:
  releaseName: mattermost
  targetNamespace: mattermost
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "mattermost" "package" .Values.packages.mattermost "root" .) | nindent 2 }}

  {{- toYaml $fluxSettingsMattermost | nindent 2 }}

  {{- if .Values.packages.mattermost.postRenderers }}
  postRenderers:
  {{ toYaml .Values.packages.mattermost.postRenderers | nindent 4 }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "mattermost" "root" .) | nindent 2 }}

  {{- if not (kindIs "invalid" .Values.packages.mattermost.dependsOnOverride) }}
  {{- with .Values.packages.mattermost.dependsOnOverride }}
  dependsOn:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  dependsOn:
    - name: mattermost-operator
      namespace: {{ .Release.Namespace }}

    {{- if .Values.packages.minioOperator.enabled }}
    - name: minio-operator
      namespace: {{ $.Release.Namespace }}
    {{- end }}

    {{- if and .Values.packages.mattermost.elasticsearch.enabled .Values.packages.elasticsearchKibana.enabled }}
    - name: ek
      namespace: {{ $.Release.Namespace }}
    {{- end }}
  {{- with (include "bigbang.helmRelease.dependsOn" .Values.packages.mattermost) }}
  {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
