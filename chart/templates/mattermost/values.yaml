{{- include "bigbang.normalizePackageAliases" . -}}
{{- /* Create a cleaned copy of package config and merge deprecated paths into current paths */ -}}
{{- $mattermostPackage := deepCopy .Values.packages.mattermost -}}
{{- if .Values.packages.mattermost.values -}}
  {{- $cleanedValues := include "mergeLegacyIstioHardenedKeys" (dict "values" .Values.packages.mattermost.values) | fromYaml -}}
  {{- $mattermostPackage = set $mattermostPackage "values" $cleanedValues -}}
{{- end -}}
{{- if .Values.packages.mattermost.enabled }}
{{- include "values-secret" (dict "root" $ "package" $mattermostPackage "name" "mattermost" "defaults" (mergeOverwrite (include "bigbang.defaults.mattermost" . | fromYaml) (include "bigbang.mattermost.bb-common-migrations" . | fromYaml) | toYaml)) }}
{{- end }}

{{- define "bigbang.defaults.mattermost" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $sentryEnabled := dig "mattermostEnvs" "MM_LOGSETTINGS_ENABLESENTRY" true .Values.packages.mattermost.values }}
{{- /* External postgres is enabled when all database connection fields are provided */ -}}
{{- $externalPostgresEnabled := and
    (ne .Values.packages.mattermost.database.username "")
    (ne .Values.packages.mattermost.database.password "")
    (ne .Values.packages.mattermost.database.host "")
    (ne (.Values.packages.mattermost.database.port | toString) "")
    (ne .Values.packages.mattermost.database.database "")
-}}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
hostname: {{ $domainName }}
domain: {{ $domainName }}

openshift: {{ .Values.openshift }}

image:
  imagePullPolicy: {{ .Values.imagePullPolicy }}

{{- $istioInjection := and $istioEnabled (ne (include "ambientEnabled" .) "true") (eq (dig "istio" "injection" "enabled" .Values.packages.mattermost) "enabled") }}

istio:
  injection: {{ ternary "enabled" "disabled" $istioInjection }}

{{- if $istioEnabled }}
podAnnotations:
  {{ include "istioAnnotation" . }}
updateJob:
  disabled: true
{{- end }}

monitoring:
  enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}

  serviceMonitor:
    enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
    {{- if eq (include "metricsSidecarMtls" (list .Values.packages.mattermost .)) "true" }}
    scheme: https
    tlsConfig:
      caFile: /etc/prom-certs/root-cert.pem
      certFile: /etc/prom-certs/cert-chain.pem
      keyFile: /etc/prom-certs/key.pem
      insecureSkipVerify: true
    {{- end }}

{{- with .Values.packages.mattermost.sso }}
sso:
  enabled: {{ .enabled }}
  client_id: {{ .client_id }}
  client_secret: {{ .client_secret | default "no-secret" }}
  auth_endpoint: {{ default (include "sso.oidc.auth" $) .auth_endpoint }}
  token_endpoint: {{ default (include "sso.oidc.token" $) .token_endpoint }}
  user_api_endpoint: {{ default (include "sso.oidc.userinfo" $) .user_api_endpoint }}
  {{- list "enable_sign_up_with_email" .enable_sign_up_with_email | include "bigbang.addValueIfSet" | indent 2 }}
  {{- list "enable_sign_in_with_email" .enable_sign_in_with_email | include "bigbang.addValueIfSet" | indent 2 }}
  {{- list "enable_sign_in_with_username" .enable_sign_in_with_username | include "bigbang.addValueIfSet" | indent 2 }}
{{- end }}

networkPolicies:
  egress:
    from:
      mattermost:
        to:
          k8s:
            tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}
            {{- if .Values.packages.elasticsearchKibana.enabled }}
            logging/logging-ek-es-http:9200: {{ .Values.packages.mattermost.elasticsearch.enabled }}
            {{- end }}
          definition:
            kubeAPI: true
            database-subnets: {{ $externalPostgresEnabled }}
            sso: {{ .Values.packages.mattermost.sso.enabled }}
            sentry-subnets: {{ $sentryEnabled }}
      {{- if dig "waitJob" "enabled" true .Values.packages.mattermost.values }}
      wait-job:
        to:
          definition:
            kubeAPI: true
      {{- end }}
  ingress:
    to:
      mattermost:8067:
        from:
          k8s:
            monitoring-monitoring-prometheus-prometheus@monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}

{{- $ssoHost := "" }}
{{- if .Values.packages.mattermost.sso.enabled }}
{{- $ssoHost = include "sso.url" . | trimPrefix "https://" | regexFind "^[^/]+" }}
{{- end }}
routes:
  inbound:
    chat:
      gateways:
        - {{ include "getGatewayName" (dict "gateway" .Values.packages.mattermost.ingress.gateway "root" .) }}
  outbound:
    mattermost-sentry:
      enabled: {{ $sentryEnabled }}
    sso:
      enabled: {{ .Values.packages.mattermost.sso.enabled }}
      {{- if $ssoHost }}
      hosts:
        - {{ $ssoHost }}
      {{- end }}
    bb-tests:
      enabled: {{ dig "bbtests" "enabled" false .Values.packages.mattermost.values }}
      hosts:
      - 'repo1.dso.mil'

waitJob:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://chat.%s" $domainName | quote }}
      {{- include "bigbang.cypressKeycloakValues" (dict "package" .Values.packages.mattermost "values" .Values) | nindent 6 }}
    # This should be removed once https://repo1.dso.mil/big-bang/product/packages/mattermost/-/work_items/271 is complete
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

global:
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}

{{- with .Values.packages.mattermost.enterprise }}
enterprise:
  enabled: {{ .enabled }}
  existingSecret: {{ .existingSecret }}
  license: {{ .license }}
{{- end }}

{{- with .Values.packages.mattermost.database }}
{{- if $externalPostgresEnabled }}
database:
  secret: "mattermost-database-secret"
postgresql:
  secret: "mattermost-database-secret"
{{- else }}
postgresql:
  image:
    {{- include "secretsPullSecrets" $ | nindent 4 }}
  {{- if $externalPostgresEnabled }}
  secret: "mattermost-database-secret"
  {{- else }}
  secret: "mattermost-dbcreds"
  {{- end }}
  install: true
  primary:
    {{- if $istioEnabled }}
    podAnnotations:
      {{ include "istioAnnotation" $ }}
    {{- end }}
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      runAsUser: 1001
      runAsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    volumePermissions:
      securityContext:
        capabilities:
          drop:
            - ALL
  {{- if $istioEnabled }}
  readReplicas:
    podAnnotations:
      {{ include "istioAnnotation" $ }}
  {{- end }}

{{- end }}
{{- end }}

{{- $objStore := .Values.packages.mattermost.objectStorage }}
{{- if and $objStore.endpoint $objStore.accessKey $objStore.accessSecret $objStore.bucket }}
fileStore:
  secret: "mattermost-objectstorage-secret"
  url: {{ $objStore.endpoint }}
  bucket: {{ $objStore.bucket }}
{{- end }}

{{- if .Values.packages.mattermost.elasticsearch.enabled }}
elasticsearch:
  enabled: true
{{- end }}

mattermostEnvs:
  # required for Keycloak >= 20.X to work with gitlab auth pointed to Keycloak
  MM_GITLABSETTINGS_SCOPE: openid
  {{- if $objStore.disableSSL }}
  MM_FILESETTINGS_AMAZONS3SSL: "false"
  {{- end }}
  {{- if $objStore.forcePathStyle }}
  MM_FILESETTINGS_AMAZONS3PATHSTYLE: "true"
  {{- end }}

{{- end -}}
