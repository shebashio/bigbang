{{- include "bigbang.normalizePackageAliases" . -}}
{{- if or .Values.packages.eckOperator.enabled .Values.packages.elasticsearchKibana.enabled }}

  {{- /* Create a cleaned copy of the config and merge deprecated paths into current paths */ -}}
  {{- $eckOperatorPackage := deepCopy .Values.packages.eckOperator -}}
  {{- if .Values.packages.eckOperator.values -}}
    {{- $cleanedValues := include "mergeLegacyIstioHardenedKeys" (dict "values" (deepCopy .Values.packages.eckOperator.values)) | fromYaml -}}
    {{- if hasKey $cleanedValues "bb-common" -}}
      {{- $cleanedCommon := include "mergeLegacyIstioHardenedKeys" (dict "values" (index $cleanedValues "bb-common")) | fromYaml -}}
      {{- $cleanedValues = set $cleanedValues "bb-common" $cleanedCommon -}}
    {{- end -}}
    {{- $eckOperatorPackage = set $eckOperatorPackage "values" $cleanedValues -}}
  {{- end }}

{{- include "values-secret" (dict
  "root" $
  "package" $eckOperatorPackage
  "name" "eck-operator"
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.eck-operator" .)
) }}
{{- end }}

{{- define "bigbang.defaults.eck-operator" -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
license:
  trial: {{ .Values.packages.elasticsearchKibana.license.trial }}
  keyJSON: |
    {{ .Values.packages.elasticsearchKibana.license.keyJSON | nindent 4 }}

image:
  pullPolicy: {{ .Values.imagePullPolicy }}

openshift: {{ .Values.openshift }}

monitoring:
  enabled: {{ .Values.packages.monitoring.enabled }}

serviceMonitor:
  enabled: {{ eq (include "metricScrapingEnabled" $) "true" }}
  {{- if eq (include "metricsSidecarMtls" (list $.Values.packages.eckOperator $)) "true" }}
  tlsConfig:
    caFile: /etc/prom-certs/root-cert.pem
    certFile: /etc/prom-certs/cert-chain.pem
    keyFile: /etc/prom-certs/key.pem
    insecureSkipVerify: true
  {{- end }}

bb-common:
  networkPolicies:
    ingress:
      to:
        elastic-operator:8080:
          from:
            k8s:
              monitoring/prometheus: {{ .Values.packages.monitoring.enabled }}
    egress:
      from:
        elastic-operator:
          to:
            k8s:
              tempo/tempo:9411: {{ .Values.packages.tempo.enabled }}

upstream:
  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}
  {{- if $istioEnabled }}
  podAnnotations:
    traffic.sidecar.istio.io/includeInboundPorts: "*"
    traffic.sidecar.istio.io/excludeInboundPorts: "9443"
    {{ include "istioAnnotation" . }}
  {{- end }}
{{- end -}}
