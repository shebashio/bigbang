{{- include "bigbang.normalizePackageAliases" . -}}
{{- $packages := default (dict) .Values.packages }}
{{- $kyvernoPolicies := default (dict) (get $packages "kyvernoPolicies") }}
{{- if and (eq (get $kyvernoPolicies "sourceType") "git") (not .Values.offline) (default false (get $kyvernoPolicies "enabled")) }}
{{- include "bigbang.gitRepository" (dict "name" "kyverno-policies" "gitCredsName" "kyvernoPolicies" "git" (default (dict) (get $kyvernoPolicies "git")) "root" .) }}
{{- end }}
