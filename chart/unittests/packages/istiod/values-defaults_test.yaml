suite: Package - Istiod - Ambient Waypoint Routing
templates:
  - templates/istiod/values.yaml
set:
  istiod.enabled: true
postRenderer:
  cmd: sh
  args:
    - -c
    - "yq eval '.stringData.defaults' - | yq eval '.'"
tests:
  - it: enables ingress waypoint routing in ambient mode
    set:
      istio.ambient.enabled: true
    asserts:
      - equal:
          path: upstream.pilot.env.ENABLE_INGRESS_WAYPOINT_ROUTING
          value: "true"
      - equal:
          path: upstream.pilot.env.PILOT_ENABLE_AMBIENT
          value: "true"
  - it: enables ingress waypoint routing when ztunnel enables ambient mode
    set:
      istio.ambient.enabled: false
      ztunnel.enabled: true
    asserts:
      - equal:
          path: upstream.pilot.env.ENABLE_INGRESS_WAYPOINT_ROUTING
          value: "true"
  - it: omits ambient routing flags in sidecar mode
    set:
      istio.ambient.enabled: false
      ztunnel.enabled: false
    asserts:
      - notExists:
          path: upstream.pilot.env
