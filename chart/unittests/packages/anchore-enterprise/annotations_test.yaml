# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Anchore Enterprise - Istio Annotation Routing
templates:
  - templates/anchore-enterprise/values.yaml
tests:
  - it: should render the istio roll annotation on the internal postgres pod templates
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.anchoreEnterprise.enabled: true
      istio.ambient.enabled: true
    asserts:
      - equal:
          path: postgresql.primary.podAnnotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: postgresql.readReplicas.podAnnotations["bigbang.dev/istioDataplane"]
          value: ambient

  - it: should render the istio roll annotation on every enterprise service pod template
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.anchoreEnterprise.enabled: true
      istio.ambient.enabled: true
    asserts:
      - equal:
          path: upstream.analyzer.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.api.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.catalog.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.dataSyncer.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.notifications.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.policyEngine.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.reports.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.reportsWorker.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.simpleQueue.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - equal:
          path: upstream.ui.annotations["bigbang.dev/istioDataplane"]
          value: ambient

  - it: should account for external Redis in routes and network policies
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.anchoreEnterprise.enabled: true
      packages.anchoreEnterprise.redis.host: redis.example.internal
      packages.anchoreEnterprise.redis.port: 6380
      packages.anchoreEnterprise.redis.password: test-password
    asserts:
      - equal:
          path: bb-common.routes.outbound["external-redis"].enabled
          value: true
      - equal:
          path: bb-common.routes.outbound["external-redis"].hosts[0]
          value: redis.example.internal
      - equal:
          path: bb-common.routes.outbound["external-redis"].ports[0].number
          value: 6380
      - equal:
          path: bb-common.networkPolicies.egress.from.api.to.definition.redis-subnets
          value: true
      - equal:
          path: bb-common.networkPolicies.egress.from.ui.to.definition.redis-subnets
          value: true

  - it: should omit the external Redis outbound route when external Redis is not configured
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.anchoreEnterprise.enabled: true
    asserts:
      - notExists:
          path: bb-common.routes.outbound["external-redis"]
      - equal:
          path: bb-common.routes.outbound["anchore-data-service"].enabled
          value: true
      - notExists:
          path: bb-common.istio.injection

  - it: should nest istio config under bb-common and keep the flat keys out of defaults
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.anchoreEnterprise.enabled: true
    asserts:
      - equal:
          path: global.domain
          value: dev.bigbang.mil
      - notExists:
          path: domain
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
      - notExists:
          path: routes

  - it: should pass custom service entries set under bb-common through in the overlays
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.anchoreEnterprise.enabled: true
      packages.anchoreEnterprise.values.bb-common.istio.serviceEntries.custom:
        - name: custom-egress
          spec:
            hosts:
              - example.com
    asserts:
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].name
          value: custom-egress
