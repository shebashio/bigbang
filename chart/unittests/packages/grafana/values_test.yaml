# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Grafana - Values Tests
templates:
  - templates/grafana/values.yaml
tests:
  - it: should enable istio sidecar under bb-common when istiod hardened is enabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.istiod.values.hardened.enabled: true
    asserts:
      - equal:
          path: bb-common.istio.sidecar.enabled
          value: true
  - it: should point the GitLab Redis datasource at the configured external service
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.gitlab.enabled: true
      packages.gitlab.redis.password: test-password
      packages.gitlab.values.global.redis.host: redis-master.redis.svc.cluster.local
      packages.gitlab.values.global.redis.port: 6379
    asserts:
      - equal:
          path: upstream.datasources["datasourcesbb.yaml"].datasources[1].url
          value: redis-master.redis.svc.cluster.local:6379
  - it: should open the bb-common outbound route and egress for external GitLab Redis
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.gitlab.enabled: true
      packages.gitlab.redis.password: test-password
      packages.gitlab.values.global.redis.host: redis-master.redis.svc.cluster.local
      packages.gitlab.values.global.redis.port: 6379
    asserts:
      - equal:
          path: bb-common.routes.outbound["external-gitlab-redis"].enabled
          value: true
      - equal:
          path: bb-common.routes.outbound["external-gitlab-redis"].hosts[0]
          value: redis-master.redis.svc.cluster.local
      - equal:
          path: bb-common.networkPolicies.egress.from.grafana.to.definition.redis-subnets
          value: true

  - it: should not create a datasource for Argo CD external Redis
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.argocd.enabled: true
      packages.argocd.redis.host: redis.argocd.example.internal
    asserts:
      - notEqual:
          path: upstream.datasources["datasourcesbb.yaml"].datasources[0].name
          value: Argo External
      - notEqual:
          path: upstream.datasources["datasourcesbb.yaml"].datasources[0].url
          value: redis.argocd.example.internal:6379

  - it: should not open bb-common egress for Argo CD external Redis
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.argocd.enabled: true
      packages.argocd.redis.host: redis.argocd.example.internal
    asserts:
      - notExists:
          path: bb-common.routes.outbound["external-argocd-redis"]
      - notEqual:
          path: bb-common.networkPolicies.egress.from.grafana.to.definition.redis-subnets
          value: true
