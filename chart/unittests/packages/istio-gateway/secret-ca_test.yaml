# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Istio Gateway - CA Cert Secret Tests
templates:
  - templates/istio-gateway/secret-ca.yaml
release:
  name: bb
tests:
  - it: should create the public gateway CA secret for TLS-terminated Keycloak
    set:
      addons.keycloak.enabled: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: public-cert-cacert
          namespace: istio-gateway
      - equal:
          path: type
          value: Opaque
      - isNotNull:
          path: data.cacert
        documentSelector:
          path: metadata.name
          value: public-cert-cacert

  - it: should not create a CA secret when Keycloak is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a CA secret when Keycloak uses a custom gateway
    set:
      addons.keycloak.enabled: true
      addons.keycloak.ingress.gateway: custom
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a CA secret when Keycloak uses TLS passthrough
    set:
      addons.keycloak.enabled: true
      addons.keycloak.ingress.cert: test-cert
      addons.keycloak.ingress.key: test-key
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create CA secrets for unrelated mutual gateway servers
    set:
      addons.keycloak.enabled: true
      istioGateway.values.gateways.custom:
        gateway:
          servers:
            - hosts:
                - custom.dev.bigbang.mil
              port:
                name: custom-mutual
                number: 8443
                protocol: HTTPS
              tls:
                credentialName: custom-cert
                mode: MUTUAL
        upstream:
          labels:
            istio: ingressgateway
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: public-cert-cacert
