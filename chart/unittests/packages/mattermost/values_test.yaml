# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Mattermost - Values Tests
templates:
  - templates/mattermost/values.yaml
tests:
  - it: should allow user to override route hosts in overlays
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.mattermost.enabled: true
      packages.mattermost.values:
        bb-common:
          routes:
            inbound:
              chat:
                hosts:
                  - "custom-chat.example.com"
    asserts:
      - equal:
          path: bb-common.routes.inbound.chat.hosts[0]
          value: "custom-chat.example.com"

  - it: should pass explicit kubeAPI definitions under bb-common
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.mattermost.enabled: true
      networkPolicies.egress.definitions.kubeAPI:
        to:
          - ipBlock:
              cidr: 10.0.0.0/8
          - ipBlock:
              cidr: 172.16.0.0/12
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.definitions.kubeAPI.to[0].ipBlock.cidr
          value: 10.0.0.0/8
      - equal:
          path: bb-common.networkPolicies.egress.definitions.kubeAPI.to[1].ipBlock.cidr
          value: 172.16.0.0/12

  - it: should derive chat host and sidecar gossip from umbrella configuration
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq eval-all '[.stringData.common, .stringData.defaults] | map(from_yaml) | .[0] * .[1]' -"
    set:
      packages.mattermost.enabled: true
      domain: example.com
      packages.istiod.enabled: true
      packages.istioCNI.enabled: false
      packages.ztunnel.enabled: false
    asserts:
      - equal:
          path: bb-common.routes.inbound.chat.hosts[0]
          value: chat.example.com
      - equal:
          path: global.domain
          value: example.com
      - equal:
          path: gossipService.enabled
          value: true
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
      - notExists:
          path: routes
