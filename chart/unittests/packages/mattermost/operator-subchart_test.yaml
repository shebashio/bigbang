suite: Mattermost Operator bb-common subchart values
templates:
  - templates/mattermost-operator/values.yaml
postRenderer:
  cmd: sh
  args:
    - -c
    - "yq '.stringData.common | from_yaml'"
tests:
  - it: should nest operator mesh and API egress definitions when only Mattermost is enabled
    template: templates/mattermost-operator/values.yaml
    set:
      packages.mattermost.enabled: true
      packages.mattermostOperator.enabled: false
      networkPolicies.egress.definitions.kubeAPI.to:
        - ipBlock:
            cidr: 10.12.0.0/16
    asserts:
      - exists:
          path: bb-common.istio
      - equal:
          path: bb-common.networkPolicies.egress.definitions.kubeAPI.to[0].ipBlock.cidr
          value: 10.12.0.0/16
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
  - it: should not render operator values when both packages are disabled
    template: templates/mattermost-operator/values.yaml
    postRenderer:
      cmd: cat
    set:
      packages.mattermost.enabled: false
      packages.mattermostOperator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
