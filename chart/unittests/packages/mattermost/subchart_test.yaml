suite: Mattermost pair bb-common subchart values
templates:
  - templates/mattermost/values.yaml
postRenderer:
  cmd: sh
  args:
    - -c
    - "yq '.stringData.common | from_yaml'"
tests:
  - it: permits the monitoring Prometheus service account to scrape Mattermost
    set:
      packages.mattermost.enabled: true
      packages.monitoring.enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.ingress.to.mattermost:8067.from.k8s["monitoring-monitoring-kube-prometheus@monitoring/prometheus"]
          value: true
  - it: should retain user route overrides in overlays
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.overlays | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.mattermost.values.bb-common.routes.inbound.chat:
        enabled: false
        gateways:
          - custom/gateway
    asserts:
      - equal:
          path: bb-common.routes.inbound.chat.enabled
          value: false
      - equal:
          path: bb-common.routes.inbound.chat.gateways[0]
          value: custom/gateway
  - it: should supply SSO provider host under bb-common
    set:
      packages.mattermost.enabled: true
      packages.mattermost.sso.enabled: true
      sso.url: https://login.example.com/realms/test
    asserts:
      - equal:
          path: bb-common.routes.outbound.sso.enabled
          value: true
      - equal:
          path: bb-common.routes.outbound.sso.hosts[0]
          value: login.example.com
  - it: should pass ambient mode without the retired injection setting
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: true
      istio.ambient.enabled: true
    asserts:
      - equal:
          path: bb-common.istio.enabled
          value: true
      - equal:
          path: bb-common.istio.ambient.enabled
          value: true
      - notExists:
          path: bb-common.istio.injection
  - it: should pass sidecar mode when the mesh is enabled without ambient
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: true
      packages.ztunnel.enabled: false
      istio.ambient.enabled: false
    asserts:
      - equal:
          path: bb-common.istio.enabled
          value: true
      - equal:
          path: bb-common.istio.ambient.enabled
          value: false
  - it: should pass a disabled mesh to the package
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: false
      packages.ztunnel.enabled: false
      istio.ambient.enabled: false
    asserts:
      - equal:
          path: bb-common.istio.enabled
          value: false
  - it: should leave ServiceMonitor mode selection to the package
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.defaults | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: true
      packages.ztunnel.enabled: false
      istio.ambient.enabled: false
    asserts:
      - notExists:
          path: istio
      - notExists:
          path: monitoring.serviceMonitor.scheme
      - notExists:
          path: monitoring.serviceMonitor.tlsConfig
