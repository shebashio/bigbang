suite: Mattermost pair bb-common subchart values
templates:
  - templates/mattermost/values.yaml
postRenderer:
  cmd: sh
  args:
    - -c
    - "yq '.stringData.common | from_yaml'"
tests:
  - it: should retain user route overrides in overlays
    template: templates/mattermost/values.yaml
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.overlays | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.mattermost.values.bb-common.routes.inbound.chat:
        enabled: false
        gateways:
          - custom/gateway
    asserts:
      - equal:
          path: bb-common.routes.inbound.chat.enabled
          value: false
      - equal:
          path: bb-common.routes.inbound.chat.gateways[0]
          value: custom/gateway
  - it: should supply SSO provider host under bb-common
    template: templates/mattermost/values.yaml
    set:
      packages.mattermost.enabled: true
      packages.mattermost.sso.enabled: true
      sso.url: https://login.example.com/realms/test
    asserts:
      - equal:
          path: bb-common.routes.outbound.sso.enabled
          value: true
      - equal:
          path: bb-common.routes.outbound.sso.hosts[0]
          value: login.example.com
  - it: should disable package injection for ambient mode
    template: templates/mattermost/values.yaml
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.defaults | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: true
      istio.ambient.enabled: true
    asserts:
      - equal:
          path: istio.injection
          value: disabled
  - it: should use HTTP metrics for a nested permissive mTLS override
    template: templates/mattermost/values.yaml
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.defaults | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: true
      packages.ztunnel.enabled: false
      istio.ambient.enabled: false
      packages.mattermost.values.bb-common.istio.mtls.mode: PERMISSIVE
    asserts:
      - notExists:
          path: monitoring.serviceMonitor.tlsConfig
      - notExists:
          path: monitoring.serviceMonitor.scheme
  - it: should preserve disabled namespace injection for sidecar mode
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.defaults | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: true
      istio.ambient.enabled: false
      packages.ztunnel.enabled: false
      packages.mattermost.istio.injection: disabled
    asserts:
      - equal:
          path: istio.injection
          value: disabled
  - it: should not enable package injection when the mesh is disabled
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.defaults | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.istiod.enabled: false
      packages.ztunnel.enabled: false
      istio.ambient.enabled: false
    asserts:
      - equal:
          path: istio.injection
          value: disabled
  - it: should keep explicit injection overrides at the existing package path
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq '.stringData.overlays | from_yaml'"
    set:
      packages.mattermost.enabled: true
      packages.mattermost.values.istio.injection: ""
    asserts:
      - equal:
          path: istio.injection
          value: ""
