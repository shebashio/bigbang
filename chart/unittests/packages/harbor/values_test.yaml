# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Harbor - Values Tests
templates:
  - templates/harbor/values.yaml
release:
  name: bb
tests:
  - it: moves domain to global.domain and omits integration values from defaults
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
    asserts:
      - equal:
          path: global.domain
          value: dev.bigbang.mil
      - notExists:
          path: domain
      - notExists:
          path: istio
      - notExists:
          path: routes
      - notExists:
          path: networkPolicies
      - notExists:
          path: bb-common

  - it: nests istio/networkPolicies/routes under bb-common in common and drops the injection key
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
      networkPolicies.egress.definitions.kubeAPI.to[0].ipBlock.cidr: 10.0.0.0/8
    asserts:
      - isNotNull:
          path: bb-common.istio
      - isNotNull:
          path: bb-common.networkPolicies
      - isNotNull:
          path: bb-common.routes.inbound.harbor
      - equal:
          path: bb-common.networkPolicies.egress.definitions.kubeAPI.to[0].ipBlock.cidr
          value: 10.0.0.0/8
      - notExists:
          path: bb-common.istio.injection
      - notExists:
          path: istio
      - notExists:
          path: routes
      - notExists:
          path: networkPolicies

  - it: should enable database-subnets egress when postgresql is disabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
      packages.harbor.values.postgresql.enabled: false
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.from.harbor.to.definition.database-subnets
          value: true

  - it: should disable database-subnets egress when postgresql is enabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
      packages.harbor.values.postgresql.enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.from.harbor.to.definition.database-subnets
          value: false

  - it: should disable database-subnets egress and omit the external-redis route by default
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.from.harbor.to.definition.database-subnets
          value: false
      - equal:
          path: bb-common.networkPolicies.egress.from.harbor.to.definition.redis-subnets
          value: false
      - notExists:
          path: bb-common.routes.outbound["external-redis"]

  - it: should account for external Redis in routes and network policies
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
      packages.harbor.values.redis.external.addr: redis.example.internal:6380
    asserts:
      - equal:
          path: bb-common.routes.outbound["external-redis"].enabled
          value: true
      - equal:
          path: bb-common.routes.outbound["external-redis"].hosts[0]
          value: redis.example.internal
      - equal:
          path: bb-common.routes.outbound["external-redis"].ports[0].number
          value: 6380
      - equal:
          path: bb-common.networkPolicies.egress.from.harbor.to.definition.redis-subnets
          value: true

  - it: should map legacy istio.hardened keys nested under bb-common in the overlay
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.overlays' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
      packages.harbor.values.bb-common.istio.hardened.customServiceEntries:
        - name: test-service-entry
          spec:
            hosts:
              - example.com
      packages.harbor.values.bb-common.istio.hardened.customAuthorizationPolicies:
        - name: test-authz-policy
          spec: {}
    asserts:
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].name
          value: test-service-entry
      - equal:
          path: bb-common.istio.authorizationPolicies.custom[0].name
          value: test-authz-policy
      - notExists:
          path: bb-common.istio.hardened

  - it: should map legacy top-level istio.hardened keys in the overlay
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-harbor-values\") | .stringData.overlays' - | yq eval '.'"
    set:
      packages.harbor.enabled: true
      packages.harbor.values.istio.hardened.customServiceEntries:
        - name: test-service-entry
          spec:
            hosts:
              - example.com
    asserts:
      - equal:
          path: istio.serviceEntries.custom[0].name
          value: test-service-entry
      - notExists:
          path: istio.hardened
