# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Authservice - Redis Values Tests
templates:
  - templates/authservice/values.yaml
tests:
  - it: should account for external Redis in routes and network policies
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.authservice.enabled: true
      addons.authservice.values.global.redis_server_uri: tcp://redis.example.internal:6380
    asserts:
      - equal:
          path: routes.outbound["external-redis"].enabled
          value: true
      - equal:
          path: routes.outbound["external-redis"].hosts[0]
          value: redis.example.internal
      - equal:
          path: routes.outbound["external-redis"].ports[0].number
          value: 6380
      - equal:
          path: networkPolicies.egress.from.authservice.to.definition.redis-subnets
          value: true
      - equal:
          path: networkPolicies.ingress.to["redis-bb:6379"].from.k8s["monitoring/grafana"]
          value: false
