# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Authservice - Chain Collision
templates:
- authservice/values.yaml
tests:
- it: should auto-inject prometheus and alertmanager when the user defines no chains
  set:
    istiod:
      enabled: true
    monitoring:
      enabled: true
      sso:
        enabled: true
        prometheus:
          client_id: auto-prometheus
        alertmanager:
          client_id: auto-alertmanager
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: "client_id: auto-prometheus"
  - matchRegex:
      path: stringData.defaults
      pattern: "client_id: auto-alertmanager"

- it: should let the user prometheus chain win while alertmanager still auto-injects
  set:
    istiod:
      enabled: true
    monitoring:
      enabled: true
      sso:
        enabled: true
        prometheus:
          client_id: auto-prometheus
        alertmanager:
          client_id: auto-alertmanager
    addons:
      authservice:
        chains:
          prometheus:
            client_id: user-prometheus
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: "client_id: user-prometheus"
  - notMatchRegex:
      path: stringData.defaults
      pattern: "client_id: auto-prometheus"
  - matchRegex:
      path: stringData.defaults
      pattern: "client_id: auto-alertmanager"

- it: should let the user alertmanager chain win while prometheus still auto-injects
  set:
    istiod:
      enabled: true
    monitoring:
      enabled: true
      sso:
        enabled: true
        prometheus:
          client_id: auto-prometheus
        alertmanager:
          client_id: auto-alertmanager
    addons:
      authservice:
        chains:
          alertmanager:
            client_id: user-alertmanager
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: "client_id: user-alertmanager"
  - notMatchRegex:
      path: stringData.defaults
      pattern: "client_id: auto-alertmanager"
  - matchRegex:
      path: stringData.defaults
      pattern: "client_id: auto-prometheus"

- it: should preserve an explicit Thanos chain without auto-injecting it
  set:
    istiod:
      enabled: true
    addons:
      authservice:
        enabled: true
        chains:
          thanos:
            client_id: user-thanos
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: "client_id: user-thanos"
