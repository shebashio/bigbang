# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Fluentbit - Values Tests
templates:
  - templates/fluentbit/values.yaml
tests:
  - it: should nest bb-common config in the common block
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.fluentbit.enabled: true
      packages.fluentbit.values.bbtests.enabled: true
    asserts:
      - exists:
          path: bb-common.istio
      - notExists:
          path: bb-common.istio.injection
      - notExists:
          path: bb-common.istio.hardened
      - notExists:
          path: bb-common.networkPolicies.controlPlaneCidr
      - equal:
          path: bb-common.routes.outbound.bb-tests.enabled
          value: true
      - equal:
          path: bb-common.networkPolicies.egress.from.fluent-bit.to.definition.kubeAPI.enabled
          value: true
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
      - notExists:
          path: routes

  - it: should not carry bb-common config in the defaults block
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.fluentbit.enabled: true
    asserts:
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
      - notExists:
          path: routes
      - notExists:
          path: bb-common

  - it: should merge external elastic definition and enable egress rule
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.fluentbit.enabled: true
      packages.fluentbit.values.bb-common.networkPolicies.egress.definitions.external-elastic:
        to:
          - ipBlock:
              cidr: 203.0.113.10/32
        ports:
          - port: 9200
            protocol: TCP
      packages.fluentbit.values.bb-common.networkPolicies.egress.from.fluent-bit.to.definition.external-elastic:
        enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.definitions.external-elastic.to[0].ipBlock.cidr
          value: 203.0.113.10/32
      - equal:
          path: bb-common.networkPolicies.egress.definitions.external-elastic.ports[0].port
          value: 9200
      - equal:
          path: bb-common.networkPolicies.egress.from.fluent-bit.to.definition.external-elastic.enabled
          value: true

  - it: should use label allowlist with auto_kubernetes_labels off when loki is enabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.fluentbit.enabled: true
      packages.loki.enabled: true
    asserts:
      - matchRegex:
          path: upstream.config.outputs
          pattern: "auto_kubernetes_labels off"
      - matchRegex:
          path: upstream.config.outputs
          pattern: "cluster="
      - notMatchRegex:
          path: upstream.config.outputs
          pattern: "auto_kubernetes_labels on"

  - it: should fold flat networkPolicies overrides into the bb-common common block
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.fluentbit.enabled: true
      packages.fluentbit.values.networkPolicies.egress.definitions.external-fluentd:
        to:
          - ipBlock:
              cidr: 198.51.100.0/24
        ports:
          - port: 24224
            protocol: TCP
      packages.fluentbit.values.networkPolicies.egress.from.fluent-bit.to.definition.external-fluentd:
        enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.definitions.external-fluentd.to[0].ipBlock.cidr
          value: 198.51.100.0/24
      - equal:
          path: bb-common.networkPolicies.egress.definitions.external-fluentd.ports[0].port
          value: 24224
      - equal:
          path: bb-common.networkPolicies.egress.from.fluent-bit.to.definition.external-fluentd.enabled
          value: true
