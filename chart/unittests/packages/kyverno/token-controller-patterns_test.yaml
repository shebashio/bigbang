# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Kyverno Policies - API Token Controller Names
tests:
  - it: covers current velero controller names and Pods while rejecting unrelated names
    set:
      packages.kyvernoPolicies.enabled: true
    asserts:
      - equal:
          path: matches
          value:
            - name: node-agent
              allowed: true
            - name: node-agent-abcde
              allowed: true
            - name: node-agent-abcde-
              allowed: true
            - name: velero
              allowed: true
            - name: velero-abcde-fghij
              allowed: true
            - name: velero-velero-abcde-fghij
              allowed: true
            - name: node-agentevil
              allowed: false
            - name: veleroevil
              allowed: false
            - name: unrelated
              allowed: false
    postRenderer:
      cmd: sh
      args:
        - -c
        - |
          yq eval 'select(.kind == "Secret" and (.metadata.name | test("kyverno-policies-values$"))) | .stringData.defaults' - |
          yq eval '
          .policies.update-automountserviceaccounttokens.namespaces[] |
          select(.namespace == "velero") | .pods.allow as $allow |
          {"matches": (
            [
            "node-agent",
            "node-agent-abcde",
            "node-agent-abcde-",
            "velero",
            "velero-abcde-fghij",
            "velero-velero-abcde-fghij",
            "node-agentevil",
            "veleroevil",
            "unrelated"
          ] |
            map(. as $name | {
              "name": $name,
              "allowed": ($allow | map(. as $pattern | $name | test("^" + $pattern + "$")) | any)
            })
          )}
          ' -
  - it: covers current monitoring controller names and Pods while rejecting unrelated names
    set:
      packages.kyvernoPolicies.enabled: true
    asserts:
      - equal:
          path: matches
          value:
            - name: monitoring-monitoring-kube-operator
              allowed: true
            - name: monitoring-monitoring-kube-operator-abcde-fghij
              allowed: true
            - name: monitoring-operator-abcde-fghij
              allowed: true
            - name: monitoring-monitoring-kube-operatorevil
              allowed: false
            - name: unrelated
              allowed: false
    postRenderer:
      cmd: sh
      args:
        - -c
        - |
          yq eval 'select(.kind == "Secret" and (.metadata.name | test("kyverno-policies-values$"))) | .stringData.defaults' - |
          yq eval '
          .policies.update-automountserviceaccounttokens.namespaces[] |
          select(.namespace == "monitoring") | .pods.allow as $allow |
          {"matches": (
            [
            "monitoring-monitoring-kube-operator",
            "monitoring-monitoring-kube-operator-abcde-fghij",
            "monitoring-operator-abcde-fghij",
            "monitoring-monitoring-kube-operatorevil",
            "unrelated"
          ] |
            map(. as $name | {
              "name": $name,
              "allowed": ($allow | map(. as $pattern | $name | test("^" + $pattern + "$")) | any)
            })
          )}
          ' -
