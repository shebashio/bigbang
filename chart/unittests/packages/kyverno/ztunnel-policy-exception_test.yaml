# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Kyverno Policies - Ztunnel Exception
postRenderer:
  cmd: "sh"
  args:
    - "-c"
    - "yq eval 'select(.kind == \"Secret\" and (.metadata.name | test(\"kyverno-policies-values$\"))) | .stringData.defaults' - | yq eval '.'"
tests:
  - it: should include the ztunnel policy exception when ambient is enabled globally
    set:
      kyvernoPolicies.enabled: true
      istio.ambient.enabled: true
    asserts:
      - exists:
          path: additionalPolicyExceptions.ztunnel.spec

  - it: should include the ztunnel policy exception when ztunnel is enabled
    set:
      kyvernoPolicies.enabled: true
      ztunnel.enabled: true
    asserts:
      - exists:
          path: additionalPolicyExceptions.ztunnel.spec

  - it: should not include the ztunnel policy exception when ambient is disabled
    set:
      kyvernoPolicies.enabled: true
      istio.ambient.enabled: false
      ztunnel.enabled: false
    asserts:
      - notExists:
          path: additionalPolicyExceptions.ztunnel
