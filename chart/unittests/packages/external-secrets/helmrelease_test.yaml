# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Packages - external-secrets - HelmRelease Tests
templates:
  - templates/external-secrets/helmrelease.yaml
  - templates/external-secrets/values.yaml
tests:
  - it: renders when external-secrets values are omitted with istio disabled
    template: external-secrets/helmrelease.yaml
    set:
      istio.enabled: false
      istiod.enabled: false
      addons:
        externalSecrets:
          enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: external-secrets
      - notExists:
          path: spec.postRenderers

  - it: preserves the upstream webhook default with istio enabled
    template: external-secrets/helmrelease.yaml
    set:
      istio.enabled: true
      istiod.enabled: true
      addons:
        externalSecrets:
          enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: external-secrets
      - exists:
          path: spec.postRenderers

  - it: allows explicitly disabling the upstream webhook with istio enabled
    template: external-secrets/helmrelease.yaml
    set:
      istio.enabled: true
      istiod.enabled: true
      addons:
        externalSecrets:
          enabled: true
          values:
            upstream:
              webhook:
                create: false
    asserts:
      - notExists:
          path: spec.postRenderers

  - it: renders defaults when external-secrets values are empty
    template: external-secrets/values.yaml
    set:
      istio.enabled: true
      istiod.enabled: true
      addons:
        externalSecrets:
          enabled: true
          values: {}
    asserts:
      - matchRegex:
          path: stringData.defaults
          pattern: "kubeAPI: true"
