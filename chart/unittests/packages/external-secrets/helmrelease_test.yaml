# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Packages - external-secrets - HelmRelease Tests
templates:
  - templates/external-secrets/helmrelease.yaml
  - templates/external-secrets/values.yaml
tests:
  - it: renders when external-secrets values are omitted with istio disabled
    template: external-secrets/helmrelease.yaml
    set:
      istio.enabled: false
      istiod.enabled: false
      addons:
        externalSecrets:
          enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: external-secrets
      - notExists:
          path: spec.postRenderers

  - it: renders when the upstream webhook is enabled with istio disabled
    template: external-secrets/helmrelease.yaml
    set:
      istio.enabled: false
      istiod.enabled: false
      addons:
        externalSecrets:
          enabled: true
          values:
            upstream:
              webhook:
                create: true
    asserts:
      - equal:
          path: metadata.name
          value: external-secrets
      - notExists:
          path: spec.postRenderers
