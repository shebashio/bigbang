# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Keycloak - Values Tests
templates:
  - templates/keycloak/values.yaml
release:
  name: bb
tests:
  - it: relocates istio/networkPolicies/routes out of defaults and moves domain to global.domain
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-keycloak-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      packages.keycloak.enabled: true
    asserts:
      - isNotNull:
          path: global.domain
      - notExists:
          path: domain
      - notExists:
          path: istio
      - notExists:
          path: routes
      - notExists:
          path: networkPolicies

  - it: nests istio/networkPolicies/routes under bb-common in common and drops library-era istio keys
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-keycloak-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.keycloak.enabled: true
    asserts:
      - isNotNull:
          path: bb-common.routes.inbound.keycloak
      - isNotNull:
          path: bb-common.networkPolicies
      - isNotNull:
          path: bb-common.istio
      - notExists:
          path: bb-common.istio.injection
      - notExists:
          path: bb-common.istio.hardened

  - it: should render http-only route defaults under bb-common when ingress.cert and ingress.key are empty
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-keycloak-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.keycloak.enabled: true
    asserts:
      - equal:
          path: bb-common.routes.inbound.keycloak.port
          value: 8080
      - equal:
          path: bb-common.routes.inbound.keycloak.passthrough.enabled
          value: false

  - it: should render http-only upstream defaults when ingress.cert and ingress.key are empty
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-keycloak-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      packages.keycloak.enabled: true
    asserts:
      - equal:
          path: upstream.proxy.mode
          value: xforwarded
      - equal:
          path: upstream.service.httpPort
          value: 8080
      - matchRegex:
          path: upstream.extraEnv
          pattern: KC_SPI_X509CERT_LOOKUP_PROVIDER
      - notExists:
          path: upstream.secrets
      - notExists:
          path: upstream.extraVolumes

  - it: should render https route defaults under bb-common when ingress.cert and ingress.key are set
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-keycloak-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.keycloak.enabled: true
      packages.keycloak.ingress.cert: "test-cert"
      packages.keycloak.ingress.key: "test-key"
    asserts:
      - equal:
          path: bb-common.routes.inbound.keycloak.port
          value: 8443
      - equal:
          path: bb-common.routes.inbound.keycloak.passthrough.enabled
          value: true

  - it: should render https upstream secrets when ingress.cert and ingress.key are set
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-keycloak-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      packages.keycloak.enabled: true
      packages.keycloak.ingress.cert: "test-cert"
      packages.keycloak.ingress.key: "test-key"
    asserts:
      - isNotNull:
          path: upstream.secrets.tlscert
      - isNotNull:
          path: upstream.secrets.tlskey

  - it: should merge user extraEnv with defaults and let user values override matching names
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-keycloak-values\") | .stringData.defaults' - | yq eval '.upstream.extraEnv' - | yq eval '{\"env\": .}'"
    set:
      packages.keycloak.enabled: true
      packages.keycloak.values:
        upstream:
          extraEnv: |
            - name: KC_LOG_LEVEL
              value: "ALL"
            - name: KC_HOSTNAME_STRICT
              value: "false"
    asserts:
      - contains:
          path: env
          content:
            name: KC_LOG_LEVEL
            value: "ALL"
      - contains:
          path: env
          content:
            name: KC_HOSTNAME_STRICT
            value: "false"
      - contains:
          path: env
          content:
            name: KC_TRUSTSTORE_PATHS
            value: "/etc/ssl/certs/"
