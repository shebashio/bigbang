# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Neuvector - Values Tests
templates:
  - templates/neuvector/values.yaml
tests:
  - it: renders the values Secret with an API version
    asserts:
      - equal:
          path: apiVersion
          value: v1

  - it: nests top-level network policy definitions under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      networkPolicies.egress.definitions:
        kubeAPI:
          to:
            - ipBlock:
                cidr: 10.10.10.10/10
      networkPolicies.ingress.definitions:
        load-balancer-subnets:
          from:
            - ipBlock:
                cidr: 10.10.10.10/10
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.definitions.kubeAPI
          value:
            to:
              - ipBlock:
                  cidr: 10.10.10.10/10
      - equal:
          path: bb-common.networkPolicies.ingress.definitions.load-balancer-subnets
          value:
            from:
              - ipBlock:
                  cidr: 10.10.10.10/10
