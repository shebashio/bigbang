suite: Package - Alloy - Metrics defaults
templates:
- templates/alloy/values.yaml
postRenderer:
  cmd: sh
  args:
  - -c
  - yq eval '.stringData.defaults' - | yq eval '.'
tests:
- it: omits the Prometheus destination when its workload is disabled
  set: &id001
    alloy.alloyMetrics.enabled: true
    addons.mimir.enabled: true
    monitoring.values.upstream.prometheus.enabled: false
  asserts:
  - equal:
      path: upstream.prometheusOperatorObjects.destinations
      value:
      - mimir
  - notExists:
      path: upstream.destinations.prometheus
  - matchRegex:
      path: upstream.collectors.alloy-metrics.extraConfig
      pattern: prometheus.remote_write.mimir.receiver
- it: preserves both built-in destinations when Prometheus and Mimir run
  set:
    alloy.alloyMetrics.enabled: true
    addons.mimir.enabled: true
  asserts:
  - equal:
      path: upstream.prometheusOperatorObjects.destinations
      value:
      - prometheus
      - mimir
  - matchRegex:
      path: upstream.collectors.alloy-metrics.extraConfig
      pattern: prometheus.remote_write.prometheus.receiver
- it: omits exporter scrapes when monitoring is disabled
  set:
    alloy.alloyMetrics.enabled: true
    monitoring.enabled: false
  asserts:
  - notExists:
      path: upstream.collectors.alloy-metrics.extraConfig
- it: preserves exporter egress when the Prometheus workload is disabled
  set: *id001
  postRenderer:
    cmd: sh
    args:
    - -c
    - yq '.stringData.common' - | yq '.'
  asserts:
  - equal:
      path: bb-common.networkPolicies.egress.from.alloy-metrics.to.k8s.monitoring/kube-state-metrics:8080
      value: true
  - equal:
      path: bb-common.networkPolicies.egress.from.alloy-metrics.to.k8s.monitoring/prometheus-node-exporter:9100
      value: true
