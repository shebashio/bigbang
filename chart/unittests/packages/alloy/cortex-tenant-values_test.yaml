# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Alloy - Cortex Tenant values
templates:
  - templates/alloy/values.yaml
postRenderer:
  cmd: sh
  args:
    - -c
    - "yq eval '.stringData.defaults' - | yq eval '.'"
tests:
  - it: sends Alloy metrics through Cortex Tenant without duplicate destinations
    set:
      alloy.alloyMetrics.enabled: true
      alloy.cortexTenant.enabled: true
      alloy.cortexTenant.tenant: cluster-a
      addons.mimir.enabled: true
      monitoring.values.upstream.prometheus.enabled: false
    asserts:
      - equal:
          path: upstream.prometheusOperatorObjects.destinations
          value: [cortex-tenant]
      - equal:
          path: upstream.destinations.cortex-tenant.url
          value: http://cortex-tenant.cortex-tenant.svc.cluster.local:8080/push
      - equal:
          path: upstream.destinations.cortex-tenant.extraLabels.tenant
          value: cluster-a
      - notExists:
          path: upstream.destinations.prometheus
      - notExists:
          path: upstream.destinations.mimir
      - equal:
          path: networkPolicies.egress.from.alloy-metrics.to.k8s.cortex-tenant/cortex-tenant:8080
          value: true
      - equal:
          path: networkPolicies.egress.from.alloy-metrics.to.k8s.monitoring/kube-state-metrics:8080
          value: true
      - equal:
          path: upstream.prometheusOperatorObjects.serviceMonitors.excludeNamespaces
          value: [monitoring]
      - matchRegex:
          path: upstream.collectors.alloy-metrics.extraConfig
          pattern: 'allow_arbitrary_file_access = true'
      - matchRegex:
          path: upstream.collectors.alloy-metrics.extraConfig
          pattern: 'prometheus.remote_write.cortex_tenant.receiver'
  - it: omits Prometheus when its workload is disabled and Cortex Tenant is not selected
    set:
      alloy.alloyMetrics.enabled: true
      addons.mimir.enabled: true
      monitoring.values.upstream.prometheus.enabled: false
    asserts:
      - equal:
          path: upstream.prometheusOperatorObjects.destinations
          value: [mimir]
      - notExists:
          path: upstream.destinations.prometheus
  - it: preserves Prometheus and Mimir destinations for existing deployments
    set:
      alloy.alloyMetrics.enabled: true
      addons.mimir.enabled: true
    asserts:
      - equal:
          path: upstream.prometheusOperatorObjects.destinations
          value: [prometheus, mimir]
      - matchRegex:
          path: upstream.collectors.alloy-metrics.extraConfig
          pattern: 'prometheus.remote_write.prometheus.receiver'
      - matchRegex:
          path: upstream.collectors.alloy-metrics.extraConfig
          pattern: 'prometheus.remote_write.mimir.receiver'
  - it: omits kube-state-metrics egress when monitoring is disabled
    set:
      alloy.alloyMetrics.enabled: true
      monitoring.enabled: false
    asserts:
      - notExists:
          path: networkPolicies.egress.from.alloy-metrics.to.k8s.monitoring/kube-state-metrics:8080
      - notExists:
          path: upstream.prometheusOperatorObjects.serviceMonitors.excludeNamespaces
      - notExists:
          path: upstream.collectors.alloy-metrics.extraConfig
  - it: uses ordinary ServiceMonitor discovery without an Istio sidecar
    set:
      alloy.alloyMetrics.enabled: true
      istiod.enabled: false
    asserts:
      - notExists:
          path: upstream.prometheusOperatorObjects.serviceMonitors.excludeNamespaces
      - notExists:
          path: upstream.collectors.alloy-metrics.extraConfig
