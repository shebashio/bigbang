# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - SonarQube - Istio Annotation Routing
templates:
  - templates/sonarqube/values.yaml
tests:
  - it: should render the istio roll annotation on the upstream pod template
    set:
      packages.sonarqube.enabled: true
      istio.ambient.enabled: true
    asserts:
      - matchRegex:
          path: stringData.defaults
          pattern: '(?s).*bigbang\.dev/istioDataplane: ambient.*'
