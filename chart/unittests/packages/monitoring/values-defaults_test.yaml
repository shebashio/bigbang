# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Monitoring - Values Defaults Tests
templates:
  - templates/monitoring/values.yaml
set:
  packages.monitoring.enabled: true
postRenderer:
  cmd: sh
  args:
    - -c
    - "yq eval '.stringData.defaults' - | yq eval '.'"
tests:
  - it: allows Alloy metrics to scrape kube-state-metrics with Prometheus disabled
    set:
      packages.alloy.alloyMetrics.enabled: true
      packages.monitoring.values.upstream.prometheus.enabled: false
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq eval '.stringData.common' - | yq eval '.'"
    asserts:
      - equal:
          path: bb-common.networkPolicies.ingress.to.kube-state-metrics:8080.from.k8s.alloy/alloy-metrics
          value: true
      - equal:
          path: bb-common.networkPolicies.ingress.to.prometheus-node-exporter:9100.from.k8s.alloy/alloy-metrics
          value: true
  - it: omits Alloy scrape ingress when metrics collection is disabled
    postRenderer:
      cmd: sh
      args:
        - -c
        - "yq eval '.stringData.common' - | yq eval '.'"
    asserts:
      - notExists:
          path: bb-common.networkPolicies.ingress.to.kube-state-metrics:8080
      - notExists:
          path: bb-common.networkPolicies.ingress.to.prometheus-node-exporter:9100
  - it: disables control-plane ServiceMonitors when Prometheus is not deployed
    set:
      packages.monitoring.values.upstream.prometheus.enabled: false
    asserts:
      - equal:
          path: upstream.kubernetesServiceMonitors.enabled
          value: false
  - it: leaves control-plane ServiceMonitors at upstream defaults with Prometheus enabled
    asserts:
      - notExists:
          path: upstream.kubernetesServiceMonitors
  - it: should keep istio cert mounts when legacy package hardening is enabled
    set:
      istio.ambient.enabled: false
      packages.istiod.enabled: true
      packages.monitoring.values.istio.hardened.enabled: true
    asserts:
      - equal:
          path: upstream.prometheus.prometheusSpec.volumeMounts[0].mountPath
          value: /etc/prom-certs/
      - equal:
          path: upstream.prometheus.prometheusSpec.volumes[0].name
          value: istio-certs
      - equal:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig.caFile
          value: /etc/prom-certs/root-cert.pem
      - equal:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]
          value: '[{"name": "istio-certs", "mountPath": "/etc/istio-output-certs"}]'
  - it: should inject istio cert mounts when istiod and namespace injection are enabled
    set:
      istio.ambient.enabled: false
      packages.istiod.enabled: true
    asserts:
      - equal:
          path: upstream.prometheus.prometheusSpec.volumeMounts[0].mountPath
          value: /etc/prom-certs/
      - equal:
          path: upstream.prometheus.prometheusSpec.volumes[0].name
          value: istio-certs
      - equal:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig.caFile
          value: /etc/prom-certs/root-cert.pem
      - equal:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]
          value: '[{"name": "istio-certs", "mountPath": "/etc/istio-output-certs"}]'
  - it: should keep istio cert mounts when sidecar is explicitly enabled and hardened is disabled
    set:
      istio.ambient.enabled: false
      packages.istiod.enabled: true
      packages.istiod.values.hardened.enabled: false
      packages.monitoring.values.bb-common.istio.sidecar.enabled: true
    asserts:
      - equal:
          path: upstream.prometheus.prometheusSpec.volumeMounts[0].mountPath
          value: /etc/prom-certs/
      - equal:
          path: upstream.prometheus.prometheusSpec.volumes[0].name
          value: istio-certs
      - equal:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig.caFile
          value: /etc/prom-certs/root-cert.pem
      - equal:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]
          value: '[{"name": "istio-certs", "mountPath": "/etc/istio-output-certs"}]'
  - it: should not inject sidecar annotations from legacy packages.monitoring.values.istio.injection when istio is disabled
    set:
      packages.istiod.enabled: false
      packages.monitoring.values.istio.injection: enabled
    asserts:
      - notExists:
          path: upstream.prometheus.prometheusSpec.volumeMounts[0].mountPath
      - notExists:
          path: upstream.prometheus.prometheusSpec.volumes[0].name
      - notExists:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig.caFile
      - notExists:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]
  - it: should not inject istio cert mounts when istiod is disabled
    set:
      packages.istiod.enabled: false
    asserts:
      - notExists:
          path: upstream.prometheus.prometheusSpec.volumeMounts[0].mountPath
      - notExists:
          path: upstream.prometheus.prometheusSpec.volumes[0].name
      - notExists:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig.caFile
      - notExists:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]
  - it: should prioritize prometheusOperatorCRDs namespace injection over grafana when CRDs own monitoring namespace
    set:
      istio.ambient.enabled: false
      packages.istiod.enabled: true
      packages.prometheusOperatorCRDs.enabled: true
      packages.grafana.enabled: true
      packages.grafana.istio.injection: disabled
    asserts:
      - equal:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig.caFile
          value: /etc/prom-certs/root-cert.pem
      - equal:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]
          value: '[{"name": "istio-certs", "mountPath": "/etc/istio-output-certs"}]'
  - it: should use grafana namespace injection when prometheusOperatorCRDs is disabled
    set:
      packages.istiod.enabled: true
      packages.prometheusOperatorCRDs.enabled: false
      packages.grafana.enabled: true
      packages.grafana.istio.injection: disabled
    asserts:
      - notExists:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig.caFile
      - notExists:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]

  - it: carries the global domain without flat bb-common configuration
    set:
      domain: example.test
    asserts:
      - equal:
          path: global.domain
          value: example.test
      - notExists:
          path: domain
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
      - notExists:
          path: routes
      - notExists:
          path: bb-common
  - it: respects nested permissive mTLS overrides
    set:
      packages.istiod.enabled: true
      packages.monitoring.values.bb-common.istio.mtls.mode: PERMISSIVE
    asserts:
      - notExists:
          path: upstream.prometheus.prometheusSpec.alertingEndpoints[0].tlsConfig
  - it: omits sidecar cert mounts in ambient mode
    set:
      packages.istiod.enabled: true
      istio.ambient.enabled: true
    asserts:
      - notExists:
          path: upstream.prometheus.prometheusSpec.volumeMounts
      - notExists:
          path: upstream.prometheus.prometheusSpec.podMetadata.annotations["sidecar.istio.io/userVolumeMount"]

  - it: enrolls ambient SSO services on the bb-common waypoint
    set:
      packages.istiod.enabled: true
      istio.ambient.enabled: true
      packages.monitoring.sso.enabled: true
    asserts:
      - equal:
          path: upstream.prometheus.service.labels["istio.io/use-waypoint"]
          value: monitoring-monitoring-waypoint
      - equal:
          path: upstream.alertmanager.service.labels["istio.io/use-waypoint"]
          value: monitoring-monitoring-waypoint
