# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Packages - cert-manager - Namespace Tests
templates:
  - templates/cert-manager/namespace.yaml
tests:
  - it: keeps cert-manager outside Istio injection and ambient enrollment
    set:
      packages.certManager.enabled: true
      packages.certManager.namespace.annotations.review-test: expected
      packages.istiod.enabled: true
      istio.ambient.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["review-test"]
          value: expected
      - equal:
          path: metadata.labels["istio-injection"]
          value: disabled
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: none

  - it: keeps cert-manager outside Istio injection in sidecar mode
    set:
      packages.certManager.enabled: true
      packages.istiod.enabled: true
      istio.ambient.enabled: false
    asserts:
      - equal:
          path: metadata.labels["istio-injection"]
          value: disabled
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: none
