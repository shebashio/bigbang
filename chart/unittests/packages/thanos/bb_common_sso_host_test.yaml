# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Thanos bb-common independent SSO defaults
templates:
  - templates/authservice/values.yaml
tests:
- it: does not derive Authservice defaults from route hosts
  set:
    packages:
      thanos:
        enabled: true
        sso:
          enabled: true
        values:
          bb-common:
            routes:
              inbound:
                query-frontend:
                  hosts:
                  - thanos.custom.example.test
  template: authservice/values.yaml
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: "prefix: thanos.dev.bigbang.mil"
  - matchRegex:
      path: stringData.defaults
      pattern: "callback_uri: https://thanos.dev.bigbang.mil/login/generic_oauth"
