# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Thanos Authservice route host
templates:
  - templates/authservice/values.yaml
tests:
- it: uses the default host
  set:
    packages.thanos.enabled: true
    packages.thanos.sso.enabled: true
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: 'prefix: thanos.dev.bigbang.mil'
  - matchRegex:
      path: stringData.defaults
      pattern: 'callback_uri: https://thanos.dev.bigbang.mil/login/generic_oauth'
- it: uses the first configured route host
  set:
    packages.thanos.enabled: true
    packages.thanos.sso.enabled: true
    packages.thanos.values.bb-common.routes.inbound.query-frontend.hosts:
    - first.example.test
    - second.example.test
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: 'prefix: first.example.test'
  - matchRegex:
      path: stringData.defaults
      pattern: 'callback_uri: https://first.example.test/login/generic_oauth'
- it: falls back to a safe host for a wildcard route
  set:
    packages.thanos.enabled: true
    packages.thanos.sso.enabled: true
    packages.thanos.values.bb-common.routes.inbound.query-frontend.hosts: ['*.example.test']
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: 'prefix: thanos.dev.bigbang.mil'
  - matchRegex:
      path: stringData.defaults
      pattern: 'callback_uri: https://thanos.dev.bigbang.mil/login/generic_oauth'
- it: preserves an explicit chain
  set:
    packages.thanos.enabled: true
    packages.thanos.sso.enabled: true
    packages.thanos.values.bb-common.routes.inbound.query-frontend.hosts: ['*.example.test']
    packages.authservice.chains.thanos.match.prefix: explicit.example.test
    packages.authservice.chains.thanos.callback_uri: https://explicit.example.test/callback
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: 'prefix: explicit.example.test'
  - matchRegex:
      path: stringData.defaults
      pattern: 'callback_uri: https://explicit.example.test/callback'
- it: falls back for an empty host list
  set:
    packages.thanos.enabled: true
    packages.thanos.sso.enabled: true
    packages.thanos.values.bb-common.routes.inbound.query-frontend.hosts: []
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: 'prefix: thanos.dev.bigbang.mil'
- it: falls back for null intermediate route values
  set:
    packages.thanos.enabled: true
    packages.thanos.sso.enabled: true
    packages.thanos.values.bb-common.routes: null
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: 'prefix: thanos.dev.bigbang.mil'
