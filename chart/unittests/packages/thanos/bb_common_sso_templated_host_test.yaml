# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Authservice Thanos templated SSO host
tests:
- it: falls back to the umbrella domain for a templated host
  set:
    domain: custom.example.test
    packages:
      istiod:
        enabled: true
      authservice:
        enabled: false
      thanos:
        enabled: true
        sso:
          enabled: true
        values:
          global:
            domain: package.example.test
          externalURL: https://external.example.test
          bb-common:
            routes:
              inbound:
                query-frontend:
                  hosts:
                  - 'metrics.{{ .Values.global.domain }}'
  template: authservice/values.yaml
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: 'prefix: thanos.custom.example.test'
  - matchRegex:
      path: stringData.defaults
      pattern: 'callback_uri: https://thanos.custom.example.test/login/generic_oauth'
