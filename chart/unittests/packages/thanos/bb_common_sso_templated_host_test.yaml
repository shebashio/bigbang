# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Authservice Thanos templated SSO host
tests:
- it: templates nested Thanos SSO host for both prefix and callback
  set:
    packages:
      istiod:
        enabled: true
      authservice:
        enabled: false
      thanos:
        enabled: true
        sso:
          enabled: true
        values:
          bb-common:
            istio:
              thanos:
                hosts:
                - 'thanos.{{ .Values.domain }}'
  template: authservice/values.yaml
  asserts:
  - matchRegex:
      path: stringData.defaults
      pattern: "prefix: thanos.dev.bigbang.mil"
  - matchRegex:
      path: stringData.defaults
      pattern: "callback_uri: https://thanos.dev.bigbang.mil/login/generic_oauth"
