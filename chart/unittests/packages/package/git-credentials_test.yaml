# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Packages - Package - Git Credentials Tests
templates:
  - templates/package/git-credentials.yaml
release:
  name: test
  namespace: bigbang
set:
  packages:
    sample:
      enabled: true
      sourceType: git
      namespace:
        name: sample-workload
      git:
        repo: https://example.com/sample.git
        path: chart
        tag: 1.0.0
        credentials:
          username: test-user
          password: test-password
tests:
  - it: should render credentials in the package namespace by default
    asserts:
      - equal:
          path: metadata.namespace
          value: sample-workload

  - it: should render credentials in the HelmRelease namespace when overridden
    set:
      packages.sample.helmRelease.namespace: custom-flux
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-flux
