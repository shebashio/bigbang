# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Packages - GitLab CI External Dependencies
templates:
  - templates/helm-repository/helmrepo.yaml
  - templates/package/helmrelease.yaml
  - templates/package/namespace.yaml
  - templates/package/values.yaml
  - templates/wrapper/helmrelease.yaml
  - templates/wrapper/values.yaml
  - templates/gitlab/gitrepository.yaml
  - templates/gitlab/helmrelease.yaml
  - templates/gitlab/secret-objectstore.yaml
  - templates/gitlab/values.yaml
values:
  - ../../../../tests/test-values.yaml
tests:
  - it: points GitLab at the guarded Path 2 package candidate branch
    template: gitlab/gitrepository.yaml
    documentSelector:
      path: metadata.name
      value: gitlab
    asserts:
      - equal:
          path: spec.ref.branch
          value: gitlab-19-external-ci-dependencies
      - notExists:
          path: spec.ref.tag

  - it: renders the public CloudNativePG cluster HelmRepository without credentials
    template: helm-repository/helmrepo.yaml
    documentSelector:
      path: metadata.name
      value: cloudnative-pg
    asserts:
      - isKind:
          of: HelmRepository
      - equal:
          path: spec.url
          value: https://cloudnative-pg.github.io/charts
      - notExists:
          path: spec.secretRef

  - it: retains the Registry1 HelmRepository required by Big Bang CI
    template: helm-repository/helmrepo.yaml
    documentSelector:
      path: metadata.name
      value: registry1
    asserts:
      - isKind:
          of: HelmRepository
      - equal:
          path: spec.url
          value: oci://registry1.dso.mil/bigbang
      - equal:
          path: spec.secretRef.name
          value: private-registry

  - it: gates the PostgreSQL Cluster release on its operator and bootstrap wrapper
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: gitlab-postgresql
    asserts:
      - isKind:
          of: HelmRelease
      - equal:
          path: spec.targetNamespace
          value: gitlab-dependencies
      - equal:
          path: spec.chart.spec.chart
          value: cluster
      - equal:
          path: spec.chart.spec.version
          value: 0.8.1
      - equal:
          path: spec.test.enable
          value: true
      - contains:
          path: spec.dependsOn
          content:
            name: cloudnative-pg
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: gitlab-postgresql-wrapper
            namespace: bigbang
      - matchRegex:
          path: spec.postRenderers[0].kustomize.patches[0].patch
          pattern: registry1.dso.mil/ironbank/opensource/postgres/postgresql:17.10

  - it: deploys Redis and Garage independently in the shared dependency namespace
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: gitlab-redis
    asserts:
      - equal:
          path: spec.targetNamespace
          value: gitlab-dependencies
      - equal:
          path: spec.releaseName
          value: gitlab-redis

  - it: deploys Garage independently in the shared dependency namespace
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: gitlab-garage
    asserts:
      - equal:
          path: spec.targetNamespace
          value: gitlab-dependencies
      - equal:
          path: spec.releaseName
          value: gitlab-garage
      - equal:
          path: spec.postRenderers[0].kustomize.patches[0].target.name
          value: ^gitlab-garage-garage-init$
      - matchRegex:
          path: spec.postRenderers[0].kustomize.patches[0].patch
          pattern: /spec/ttlSecondsAfterFinished
      - matchRegex:
          path: spec.postRenderers[0].kustomize.patches[0].patch
          pattern: /metadata/annotations

  - it: keeps the sidecar CI dependency namespaces unmeshed
    template: package/namespace.yaml
    documentSelector:
      path: metadata.name
      value: gitlab-dependencies
    asserts:
      - equal:
          path: metadata.labels.istio-injection
          value: disabled
      - notExists:
          path: metadata.labels["istio.io/dataplane-mode"]

  - it: keeps the CloudNativePG operator namespace unmeshed in sidecar CI
    template: package/namespace.yaml
    documentSelector:
      path: metadata.name
      value: cloudnative-pg
    asserts:
      - equal:
          path: metadata.labels.istio-injection
          value: disabled
      - notExists:
          path: metadata.labels["istio.io/dataplane-mode"]

  - it: orders the unmeshed CloudNativePG operator after Istio is ready
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: cloudnative-pg
    asserts:
      - contains:
          path: spec.dependsOn
          content:
            name: istiod
            namespace: bigbang

  - it: disables sidecar mesh resources for Garage while retaining its NetworkPolicies
    template: package/values.yaml
    documentSelector:
      path: metadata.name
      value: gitlab-garage-values
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "mode: PERMISSIVE"
      - notMatchRegex:
          path: stringData["values.yaml"]
          pattern: "mode: STRICT|REGISTRY_ONLY"
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?s)networkPolicies:.*enabled: true.*ingress:"

  - it: supplies the database name required by the official cluster ping test
    template: wrapper/values.yaml
    documentSelector:
      path: metadata.name
      value: gitlab-postgresql-wrapper-values
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "dbname: gitlabhq_production"

  - it: renders a literal all-pods egress policy for the external dependencies
    template: gitlab/values.yaml
    asserts:
      - matchRegex:
          path: stringData.common
          pattern: "(?s)name: allow-external-dependencies.*podSelector: \\{\\}"
      - matchRegex:
          path: stringData.common
          pattern: "kubernetes.io/metadata.name: gitlab-dependencies"
      - notMatchRegex:
          path: stringData.common
          pattern: "app.kubernetes.io/name: gitlab-external-dependencies"

  - it: configures path-style s3cmd backups against the Garage service
    template: gitlab/secret-objectstore.yaml
    asserts:
      - matchRegex:
          path: stringData.backups
          pattern: "host_base = gitlab-garage.gitlab-dependencies.svc.cluster.local:3900"
      - matchRegex:
          path: stringData.backups
          pattern: "host_bucket = gitlab-garage.gitlab-dependencies.svc.cluster.local:3900"
      - matchRegex:
          path: stringData.backups
          pattern: "use_https = False"
      - notMatchRegex:
          path: stringData.backups
          pattern: "%\\(bucket\\)s\\.gitlab-garage"

  - it: gates GitLab on every external CI dependency release
    template: gitlab/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: gitlab
    asserts:
      - contains:
          path: spec.dependsOn
          content:
            name: cloudnative-pg
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: gitlab-postgresql
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: gitlab-redis
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: gitlab-garage
            namespace: bigbang
