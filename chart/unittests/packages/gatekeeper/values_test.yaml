# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Gatekeeper - Values Tests
templates:
  - templates/gatekeeper/values.yaml
tests:
  - it: should include default kubeAPI ingress definition
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      gatekeeper.enabled: true
      networkPolicies.enabled: true
    asserts:
      - isNotNull:
          path: networkPolicies.ingress.definitions.kubeAPI
      - equal:
          path: networkPolicies.ingress.definitions.kubeAPI.from[0].ipBlock.cidr
          value: "192.168.0.0/16"
      - equal:
          path: networkPolicies.ingress.definitions.kubeAPI.from[1].ipBlock.cidr
          value: "172.16.0.0/12"
      - equal:
          path: networkPolicies.ingress.definitions.kubeAPI.from[2].ipBlock.cidr
          value: "10.0.0.0/8"

  - it: should use custom kubeAPI ingress definition when overridden
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      gatekeeper.enabled: true
      networkPolicies.enabled: true
      networkPolicies.ingress.definitions.kubeAPI:
        from:
          - ipBlock:
              cidr: "10.10.0.0/16"
    asserts:
      - isNotNull:
          path: networkPolicies.ingress.definitions.kubeAPI
      - equal:
          path: networkPolicies.ingress.definitions.kubeAPI.from[0].ipBlock.cidr
          value: "10.10.0.0/16"

  - it: should include ztunnel policy exclusions when ztunnel is installed standalone
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      gatekeeper.enabled: true
      monitoring.enabled: false
      ztunnel.enabled: true
    asserts:
      - contains:
          path: violations.allowedHostFilesystem.parameters.excludedResources
          content: istio-system/ztunnel-.*
      - contains:
          path: violations.restrictedTaint.parameters.excludedResources
          content: istio-system/ztunnel-.*
      - contains:
          path: violations.volumeTypes.parameters.excludedResources
          content: istio-system/ztunnel-.*

  - it: should include the Podinfo curl registry exclusion when Podinfo is enabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      gatekeeper.enabled: true
      packages:
        podinfo:
          enabled: true
          sourceType: git
          git:
            repo: https://github.com/stefanprodan/podinfo.git
            tag: "6.14.0"
    asserts:
      - contains:
          path: violations.allowedDockerRegistries.parameters.excludedResources
          content: podinfo/curl

  - it: should not include the Podinfo curl registry exclusion when Podinfo is disabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      gatekeeper.enabled: true
    asserts:
      - notExists:
          path: violations.allowedDockerRegistries.parameters.excludedResources
