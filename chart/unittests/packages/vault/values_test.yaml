# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Vault - Values Tests
templates:
  - templates/vault/values.yaml
release:
  name: bb
tests:
  - it: should use the public gateway when ingress cert and key are empty
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-vault-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.vault.enabled: true
    asserts:
      - equal:
          path: bb-common.routes.inbound.vault.gateways[0]
          value: istio-gateway/public-ingressgateway
      - equal:
          path: bb-common.routes.inbound.vault.passthrough.enabled
          value: false
      - equal:
          path: bb-common.networkPolicies.egress.from.vault-autoinit.to.k8s["istio-gateway/public-ingressgateway:8443"]
          value: true

  - it: should disable TLS in the package defaults when ingress cert and key are empty
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-vault-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      packages.vault.enabled: true
    asserts:
      - equal:
          path: upstream.global.tlsDisable
          value: true
      - notExists:
          path: upstream.server.volumes

  - it: should use the passthrough gateway when ingress cert and key are set
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-vault-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.vault.enabled: true
      packages.vault.ingress.cert: test-cert
      packages.vault.ingress.key: test-key
    asserts:
      - equal:
          path: bb-common.routes.inbound.vault.gateways[0]
          value: istio-gateway/passthrough-ingressgateway
      - equal:
          path: bb-common.routes.inbound.vault.passthrough.enabled
          value: true
      - equal:
          path: bb-common.networkPolicies.egress.from.vault-autoinit.to.k8s["istio-gateway/passthrough-ingressgateway:8200"]
          value: true

  - it: should mount the TLS secret in the package defaults when ingress cert and key are set
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-vault-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      packages.vault.enabled: true
      packages.vault.ingress.cert: test-cert
      packages.vault.ingress.key: test-key
    asserts:
      - equal:
          path: upstream.global.tlsDisable
          value: false
      - contains:
          path: upstream.server.volumes
          content:
            name: tls
            secret:
              secretName: vault-tls
      - contains:
          path: upstream.server.volumeMounts
          content:
            name: tls
            mountPath: /vault/tls
            readOnly: true

  - it: should read the passthrough gatewayPort override from the bb-common values
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-vault-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.vault.enabled: true
      packages.vault.ingress.gateway: passthrough
      packages.vault.values.bb-common.routes.inbound.vault.passthrough.gatewayPort: 9443
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.from.vault-autoinit.to.k8s["istio-gateway/passthrough-ingressgateway:9443"]
          value: true

  - it: should enable the kubeAPI and kms egress definitions for Vault
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-vault-values\") | .stringData.common' - | yq eval '.'"
    set:
      packages.vault.enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.from.vault.to.definition.kubeAPI
          value: true
      - equal:
          path: bb-common.networkPolicies.egress.from.vault.to.definition.kms
          value: true

  - it: should move istio, routes and networkPolicies out of the defaults and set global.domain
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-vault-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      packages.vault.enabled: true
    asserts:
      - isNotNull:
          path: global.domain
      - notExists:
          path: domain
      - notExists:
          path: istio
      - notExists:
          path: routes
      - notExists:
          path: networkPolicies
