# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Elasticsearch-Kibana - Values Overlays Tests
templates:
  - templates/elasticsearch-kibana/values.yaml
set:
  packages.elasticsearchKibana.enabled: true
postRenderer:
  cmd: "sh"
  args:
    - "-c"
    - "yq eval '.stringData.overlays' - | yq eval '.'"
tests:
  - it: should pass bb-common istio custom serviceEntries and authorizationPolicies through unchanged
    set:
      packages.elasticsearchKibana.values.bb-common.istio.serviceEntries.custom:
        - name: "custom-entry"
          spec:
            hosts:
              - "custom.example.com"
      packages.elasticsearchKibana.values.bb-common.istio.authorizationPolicies.custom:
        - name: "test-authz-policy"
          labels:
            app: "elasticsearch-kibana"
    asserts:
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].name
          value: "custom-entry"
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].spec.hosts[0]
          value: "custom.example.com"
      - equal:
          path: bb-common.istio.authorizationPolicies.custom[0].name
          value: "test-authz-policy"
