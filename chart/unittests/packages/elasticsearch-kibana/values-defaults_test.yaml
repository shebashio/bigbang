# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Elasticsearch-Kibana - Values Defaults Tests
templates:
  - templates/elasticsearch-kibana/values.yaml
set:
  packages.elasticsearchKibana.enabled: true
tests:
  - it: sets global.domain in the defaults block
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    asserts:
      - equal:
          path: global.domain
          value: "dev.bigbang.mil"

  - it: nests istio.enabled under bb-common in common when istio is enabled
    set:
      packages.istiod.enabled: true
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    asserts:
      - equal:
          path: bb-common.istio.enabled
          value: true

  - it: defaults the kibana inbound route host to kibana.<domain> under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    asserts:
      - equal:
          path: bb-common.routes.inbound.kibana.hosts[0]
          value: "kibana.dev.bigbang.mil"

  - it: defaults the elasticsearch inbound route host to elasticsearch.<domain> under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    asserts:
      - equal:
          path: bb-common.routes.inbound.elasticsearch.hosts[0]
          value: "elasticsearch.dev.bigbang.mil"

  - it: defaults the kibana inbound route to enabled under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    asserts:
      - equal:
          path: bb-common.routes.inbound.kibana.enabled
          value: true

  - it: defaults the elasticsearch inbound route to disabled under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    asserts:
      - equal:
          path: bb-common.routes.inbound.elasticsearch.enabled
          value: false
