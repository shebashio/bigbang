# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Twistlock - Values Tests
templates:
  - templates/twistlock/values.yaml
tests:
  - it: uses the top-level definitions if they're set
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.twistlock.enabled: true
      networkPolicies.egress.definitions:
        kubeAPI:
          to:
            - ipBlock:
                cidr: 10.10.10.10/10
      networkPolicies.ingress.definitions:
        nodeCidrs:
          from:
            - ipBlock:
                cidr: 10.10.10.30/30
        load-balancer-subnets:
          from:
            - ipBlock:
                cidr: 10.10.10.10/10
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.definitions.kubeAPI
          value:
            to:
              - ipBlock:
                  cidr: 10.10.10.10/10
      - equal:
          path: bb-common.networkPolicies.ingress.definitions.nodeCidrs
          value:
            from:
              - ipBlock:
                  cidr: 10.10.10.30/30
      - equal:
          path: bb-common.networkPolicies.ingress.definitions.load-balancer-subnets
          value:
            from:
              - ipBlock:
                  cidr: 10.10.10.10/10

  - it: nests istio, networkPolicies, and routes under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.twistlock.enabled: true
    asserts:
      - exists:
          path: bb-common.istio
      - notExists:
          path: bb-common.istio.injection
      - equal:
          path: bb-common.routes.inbound.console.enabled
          value: true
      - equal:
          path: bb-common.routes.inbound.console.gateways
          value:
            - istio-gateway/public-ingressgateway
      - notExists:
          path: bb-common.routes.inbound.console.port
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
      - notExists:
          path: routes

  - it: moves domain to global and drops flat bb-common keys from defaults
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.twistlock.enabled: true
    asserts:
      - equal:
          path: global.domain
          value: dev.bigbang.mil
      - notExists:
          path: domain
      - notExists:
          path: istio
      - notExists:
          path: networkPolicies
      - notExists:
          path: routes
      - notExists:
          path: bb-common

  - it: points the console route at the HTTPS management port when backendTLS is on
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.twistlock.enabled: true
      packages.twistlock.values.console.backendTLS: true
    asserts:
      - equal:
          path: bb-common.routes.inbound.console.port
          value: 8083

  - it: follows a custom HTTPS management port when backendTLS is on
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.twistlock.enabled: true
      packages.twistlock.values.console.backendTLS: true
      packages.twistlock.values.console.ports.managementHttps: 9443
    asserts:
      - equal:
          path: bb-common.routes.inbound.console.port
          value: 9443

  - it: disables the console route and network policies in defender-only mode
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.twistlock.enabled: true
      packages.twistlock.values.deploymentMode.defenderOnly: true
    asserts:
      - equal:
          path: bb-common.routes.inbound.console.enabled
          value: false
      - equal:
          path: bb-common.networkPolicies.enabled
          value: false

  - it: allows egress to tempo under the wildcard selector when tempo is enabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.twistlock.enabled: true
      packages.tempo.enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.from["*"].to.k8s["tempo/tempo:9411"]
          value: true
