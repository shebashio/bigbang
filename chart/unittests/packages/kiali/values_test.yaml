# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Kiali - Values Tests
templates:
  - templates/kiali/values.yaml
tests:
  - it: make assertions on the default values for Kiali
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '(.stringData.common | from_yaml) * (.stringData.defaults | from_yaml)' -"
    asserts:
      - equal:
          path: domain
          value: "dev.bigbang.mil"
      - equal:
          path: bb-common.istio.enabled
          value: true
  - it: should pass custom service entries under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.kiali.values.bb-common.istio.serviceEntries.custom:
        - name: "test-service-entry"
          hosts:
            - "example.com"
    asserts:
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].name
          value: "test-service-entry"
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].hosts[0]
          value: "example.com"
  - it: should pass custom authorization policies under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.kiali.values.bb-common.istio.authorizationPolicies.custom:
        - name: "test-authz-policy"
          labels:
            app: "kiali"
    asserts:
      - equal:
          path: bb-common.istio.authorizationPolicies.custom[0].name
          value: "test-authz-policy"
      - equal:
          path: bb-common.istio.authorizationPolicies.custom[0].labels.app
          value: "kiali"
  - it: should pass multiple custom service entries under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.kiali.values.bb-common.istio.serviceEntries.custom:
        - name: "hardened-entry"
          spec:
            hosts:
              - "hardened.example.com"
        - name: "custom-entry"
          spec:
            hosts:
              - "custom.example.com"
    asserts:
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].name
          value: "hardened-entry"
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].spec.hosts[0]
          value: "hardened.example.com"
      - equal:
          path: bb-common.istio.serviceEntries.custom[1].name
          value: "custom-entry"
      - equal:
          path: bb-common.istio.serviceEntries.custom[1].spec.hosts[0]
          value: "custom.example.com"
