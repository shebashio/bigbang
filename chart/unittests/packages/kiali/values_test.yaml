# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Kiali - Values Tests
templates:
  - templates/kiali/values.yaml
tests:
  - it: should nest integration values under bb-common and use global.domain
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '{\"common\": (.stringData.common | from_yaml), \"defaults\": (.stringData.defaults | from_yaml)}' -"
    asserts:
      - equal:
          path: defaults.global.domain
          value: "dev.bigbang.mil"
      - equal:
          path: common.bb-common.istio.enabled
          value: true
      - isNotNull:
          path: common.bb-common.networkPolicies
      - isNotNull:
          path: common.bb-common.routes.inbound.kiali
      - notExists:
          path: common.bb-common.istio.injection
      - notExists:
          path: common.istio
      - notExists:
          path: common.networkPolicies
      - notExists:
          path: common.routes
      - notExists:
          path: defaults.domain
      - notExists:
          path: defaults.bb-common
  - it: should pass custom service entries under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.kiali.values.bb-common.istio.serviceEntries.custom:
        - name: "test-service-entry"
          hosts:
            - "example.com"
    asserts:
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].name
          value: "test-service-entry"
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].hosts[0]
          value: "example.com"
  - it: should pass custom authorization policies under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.kiali.values.bb-common.istio.authorizationPolicies.custom:
        - name: "test-authz-policy"
          labels:
            app: "kiali"
    asserts:
      - equal:
          path: bb-common.istio.authorizationPolicies.custom[0].name
          value: "test-authz-policy"
      - equal:
          path: bb-common.istio.authorizationPolicies.custom[0].labels.app
          value: "kiali"
  - it: should pass multiple custom service entries under bb-common
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.overlays' - | yq eval '.'"
    set:
      packages.kiali.values.bb-common.istio.serviceEntries.custom:
        - name: "first-entry"
          spec:
            hosts:
              - "first.example.com"
        - name: "second-entry"
          spec:
            hosts:
              - "second.example.com"
    asserts:
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].name
          value: "first-entry"
      - equal:
          path: bb-common.istio.serviceEntries.custom[0].spec.hosts[0]
          value: "first.example.com"
      - equal:
          path: bb-common.istio.serviceEntries.custom[1].name
          value: "second-entry"
      - equal:
          path: bb-common.istio.serviceEntries.custom[1].spec.hosts[0]
          value: "second.example.com"
