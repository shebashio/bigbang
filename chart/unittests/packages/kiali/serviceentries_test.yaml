# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Kiali - ServiceEntries
postRenderer:
  cmd: sh
  args:
    - -c
    - |
      set -o pipefail && \
      yq 'select(.metadata.name == "*kiali*")' \
        | BASH_ENV="" $(git rev-parse --show-toplevel)/scripts/template-all.sh \
        | yq 'select(.kind == "ServiceEntry")'
tests:
- it: should create a TLS ServiceEntry from kiali.values.bb-common.istio.serviceEntries.custom
  set:
    packages.istiod.enabled: true
    packages.kiali.enabled: true
    packages.kiali.values.bb-common.istio.enabled: true
    packages.kiali.values.bb-common.istio.serviceEntries.custom:
      - name: "test-tls-service-entry"
        spec:
          hosts:
            - "example.com"
          location: MESH_EXTERNAL
          ports:
            - number: 443
              name: https
              protocol: TLS
          resolution: DNS
  documentSelector:
    path: metadata.name
    value: test-tls-service-entry
  asserts:
  - equal:
      path: kind
      value: ServiceEntry
  - equal:
      path: metadata.name
      value: test-tls-service-entry
  - equal:
      path: spec
      value:
        hosts:
          - "example.com"
        location: MESH_EXTERNAL
        ports:
          - number: 443
            name: https
            protocol: TLS
        resolution: DNS
- it: should create an HTTPS ServiceEntry from kiali.values.bb-common.istio.serviceEntries.custom
  set:
    packages.istiod.enabled: true
    packages.kiali.enabled: true
    packages.kiali.values.bb-common.istio.enabled: true
    packages.kiali.values.bb-common.istio.serviceEntries.custom:
      - name: "test-istio-service-entry"
        spec:
          hosts:
            - "api.external.com"
          location: MESH_EXTERNAL
          ports:
            - number: 8443
              name: https
              protocol: HTTPS
          resolution: DNS
  documentSelector:
    path: metadata.name
    value: test-istio-service-entry
  asserts:
  - equal:
      path: kind
      value: ServiceEntry
  - equal:
      path: metadata.name
      value: test-istio-service-entry
  - equal:
      path: spec
      value:
        hosts:
          - "api.external.com"
        location: MESH_EXTERNAL
        ports:
          - number: 8443
            name: https
            protocol: HTTPS
        resolution: DNS
- it: should create multiple ServiceEntries from bb-common configuration
  set:
    packages.istiod.enabled: true
    packages.kiali.enabled: true
    packages.kiali.values.bb-common.istio.enabled: true
    packages.kiali.values.bb-common.routes.inbound.kiali.enabled: false # The route creates a service entry too if it's enabled; disable it for this test
    packages.kiali.values.bb-common.routes.outbound.bb-tests.enabled: false # Manually disable templated route for test
    packages.kiali.values.bb-common.routes.outbound.grafana.enabled: false # Manually disable templated route for test
    packages.kiali.values.bb-common.routes.outbound.sso.enabled: false # Manually disable templated route for test
    packages.kiali.values.bb-common.istio.serviceEntries.custom:
      - name: "service-entry-1"
        spec:
          hosts:
            - "service1.example.com"
          location: MESH_EXTERNAL
          resolution: DNS
      - name: "service-entry-2"
        spec:
          hosts:
            - "service2.example.com"
          location: MESH_EXTERNAL
          resolution: DNS
      - name: "service-entry-3"
        spec:
          hosts:
            - "service3.example.com"
          location: MESH_EXTERNAL
          resolution: DNS
  asserts:
  - hasDocuments:
      count: 3
  - documentIndex: 0
    equal:
      path: metadata.name
      value: service-entry-1
  - documentIndex: 1
    equal:
      path: metadata.name
      value: service-entry-2
  - documentIndex: 2
    equal:
      path: metadata.name
      value: service-entry-3
