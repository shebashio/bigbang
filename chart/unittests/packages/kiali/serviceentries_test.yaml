# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Kiali - ServiceEntries
postRenderer:
  cmd: sh
  args:
    - -c
    - |
      set -o pipefail && \
      yq 'select(.metadata.name == "*kiali*")' \
        | BASH_ENV="" $(git rev-parse --show-toplevel)/scripts/template-all.sh \
        | yq 'select(.kind == "ServiceEntry")'
tests:
- it: should create ServiceEntry from kiali.values.istio.hardened.customServiceEntries
  set:
    istiod.enabled: true
    kiali.enabled: true
    kiali.values.istio.enabled: true
    kiali.values.istio.hardened.customServiceEntries:
      - name: "test-hardened-service-entry"
        spec:
          hosts:
            - "example.com"
          location: MESH_EXTERNAL
          ports:
            - number: 443
              name: https
              protocol: TLS
          resolution: DNS
  documentSelector:
    path: metadata.name
    value: test-hardened-service-entry
  asserts:
  - equal:
      path: kind
      value: ServiceEntry
  - equal:
      path: metadata.name
      value: test-hardened-service-entry
  - equal:
      path: spec
      value:
        hosts:
          - "example.com"
        location: MESH_EXTERNAL
        ports:
          - number: 443
            name: https
            protocol: TLS
        resolution: DNS
- it: should create ServiceEntry from kiali.values.istio.serviceEntries.custom
  set:
    istiod.enabled: true
    kiali.enabled: true
    kiali.values.istio.enabled: true
    kiali.values.istio.serviceEntries.custom:
      - name: "test-istio-service-entry"
        spec:
          hosts:
            - "api.external.com"
          location: MESH_EXTERNAL
          ports:
            - number: 8443
              name: https
              protocol: HTTPS
          resolution: DNS
  documentSelector:
    path: metadata.name
    value: test-istio-service-entry
  asserts:
  - equal:
      path: kind
      value: ServiceEntry
  - equal:
      path: metadata.name
      value: test-istio-service-entry
  - equal:
      path: spec
      value:
        hosts:
          - "api.external.com"
        location: MESH_EXTERNAL
        ports:
          - number: 8443
            name: https
            protocol: HTTPS
        resolution: DNS
- it: should create the sso outbound ServiceEntry for an external IdP
  set:
    istiod.enabled: true
    kiali.enabled: true
    kiali.values.istio.enabled: true
    kiali.sso.enabled: true
    domain: dev.bigbang.mil
    addons.keycloak.enabled: false
    sso.url: https://login.dso.mil/auth/realms/baby-yoda
    kiali.values.routes.inbound.kiali.enabled: false
    kiali.values.routes.outbound.bb-tests.enabled: false
  asserts:
  - hasDocuments:
      count: 1
  - documentIndex: 0
    equal:
      path: spec.hosts[0]
      value: login.dso.mil
- it: should not create the sso outbound ServiceEntry when the sso host is in-cluster keycloak
  set:
    istiod.enabled: true
    kiali.enabled: true
    kiali.values.istio.enabled: true
    kiali.sso.enabled: true
    domain: dev.bigbang.mil
    addons.keycloak.enabled: true
    sso.url: https://keycloak.dev.bigbang.mil/auth/realms/baby-yoda
    kiali.values.routes.inbound.kiali.enabled: false
    kiali.values.routes.outbound.bb-tests.enabled: false
  asserts:
  - hasDocuments:
      count: 0
- it: should merge ServiceEntries from both hardened and istio configurations
  set:
    istiod.enabled: true
    kiali.enabled: true
    kiali.values.istio.enabled: true
    kiali.values.routes.inbound.kiali.enabled: false # The route creates a service entry too if it's enabled; disable it for this test
    kiali.values.routes.outbound.bb-tests.enabled: false # Manually disable templated route for test
    kiali.values.routes.outbound.sso.enabled: false # Manually disable templated route for test
    kiali.values.istio.hardened.customServiceEntries:
      - name: "hardened-entry-1"
        spec:
          hosts:
            - "service1.example.com"
          location: MESH_EXTERNAL
          resolution: DNS
      - name: "hardened-entry-2"
        spec:
          hosts:
            - "service2.example.com"
          location: MESH_EXTERNAL
          resolution: DNS
    kiali.values.istio.serviceEntries.custom:
      - name: "istio-entry-1"
        spec:
          hosts:
            - "service3.example.com"
          location: MESH_EXTERNAL
          resolution: DNS
  asserts:
  - hasDocuments:
      count: 3
  - documentIndex: 0
    equal:
      path: metadata.name
      value: hardened-entry-1
  - documentIndex: 1
    equal:
      path: metadata.name
      value: hardened-entry-2
  - documentIndex: 2
    equal:
      path: metadata.name
      value: istio-entry-1
