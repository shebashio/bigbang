# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Gitlab Runner - Values Tests
templates:
  - templates/gitlab-runner/values.yaml
tests:
  - it: should set app selector for gitlab runner egress and ingress netpols
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.common' - | yq eval '.'"
    set:
      packages.gitlabRunner.enabled: true
      networkPolicies.enabled: true
    asserts:
      - equal:
          path: bb-common.networkPolicies.egress.from.gitlab-runner.podSelector.matchLabels.app
          value: gitlab-runner
      - equal:
          path: bb-common.networkPolicies.ingress.to["gitlab-runner:9252"].podSelector.matchLabels.app
          value: gitlab-runner

  - it: should set runner secret when auto registration is enabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.gitlab.enabled: true
      packages.gitlabRunner.enabled: true
      packages.kyverno.enabled: true
    asserts:
      - equal:
          path: autoRegister.enabled
          value: true
      - equal:
          path: upstream.runners.secret
          value: gitlab-gitlab-runner-secret

  - it: should not set runner secret when auto registration is disabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      packages.gitlab.enabled: true
      packages.gitlabRunner.enabled: true
      packages.gitlabRunner.autoRegister.enabled: false
      packages.kyverno.enabled: true
    asserts:
      - equal:
          path: autoRegister.enabled
          value: false
      - notExists:
          path: upstream.runners.secret
