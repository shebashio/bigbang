# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - MinIO - Values
templates:
  - templates/minio/values.yaml
tests:
  - it: should scope common values under bb-common and render the istio roll annotation
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '{\"common\": (.stringData.common | from_yaml), \"defaults\": (.stringData.defaults | from_yaml)}' -"
    set:
      packages.minio.enabled: true
      istio.ambient.enabled: true
    asserts:
      - equal:
          path: defaults.upstream.tenant.poolsMetadata.annotations["bigbang.dev/istioDataplane"]
          value: ambient
      - exists:
          path: common.bb-common.istio
      - exists:
          path: common.bb-common.networkPolicies
      - exists:
          path: common.bb-common.routes
      - notExists:
          path: common.istio
      - notExists:
          path: common.networkPolicies
      - notExists:
          path: common.routes
      - notExists:
          path: defaults.bb-common
      - notExists:
          path: defaults.istio
      - notExists:
          path: defaults.networkPolicies
      - notExists:
          path: defaults.routes
