# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Schema - Istio Gateway Values
tests:
  - it: should pass validation with default values
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with acceptable values
    set:
      packages:
        istioGateway:
          values:
            gateways:
              custom:
                upstream:
                  labels:
                    istio: ingressgateway
                gateway:
                  servers:
                    - hosts:
                        - "*.example.com"
                      port:
                        name: https
                        number: 8443
                        protocol: HTTPS
                      tls:
                        credentialName: cert
                      mode: SIMPLE
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with waitJob values
    set:
      packages:
        istioGateway:
          values:
            shared:
              waitJob:
                enabled: false
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with classificationBanner values
    set:
      packages:
        istioGateway:
          values:
            shared:
              classificationBanner:
                enabled: true
                classificationLevel: cui
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with gateway values
    set:
      packages:
        istioGateway:
          values:
            shared:
              gateway:
                servers:
                  - hosts:
                      - '*.dev.bigbang.mil'
                    port:
                      name: http
                      number: 8080
                      protocol: HTTP
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with gluon values
    set:
      packages:
        istioGateway:
          values:
            shared:
              gluon:
                wait:
                  enabled: true
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with networkPolicies values
    set:
      packages:
        istioGateway:
          values:
            shared:
              networkPolicies:
                enabled: true
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with mtls values
    set:
      packages:
        istioGateway:
          values:
            shared:
              mtls:
                mode: STRICT
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with tracing values
    set:
      packages:
        istioGateway:
          values:
            shared:
              tracing:
                enabled: true
    asserts:
      - notFailedTemplate: {}
  - it: should pass validation with upstream values
    set:
      packages:
        istioGateway:
          values:
            shared:
              upstream:
                image:
                  registry: registry1.dso.mil
    asserts:
      - notFailedTemplate: {}
  - it: should fail validation with invalid istioGateway values
    set:
      packages:
        istioGateway:
          values:
            invalidProperty:
              foo: bar
    asserts:
      - failedTemplate:
          errorPattern: ".*"
  - it: should fail validation with package values outside shared or gateways
    set:
      packages:
        istioGateway:
          values:
            waitJob:
              enabled: false
    asserts:
      - failedTemplate:
          errorPattern: ".*"
