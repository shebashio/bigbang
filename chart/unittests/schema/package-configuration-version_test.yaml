# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Schema - Package Configuration Version
templates:
  - templates/kiali/helmrelease.yaml
  - templates/kiali/values.yaml
  - templates/package/helmrelease.yaml
release:
  name: test
tests:
  - it: should use the unified package contract by default
    set:
      packages:
        kiali:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/kiali/helmrelease.yaml
      - hasDocuments:
          count: 0
        template: templates/package/helmrelease.yaml

  - it: should interpret catalog names as built-ins
    set:
      packages:
        kiali:
          enabled: true
          git:
            repo: https://example.com/canonical-kiali.git
            path: chart
            tag: v1
    asserts:
      - equal:
          path: metadata.name
          value: kiali
        template: templates/kiali/helmrelease.yaml
      - hasDocuments:
          count: 0
        template: templates/package/helmrelease.yaml

  - it: should reject unsupported package configuration versions
    set:
      packageConfiguration:
        version: v2
    asserts:
      - failedTemplate:
          errorPattern: ".*packageConfiguration/version.*must be 'v1'.*"
