# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Schema - Addons
tests:
  - it: should pass validation with the pre-release GitLab branch reference
    set:
      addons:
        gitlab:
          sourceType: "git"
          git:
            tag: null
            branch: renovate/ironbank
    asserts:
      - notFailedTemplate: {}

  - it: should fail validation without a usable git reference
    set:
      addons:
        gitlab:
          sourceType: "git"
          git:
            tag: null
            branch: ""
    asserts:
      - failedTemplate:
          errorPattern: ".*"

  - it: should fail validation with unknown addon (foo)
    set:
      addons:
        foo:
          extra: key
    asserts:
      - failedTemplate:
          errorPattern: ".*"

  - it: should fail validation when a GitLab dependency is missing its name
    set:
      addons:
        gitlab:
          dependsOn:
            - namespace: bigbang
    asserts:
      - failedTemplate:
          errorPattern: ".*"

  - it: should fail validation when a GitLab object storage endpoint omits its URI scheme
    set:
      addons:
        gitlab:
          objectStorage:
            endpoint: garage.garage.svc.cluster.local:3900
    asserts:
      - failedTemplate:
          errorPattern: "addons.gitlab.objectStorage.endpoint"
