# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Schema - Addons
tests:
  - it: should fail validation with invalid addon configuration (git tag invalid type)
    set:
      packages:
        gitlab:
          sourceType: "git"
          git:
            tag: 123
    asserts:
      - failedTemplate:
          errorPattern: ".*"

  - it: should fail validation with unknown addon (foo)
    set:
      addons:
        foo:
          extra: key
    asserts:
      - failedTemplate:
          errorPattern: ".*"

  - it: should fail validation when a GitLab dependency is missing its name
    set:
      packages:
        gitlab:
          dependsOn:
            - namespace: bigbang
    asserts:
      - failedTemplate:
          errorPattern: ".*"

  - it: should fail validation when a Mimir dependency is missing its name
    set:
      packages:
        mimir:
          dependsOn:
            - namespace: bigbang
    asserts:
      - failedTemplate:
          errorPattern: ".*"
