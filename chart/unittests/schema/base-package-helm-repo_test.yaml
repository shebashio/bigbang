# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Schema - Base Package Helm Repo
tests:
  - it: should pass validation with valid helmRepo configuration
    set:
      packages:
        kiali:
          enabled: true
          sourceType: "helmRepo"
          helmRepo:
            repoName: "repo"
            chartName: "kiali"
            tag: "1.65.0-bb.0"
    asserts:
      - notFailedTemplate: {}

  - it: should pass validation with helmRepo even when git config is invalid
    set:
      packages:
        kiali:
          sourceType: "helmRepo"
          helmRepo:
            repoName: "registry1"
            chartName: "kiali"
            tag: "1.65.0-bb.0"
          git:
            repo: https://repo1.dso.mil/big-bang/product/packages/kiali.git
            path: "./chart"
            tag: null
            commit: "1234"
    asserts:
      - notFailedTemplate: {}

  - it: should fail validation with helmRepo invalid repoName type
    set:
      packages:
        kiali:
          enabled: true
          sourceType: "helmRepo"
          helmRepo:
            repoName: 123
            chartName: "kiali"
            tag: "1.65.0-bb.0"
    asserts:
      - failedTemplate:
          errorPattern: ".*"

  - it: should fail validation with helmRepo invalid repoName type and extra key
    set:
      packages:
        kiali:
          enabled: true
          sourceType: "helmRepo"
          helmRepo:
            repoName: 123
            chartName: "kiali"
            tag: "1.65.0-bb.0"
            extra: key
    asserts:
      - failedTemplate:
          errorPattern: ".*"
