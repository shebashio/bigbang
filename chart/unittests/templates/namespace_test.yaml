# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Templates - Common Namespace Resources
tests:
  - it: should preserve standard Namespace sidecar-injection labels
    template: argocd/namespace.yaml
    set:
      istiod:
        enabled: true
      addons:
        argocd:
          enabled: true
          istio:
            injection: enabled
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: argocd
      - equal:
          path: metadata.labels["istio-injection"]
          value: enabled

  - it: should disable standard Namespace sidecar injection when Istio is globally disabled
    template: argocd/namespace.yaml
    set:
      istiod:
        enabled: false
      addons:
        argocd:
          enabled: true
          istio:
            injection: enabled
    asserts:
      - equal:
          path: metadata.labels["istio-injection"]
          value: disabled
      - notExists:
          path: metadata.labels["istio.io/dataplane-mode"]

  - it: should preserve standard Namespace ambient labels
    template: argocd/namespace.yaml
    set:
      istio:
        ambient:
          enabled: true
      addons:
        argocd:
          enabled: true
    asserts:
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: ambient
      - notExists:
          path: metadata.labels["istio-injection"]

  - it: should preserve forced mesh labels and additional labels
    template: gatekeeper/namespace.yaml
    set:
      gatekeeper:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["istio-injection"]
          value: disabled
      - equal:
          path: metadata.labels["admission.gatekeeper.sh/ignore"]
          value: no-self-managing
      - equal:
          path: metadata.labels["gatekeeper.sh/system"]
          value: "yes"

  - it: should keep a sidecar-only Namespace out of ambient mode
    template: renovate/namespace.yaml
    set:
      istiod:
        enabled: true
      istio:
        ambient:
          enabled: true
      renovate:
        enabled: true
        istio:
          injection: enabled
    asserts:
      - equal:
          path: metadata.labels["istio-injection"]
          value: enabled
      - notExists:
          path: metadata.labels["istio.io/dataplane-mode"]
