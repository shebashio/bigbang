# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Wrapper Values Tests
templates:
  - templates/wrapper/values.yaml
release:
  name: test
set:
  istio:
    enabled: true
    ambient:
      enabled: true
  packages:
    example:
      enabled: true
      sourceType: git
      git:
        repo: https://example.com/example.git
        path: chart
        tag: 1.0.0
      wrapper:
        enabled: true
postRenderer:
  cmd: "sh"
  args:
    - "-c"
    - "yq eval '.stringData[\"values.yaml\"]' - | yq eval '.'"
tests:
  - it: passes Istio enabled and ambient mode to wrapper values
    asserts:
      - equal:
          path: bigbang.istio.enabled
          value: true
      - equal:
          path: bigbang.istio.ambient.enabled
          value: true
